  <script>
    // Filter noisy extension JSON.parse('undefined') errors (does not affect app logic)
    // IMPORTANT: This must be the first script to catch extension errors
    (function(){
      try {
        const patterns = [
          /\"undefined\" is not valid JSON/i,
          /\"null\" is not valid JSON/i,
          /Unexpected token 'u'.*JSON/i,
          /Unexpected token 'n'.*JSON/i,
          /SyntaxError.*undefined.*JSON/i,
          /SyntaxError.*null.*JSON/i,
          /JSON\.parse/i,
          /updateConfig/i,
          /initConfig/i,
          /metadata\.js/i,
          /content\.js/i,
        ];
        const matchMsg = (msg) => {
          try { return patterns.some((re) => re.test(String(msg || ''))); } catch { return false; }
        };

        // Check if error is from extension (check stack trace)
        const isExtensionError = (error) => {
          try {
            if (!error) return false;
            const stack = error.stack || error.toString();
            // Check for common extension patterns
            if (/chrome-extension:\/\//i.test(stack)) return true;
            if (/moz-extension:\/\//i.test(stack)) return true;
            if (/safari-extension:\/\//i.test(stack)) return true;
            if (/webkit-masked-url:\/\//i.test(stack)) return true;
            if (/metadata\.js/i.test(stack)) return true;
            if (/content\.js/i.test(stack)) return true;
            if (/updateConfig|initConfig/i.test(stack)) return true;
            return false;
          } catch (_) {
            return false;
          }
        };

        // Override console methods
        const ce = console.error ? console.error.bind(console) : null;
        const cw = console.warn ? console.warn.bind(console) : null;
        if (ce) {
          console.error = function(...args){
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            // Check if it's an error object
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return ce(...args);
          };
        }
        if (cw) {
          console.warn = function(...args){
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return cw(...args);
          };
        }

        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', (ev) => {
          try {
            const reason = ev?.reason;
            // Check message
            const msg = reason?.message || reason?.toString?.() || reason;
            if (matchMsg(String(msg||''))) {
              ev.preventDefault();
              return;
            }
            // Check if from extension
            if (isExtensionError(reason)) {
              ev.preventDefault();
              return;
            }
          } catch(_) {}
        });

        // Catch error events
        window.addEventListener('error', (ev) => {
          try {
            const msg = ev?.message || '';
            if (matchMsg(String(msg))) {
              ev.preventDefault();
              return;
            }
            // Check if error is from extension
            if (ev?.error && isExtensionError(ev.error)) {
              ev.preventDefault();
              return;
            }
            // Check filename for extension patterns
            const filename = ev?.filename || '';
            if (/chrome-extension|moz-extension|safari-extension|webkit-masked-url|metadata\.js|content\.js/i.test(filename)) {
              ev.preventDefault();
              return;
            }
          } catch(_) {}
        }, true);
      } catch (_) {}
    })();
  </script>

  <script>
    // Initialize user info display
    (async function initUserInfo() {
      try {
        // Check if user is logged in
        const token = localStorage.getItem('linglish_token') ||
                     localStorage.getItem('authToken') ||
                     sessionStorage.getItem('linglish_token') ||
                     sessionStorage.getItem('authToken');

        if (!token) {
          console.log('[Mobile More] No token found');
          return;
        }

        // Fetch user data
        const API_BASE = window.location.hostname === 'localhost' ||
                        window.location.hostname === '127.0.0.1' ||
                        window.location.port === '4000'
          ? 'http://localhost:4000'
          : '';

        const response = await fetch(`${API_BASE}/users/me`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error('Failed to fetch user data');
        }

        const user = await response.json();
        console.log('[Mobile More] User data:', user);

        // Extract display name
        let displayName = 'User';
        if (user.username) {
          displayName = user.username;
        } else if (user.email) {
          displayName = user.email.split('@')[0];
        }

        // Show user info section
        const userInfoEl = document.getElementById('mobile-user-info');
        const userNameEl = document.getElementById('mobile-user-name');
        const vipBadgeEl = document.getElementById('mobile-vip-badge');

        if (userInfoEl) {
          userInfoEl.hidden = false;
        }

        if (userNameEl) {
          userNameEl.textContent = displayName;
        }

        // Show VIP badge if user is VIP or Family member
        if (vipBadgeEl && user.membership_type && user.membership_type !== 'free') {
          vipBadgeEl.hidden = false;
          const isFamily = user.membership_type === 'family';
          vipBadgeEl.classList.remove('vip', 'family');
          vipBadgeEl.classList.add(isFamily ? 'family' : 'vip');

          const vipTextEl = vipBadgeEl.querySelector('.vip-text');
          if (vipTextEl) {
            vipTextEl.textContent = isFamily ? 'Family' : 'VIP';
          }

          console.log('[Mobile More] VIP badge shown:', user.membership_type);
        } else {
          console.log('[Mobile More] User is free tier');
        }

      } catch (error) {
        console.error('[Mobile More] Failed to load user info:', error);
      }
    })();
  </script>
