      *{box-sizing:border-box}
      body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.15), transparent), radial-gradient(1000px 600px at 110% 10%, rgba(34,211,238,.12), transparent), linear-gradient(135deg,#0a0e1a,#0f172a);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem}

      .btn.primary{background:linear-gradient(120deg,var(--brand),var(--accent));border-color:transparent;color:#fff;box-shadow:0 12px 30px rgba(99,102,241,.35)}
      .kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.35);padding:.2rem .45rem;border-radius:6px;color:#e2e8f0;border:1px solid rgba(255,255,255,.08)}
      .inline-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .5rem;border-radius:999px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.35);}
