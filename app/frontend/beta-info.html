<!DOCTYPE html>
<html lang="zh-CN">
  <head>
  <script src="./js/auth-manager.js?v=2"></script>
<script src="./js/nav-back.js?v=1"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>感谢升级 · Beta 说明</title>
    <style>
      :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --brand:#0ea5e9; }
      *{box-sizing:border-box}
      body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#111827);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
      .card{max-width:720px;width:100%;background:rgba(17,24,39,.85);border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:1.25rem}
      .hero{padding:1rem 1rem 0}
      h1{margin:.2rem 0 .5rem;font-size:1.6rem}
      p{margin:.4rem 0;color:var(--muted)}
      .section{margin:1rem 0;padding:1rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px}
      .row{display:flex;gap:.75rem;align-items:center}
      .btns{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap}
      .btn{padding:.55rem .9rem;border-radius:10px;border:1px solid rgba(255,255,255,.12);cursor:pointer;color:var(--text);text-decoration:none}
      .btn.primary{background:linear-gradient(120deg,#0ea5e9,#5eead4);border-color:transparent;color:#fff}
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.3);padding:.2rem .4rem;border-radius:6px}
      @media (max-width: 768px){ h1{font-size:1.4rem} }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="hero">
        <h1>🎉 感谢升级 家庭VIP</h1>
        <p>Linglish 正处于 <strong>Beta 测试阶段</strong>。我们会持续完善功能与体验，欢迎通过反馈入口提出建议。</p>
      </div>


      <div class="section">
        <h3>联系我们</h3>
        <p>如需协助或有建议，欢迎添加微信：</p>
        <div class="row"><span>微信</span> <code class="mono">Linglishvip</code></div>
        <p style="margin-top:.4rem;">你也可以在“成长中心 → 帮助与反馈”页面提交反馈。</p>
      </div>

      <div class="btns">
        <a class="btn" href="./index.html" title="返回首页">←</a>
        <a class="btn primary" href="./video-upload.html">开始上传视频</a>
      </div>
    </div>
  </body>
  </html>
