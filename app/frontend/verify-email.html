<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="./js/auth-manager.js?v=2"></script>
<script src="./js/nav-back.js?v=1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>验证邮箱 | Linglish</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e0ea;
      --paper: #f7f8fb;
      --surface: #ffffff;
      --teal: #0f766e;
      --teal-dark: #115e59;
      --blue: #2563eb;
      --amber: #f59e0b;
      --rose: #be123c;
      --shadow: 0 22px 70px rgba(23, 32, 51, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(247, 248, 251, 0.96)),
        repeating-linear-gradient(90deg, rgba(15, 118, 110, 0.05) 0, rgba(15, 118, 110, 0.05) 1px, transparent 1px, transparent 76px),
        var(--paper);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar,
    .wrap,
    .footer {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 850;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #ffffff;
      background: #172033;
      font-weight: 900;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(360px, 1.05fr);
      gap: 28px;
      align-items: stretch;
      padding: 16px 0 42px;
    }

    .context,
    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(217, 224, 234, 0.9);
      box-shadow: var(--shadow);
      border-radius: 8px;
    }

    .context {
      min-height: 540px;
      padding: 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .kicker {
      margin-bottom: 14px;
      color: var(--teal);
      font-weight: 850;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-size: clamp(2.1rem, 4.5vw, 4.35rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .lead {
      max-width: 34rem;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.75;
    }

    .trust-list {
      display: grid;
      gap: 14px;
      margin-top: 34px;
    }

    .trust-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.94rem;
    }

    .trust-item b {
      display: block;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .dot {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #ffffff;
      background: var(--teal);
      font-weight: 850;
      font-size: 0.82rem;
    }

    .visual {
      display: flex;
      align-items: flex-end;
      gap: 18px;
      margin-top: 32px;
      padding-top: 26px;
      border-top: 1px solid var(--line);
    }

    .visual img {
      width: 112px;
      height: 112px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .visual p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.92rem;
    }

    .panel {
      min-height: 540px;
      padding: 34px;
      display: grid;
      align-content: center;
    }

    .status-mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      margin-bottom: 18px;
      color: #ffffff;
      background: var(--blue);
      font-weight: 900;
      font-size: 1.35rem;
    }

    .status-mark.success { background: var(--teal); }
    .status-mark.error { background: var(--rose); }
    .status-mark.warn { background: var(--amber); }

    h2 {
      margin: 0;
      font-size: 1.9rem;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .panel-copy {
      margin: 12px 0 24px;
      color: var(--muted);
      line-height: 1.68;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      cursor: pointer;
      font: inherit;
      font-weight: 850;
      transition: transform 0.16s ease, background 0.16s ease, opacity 0.16s ease;
    }

    .btn:hover { transform: translateY(-1px); text-decoration: none; }
    .btn:disabled { cursor: not-allowed; opacity: 0.62; transform: none; }

    .btn-primary {
      color: #ffffff;
      background: var(--teal);
    }

    .btn-primary:hover { background: var(--teal-dark); }

    .btn-secondary {
      color: var(--ink);
      background: #eef2f7;
    }

    .dev-link {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border: 1px dashed #93c5fd;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e3a8a;
      word-break: break-all;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .dev-link.show { display: block; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 18px 0 26px;
      border-top: 1px solid rgba(217, 224, 234, 0.75);
    }

    .footer-links {
      display: inline-flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    @media (max-width: 860px) {
      .wrap { grid-template-columns: 1fr; gap: 16px; padding-top: 0; }
      .context, .panel { min-height: auto; padding: 24px; }
      h1 { max-width: 12ch; }
    }

    @media (max-width: 520px) {
      .topbar, .wrap, .footer { width: min(100% - 22px, 1120px); }
      .topbar { padding: 16px 0; }
      .brand span:last-child { display: none; }
      .top-actions { gap: 10px; font-size: 0.88rem; }
      .context, .panel { padding: 20px; }
      .visual img { width: 88px; height: 88px; }
      h2 { font-size: 1.5rem; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="./landing.html" aria-label="返回 Linglish 首页">
        <span class="brand-mark">L</span>
        <span>Linglish</span>
      </a>
      <nav class="top-actions" aria-label="账号导航">
        <a href="./desktop-auth.html?from=verify_email" id="login-link">登录</a>
        <a href="./today.html?from=verify_email">今日训练</a>
      </nav>
    </header>

    <main class="wrap">
      <section class="context" aria-labelledby="page-title">
        <div>
          <div class="kicker">Email Trust</div>
          <h1 id="page-title">确认你的学习邮箱</h1>
          <p class="lead">验证邮箱后，Linglish 可以更可靠地处理密码找回、订阅通知、学习报告和团队版邀请。</p>

          <div class="trust-list" aria-label="邮箱验证价值">
            <div class="trust-item">
              <span class="dot">1</span>
              <span><b>保护账号</b>密码找回和安全通知会发送到已验证邮箱。</span>
            </div>
            <div class="trust-item">
              <span class="dot">2</span>
              <span><b>保障付费</b>订阅、发票和账单问题能更快对应到正确账号。</span>
            </div>
            <div class="trust-item">
              <span class="dot">3</span>
              <span><b>延续训练</b>学习报告和团队邀请不会丢到无效地址。</span>
            </div>
          </div>
        </div>

        <div class="visual">
          <img src="./assets/lingbao_3d.jpg" alt="Linglish 学习助手">
          <p>如果链接失效，请登录后重新发送验证邮件；如果收不到邮件，可以联系支持人工处理。</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="status-title">
        <div class="status-mark" id="status-mark">…</div>
        <h2 id="status-title">正在验证邮箱</h2>
        <p class="panel-copy" id="status-copy">我们正在确认这封验证邮件是否仍然有效。</p>
        <div class="actions">
          <a class="btn btn-primary" id="primary-action" href="./today.html?from=email_verified">进入今日训练</a>
          <button class="btn btn-secondary" id="resend-button" type="button">重新发送验证邮件</button>
        </div>
        <div id="dev-link" class="dev-link"></div>
      </section>
    </main>

    <footer class="footer">
      <span>© 2026 Linglish</span>
      <span class="footer-links">
        <a href="./privacy.html">隐私政策</a>
        <a href="./terms.html">用户协议</a>
        <a href="mailto:hello@example.com">hello@example.com</a>
      </span>
    </footer>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const token = (params.get('token') || '').trim();
      const from = (params.get('from') || '').trim();
      const statusMark = document.getElementById('status-mark');
      const statusTitle = document.getElementById('status-title');
      const statusCopy = document.getElementById('status-copy');
      const primaryAction = document.getElementById('primary-action');
      const resendButton = document.getElementById('resend-button');
      const devLink = document.getElementById('dev-link');
      const loginLink = document.getElementById('login-link');

      function readToken() {
        const keys = ['linglish_token', 'authToken', 'token'];
        for (const key of keys) {
          try {
            const value = localStorage.getItem(key) || sessionStorage.getItem(key);
            if (value && value !== 'null' && value !== 'undefined') return value;
          } catch (_) {}
        }
        return null;
      }

      function isMobile() {
        return /mobile|android|iphone|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent.toLowerCase()) || window.innerWidth < 768;
      }

      loginLink.href = (isMobile() ? './mobile-auth.html' : './desktop-auth.html') + '?from=verify_email';

      function setStatus(kind, title, copy, markText) {
        statusMark.className = 'status-mark ' + (kind || '');
        statusMark.textContent = markText || (kind === 'success' ? '✓' : kind === 'error' ? '!' : '…');
        statusTitle.textContent = title;
        statusCopy.textContent = copy;
      }

      function track(eventName, properties) {
        try {
          fetch('/track/event', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event_name: eventName,
              properties: {
                from: from || null,
                has_token: Boolean(token),
                ...properties,
              },
            }),
            keepalive: true,
          }).catch(function () {});
        } catch (_) {}
      }

      async function postJson(url, body, authToken) {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers.Authorization = 'Bearer ' + authToken;
        const response = await fetch(url, {
          method: 'POST',
          headers,
          body: JSON.stringify(body || {}),
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) {
          const err = new Error(data.message || 'REQUEST_FAILED');
          err.payload = data;
          throw err;
        }
        return data;
      }

      async function confirmEmail() {
        if (!token) {
          setStatus('warn', '需要验证链接', '请打开邮件里的验证链接，或登录后重新发送验证邮件。', 'i');
          primaryAction.textContent = '返回登录';
          primaryAction.href = loginLink.href;
          return;
        }

        track('auth_email_verify_confirm');
        try {
          await postJson('/auth/email-verification/confirm', { token });
          setStatus('success', '邮箱已验证', '你的 Linglish 账号邮箱已确认。现在可以继续训练或管理会员。', '✓');
          primaryAction.textContent = '进入今日训练';
          primaryAction.href = './today.html?from=email_verified';
          resendButton.disabled = true;
          track('auth_email_verify_success');
        } catch (err) {
          setStatus('error', '验证链接失效', err.message === 'INVALID_OR_EXPIRED_EMAIL_VERIFICATION_TOKEN'
            ? '这条验证链接已过期或已使用。请登录后重新发送验证邮件。'
            : '暂时无法完成验证，请稍后重试。', '!');
          primaryAction.textContent = '返回登录';
          primaryAction.href = loginLink.href;
          track('auth_email_verify_error', { reason: err.message || 'REQUEST_FAILED' });
        }
      }

      resendButton.addEventListener('click', async function () {
        const authToken = readToken();
        if (!authToken) {
          setStatus('warn', '请先登录', '重新发送验证邮件需要先确认当前账号。', 'i');
          primaryAction.textContent = '返回登录';
          primaryAction.href = loginLink.href;
          return;
        }

        resendButton.disabled = true;
        resendButton.textContent = '发送中...';
        devLink.className = 'dev-link';
        devLink.textContent = '';
        track('auth_email_verify_resend');

        try {
          const data = await postJson('/auth/email-verification/request', {}, authToken);
          if (data.already_verified) {
            setStatus('success', '邮箱已验证', '这个账号的邮箱已经完成验证。', '✓');
            track('auth_email_verify_resend_success', { already_verified: true });
          } else if (data.delivery_configured === false) {
            setStatus('warn', '验证申请已创建', '当前环境尚未配置自动邮件，请联系支持或在开发环境使用调试链接。', 'i');
            track('auth_email_verify_resend_success', { delivery_configured: false });
          } else {
            setStatus('success', '验证邮件已发送', '请打开邮箱，点击新邮件里的验证链接。', '✓');
            track('auth_email_verify_resend_success', { delivery_configured: true });
          }
          if (data.verification_url) {
            devLink.className = 'dev-link show';
            devLink.textContent = '开发调试链接：';
            const link = document.createElement('a');
            link.href = data.verification_url;
            link.textContent = data.verification_url;
            devLink.appendChild(link);
          }
        } catch (err) {
          setStatus('error', '发送失败', '暂时无法重新发送验证邮件，请稍后重试。', '!');
          track('auth_email_verify_resend_error', { reason: err.message || 'REQUEST_FAILED' });
        } finally {
          resendButton.disabled = false;
          resendButton.textContent = '重新发送验证邮件';
        }
      });

      track('auth_email_verify_page_view');
      confirmEmail();
    })();
  </script>
<link rel="stylesheet" href="./styles/speak-ui.css?v=3">
</body>
</html>
