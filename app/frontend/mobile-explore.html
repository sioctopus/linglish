  <script>
    // Safe storage access helpers (防止隐私设置阻止 storage 访问)
    const safeStorage = {
      set: function (storage, key, value) {
        try {
          if (storage && typeof storage.setItem === 'function') {
            storage.setItem(key, value);
            return true;
          }
        } catch (e) {
          console.warn('[Storage] Failed to set:', key, e.message);
        }
        return false;
      },
      get: function (storage, key) {
        try {
          if (storage && typeof storage.getItem === 'function') {
            return storage.getItem(key);
          }
        } catch (e) {
          console.warn('[Storage] Failed to get:', key, e.message);
        }
        return null;
      },
      remove: function (storage, key) {
        try {
          if (storage && typeof storage.removeItem === 'function') {
            storage.removeItem(key);
            return true;
          }
        } catch (e) {
          console.warn('[Storage] Failed to remove:', key, e.message);
        }
        return false;
      },
      // 清理所有认证相关数      clearAuth: function () {
        const keys = ['authToken', 'linglish_token', 'userEmail', 'is_guest', 'guest_id', 'isGuest'];
        keys.forEach(key => {
          this.remove(localStorage, key);
          this.remove(sessionStorage, key);
        });
      }
    };

    // Haptic Feedback Helper
    const triggerHaptic = () => {
      if (navigator.vibrate) navigator.vibrate(10);
    };

    // Ripple Effect Helper
    const createRipple = (event) => {
      const button = event.currentTarget;
      const circle = document.createElement('span');
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
      circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
      circle.classList.add('ripple-effect');

      const ripple = button.getElementsByClassName('ripple-effect')[0];
      if (ripple) {
        ripple.remove();
      }

      button.appendChild(circle);
    };

    // Bind interactions
    document.addEventListener('click', (e) => {
      const target = e.target.closest('button, a, .video-card, .category-tab, .tag-filter-chip, .nav-item');
      if (target) {
        triggerHaptic();
        createRipple({ currentTarget: target, clientX: e.clientX, clientY: e.clientY });
      }
    });
  </script>

  <script>
    // Initialize i18n on mobile explore
    if (typeof i18n !== 'undefined') {
      try {
        i18n.init();
      } catch (e) {
        console.error('[i18n] Failed to initialize:', e);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof i18n !== 'undefined') {
        i18n.init();
      }
    });

    // Initialize language selector
    window.addEventListener('DOMContentLoaded', () => {
      const langSelectorBtn = document.getElementById('lang-selector-btn');
      const langModal = document.getElementById('lang-modal');
      const langModalBackdrop = document.getElementById('lang-modal-backdrop');
      const langModalClose = document.getElementById('lang-modal-close');

      // Get selected language from localStorage or i18n
      const getSelectedLang = () => {
        try {
          if (typeof i18n !== 'undefined' && i18n.currentLang) {
            return i18n.currentLang;
          }
          return localStorage.getItem('linglish_lang') || 'zh';
        } catch (_) {
          return 'zh';
        }
      };

      // Update active state
      const updateActiveState = () => {
        const savedLang = getSelectedLang();
        document.querySelectorAll('.lang-option-mobile').forEach(opt => {
          opt.classList.toggle('active', opt.dataset.lang === savedLang);
        });
      };

      // Show modal
      const showModal = () => {
        langModal && langModal.classList.add('show');
        langModalBackdrop && langModalBackdrop.classList.add('show');
        document.body.style.overflow = 'hidden';
      };

      // Hide modal
      const hideModal = () => {
        langModal && langModal.classList.remove('show');
        langModalBackdrop && langModalBackdrop.classList.remove('show');
        document.body.style.overflow = '';
      };

      // Open modal
      langSelectorBtn && langSelectorBtn.addEventListener('click', showModal);

      // Close modal
      langModalClose && langModalClose.addEventListener('click', hideModal);
      langModalBackdrop && langModalBackdrop.addEventListener('click', hideModal);

      // Select language
      document.querySelectorAll('.lang-option-mobile').forEach(option => {
        option.addEventListener('click', () => {
          const lang = option.dataset.lang;
          const langName = (option.querySelector('.voice-option-text') && option.querySelector('.voice-option-text').textContent) || lang;
          if (lang) {
            try {
              localStorage.setItem('linglish_lang', lang);
              // Update i18n if available
              if (typeof i18n !== 'undefined' && i18n.setLang) {
                i18n.setLang(lang);
              }
            } catch (_) { }
            updateActiveState();
            hideModal();

            // Show toast
            try {
              const changedText = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('mobile.lang.changed') : '已切换到';
              const applyText = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('mobile.lang.apply_all') : '（全站生效）';
              const toast = document.createElement('div');
              toast.textContent = `${changedText} ${langName}${applyText}`;
              toast.style.position = 'fixed';
              toast.style.left = '50%';
              toast.style.bottom = '90px';
              toast.style.transform = 'translateX(-50%)';
              toast.style.background = 'rgba(0,0,0,0.85)';
              toast.style.color = '#fff';
              toast.style.padding = '12px 18px';
              toast.style.borderRadius = '12px';
              toast.style.fontSize = '14px';
              toast.style.zIndex = '10000';
              toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
              document.body.appendChild(toast);
              setTimeout(() => toast.remove(), 2000);
            } catch (_) { }
          }
        });
      });

      // Initialize active state
      updateActiveState();
    });

    // Normalize API base to current origin to avoid www/non-www CORS redirects
    function resolveApiBase() {
      const loc = (typeof window !== 'undefined' && window.location) ? window.location : null;
      const explicit = (typeof window !== 'undefined') ? (window.API_BASE || window.API_PREFIX || '') : '';

      const normalize = (base) => {
        if (!base) return '';
        try {
          const pageOrigin = loc && loc.origin ? loc.origin : '';
          const resolved = new URL(base, pageOrigin || undefined).origin;
          // If only www/no-www differs, stick to current origin to avoid cross-origin redirects
          const norm = (v) => String(v || '').replace('://www.', '://');
          if (norm(resolved) === norm(pageOrigin)) return pageOrigin || resolved;
          return resolved;
        } catch (_) {
          return base;
        }
      };

      if (explicit) return normalize(explicit);
      if (loc && (loc.hostname === 'localhost' || loc.hostname === '127.0.0.1' || loc.port === '4000')) {
        return 'http://localhost:4000';
      }
      if (loc && loc.origin) return loc.origin;
      return '';
    }

    const API_BASE = resolveApiBase();

    function getAuthToken() {
      try {
        if (typeof authManager !== 'undefined' && authManager && typeof authManager.getUserInfo === 'function') {
          const info = authManager.getUserInfo();
          if (info && info.token) return info.token;
        }
      } catch (_) { }
      try {
        if (typeof authManager !== 'undefined' && authManager && typeof authManager.getToken === 'function') {
          const t = authManager.getToken();
          if (t) return t;
        }
      } catch (_) { }
      try {
        if (typeof window !== 'undefined' && window.AuthManager && typeof window.AuthManager.getToken === 'function') {
          const t = window.AuthManager.getToken();
          if (t) return t;
        }
      } catch (_) { }
      try {
        const ls = (typeof localStorage !== 'undefined') ? (localStorage.getItem('linglish_token') || localStorage.getItem('authToken')) : null;
        if (ls) return ls;
        const ss = (typeof sessionStorage !== 'undefined') ? (sessionStorage.getItem('linglish_token') || sessionStorage.getItem('authToken')) : null;
        if (ss) return ss;
      } catch (_) { }
      try {
        if (typeof document !== 'undefined') {
          const match = document.cookie.match(/(?:^|;\s*)(linglish_token|authToken)=([^;]+)/);
          if (match && match[2]) return decodeURIComponent(match[2]);
        }
      } catch (_) { }
      return null;
    }

    function escapeHtml(input = '') {
      return String(input)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds <= 0) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function formatDurationText(seconds) {
      const t = (key, fallback) => (typeof i18n !== 'undefined' && i18n.t) ? i18n.t(key) : fallback;
      if (!Number.isFinite(seconds) || seconds <= 0) {
        return t('mobile.arena.card.duration_unknown', '时长未知');
      }
      if (seconds < 60) {
        const unit = t('mobile.arena.card.seconds', ');
        return `${Math.max(1, Math.round(seconds))} ${unit}`;
      }
      const mins = Math.max(1, Math.round(seconds / 60));
      const unit = t('mobile.arena.card.minutes', '分钟');
      return `${mins} ${unit}`;
    }

    function estimateWordCount(transcript = '') {
      const normalized = String(transcript).replace(/\s+/g, ' ').trim();
      if (!normalized) return 0;
      const parts = normalized.split(' ').filter(Boolean);
      if (parts.length > 1) return parts.length;
      return Math.min(normalized.length, 2000);
    }

    function formatLanguage(language) {
      const t = (key, fallback) => (typeof i18n !== 'undefined' && i18n.t) ? i18n.t(key) : fallback;
      const normalized = (language || '').toLowerCase();
      switch (normalized) {
        case 'en':
        case 'eng':
          return '🇬🇧 en';
        case 'zh':
        case 'zh-cn':
          return '🇨🇳 zh';
        case 'fr':
          return '🇫🇷 fr';
        case 'es':
          return '🇪🇸 es';
        case 'jp':
        case 'ja':
          return '🇯🇵 ja';
        default:
          const multilang = t('mobile.explore.language.multilang', '多语');
          return normalized ? normalized : `🌐 ${multilang}`;
      }
    }

    function resolveThumbnail(video, options = {}) {
      const isMainlandUser = options && options.isMainlandUser ? true : false;
      const hasLocalCopy = !!(video && video.local_video_path && video.local_video_status === 'completed');

      const normalizeUrl = (input) => {
        if (!input) return null;
        if (/^https?:\/\//i.test(input)) return input;
        const base = API_BASE || '';
        const normalizedBase = base.endsWith('/') ? base.slice(0, -1) : base;
        const normalizedPath = input.startsWith('/') ? input : `/${input}`;
        return `${normalizedBase}${normalizedPath}`;
      };

      const placeholderSvg = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:rgb(102,126,234)"/><stop offset="100%" style="stop-color:rgb(118,75,162)"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="72" fill="white">🎬</text></svg>`)}`;
      const candidateRaw = (video && video.thumbnail_url) || (video && video.thumbnail_path);
      const candidateUrl = normalizeUrl(candidateRaw);
      const isYouTubeThumb = candidateUrl ? /(?:img\.youtube\.com|ytimg\.com)/i.test(candidateUrl) : false;
      const avoidYouTubeThumb = isMainlandUser && hasLocalCopy;

      // 优先使用YouTube缩略图（如果是YouTube视频      let youtubeVideoId = video && video.youtube_video_id;

      // 如果没有 youtube_video_id，尝试从 youtube_url 提取
      if (!youtubeVideoId && video && video.youtube_url) {
        const url = video.youtube_url;
        // 匹配各种 YouTube URL 格式
        const patterns = [
          /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
          /^([a-zA-Z0-9_-]{11})$/  // 直接就是 video ID
        ];

        for (const pattern of patterns) {
          const match = url.match(pattern);
          if (match && match[1]) {
            youtubeVideoId = match[1];
            break;
          }
        }
      }

      // 如果YouTube 视频并且不需要规避，优先用官方缩略图，避免缺失的本地文件
      if (youtubeVideoId && !avoidYouTubeThumb) {
        console.log('[Thumbnail] Using YouTube thumbnail for:', youtubeVideoId);
        return `https://img.youtube.com/vi/${youtubeVideoId}/hqdefault.jpg`;
      }

      // 否则再尝试存储的缩略图（无论是否 /static/ 路径，都尝试加载      if (candidateUrl) {
        console.log('[Thumbnail] Stored thumbnail available:', Boolean(candidateUrl));
        return candidateUrl;
      }

      // 兜底：如果有本地视频路径，尝试按文件名推导缩略图路径
      try {
        const raw = (video && video.video_path) || '';
        if (raw) {
          const base = raw.split('/').pop() || '';
          const stem = base ? base.replace(/\.[^/.]+$/, '') : '';
          if (stem) {
            const guess = normalizeUrl(`/static/thumbnails/${stem}.jpg`);
            console.log('[Thumbnail] Using derived thumbnail:', guess);
            return guess;
          }
        }
      } catch (_) { }

      // If we intentionally skipped a YouTube thumbnail for mainland/local mode, fall back to placeholder
      if (candidateUrl && avoidYouTubeThumb && isYouTubeThumb) {
        console.log('[Thumbnail] Skipping YouTube thumbnail for mainland/local mode, using fallback');
      }

      // 使用简化的SVG占位      const videoId = (video && video.id) || '';
      console.log('[Thumbnail] Using SVG fallback for video:', videoId);
      return placeholderSvg;
    }

    function mapStatus(status) {
      const t = (key, fallback) => (typeof i18n !== 'undefined' && i18n.t) ? i18n.t(key) : fallback;
      const normalized = (status || '').toLowerCase();
      switch (normalized) {
        case 'ready':
          return {
            badgeClass: 'ready',
            badgeLabel: t('mobile.explore.status.ready', '已就),
            progressPercent: '0%',
            progressText: t('mobile.explore.status.not_started', '未开),
            category: 'not-started',
          };
        case 'processing':
          return {
            badgeClass: 'processing',
            badgeLabel: t('mobile.explore.status.processing', '处理),
            progressPercent: '35%',
            progressText: t('mobile.explore.status.processing', '处理),
            category: 'in-progress',
          };
        case 'completed':
          return {
            badgeClass: 'completed',
            badgeLabel: t('mobile.explore.status.completed', '已完),
            progressPercent: '100%',
            progressText: t('mobile.explore.status.completed', '已完),
            category: 'completed',
          };
        case 'failed':
          return {
            badgeClass: 'processing',
            badgeLabel: t('mobile.explore.status.failed', '处理失败'),
            progressPercent: '0%',
            progressText: t('mobile.explore.status.failed', '处理失败'),
            category: 'not-started',
          };
        default:
          return {
            badgeClass: 'ready',
            badgeLabel: t('mobile.explore.status.uploaded', '已上),
            progressPercent: '5%',
            progressText: t('mobile.explore.status.preparing', '准备),
            category: 'not-started',
          };
      }
    }

    function scheduleLogout() {
      if (typeof authManager !== 'undefined' && authManager && typeof authManager.logout === 'function') {
        setTimeout(() => authManager.logout(), 1200);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      authManager.attachLogoutButton('logout-btn');

      const isAuthed = typeof authManager !== 'undefined' && authManager && authManager.isAuthenticated && authManager.isAuthenticated();
      if (!isAuthed) {
        console.log('[Mobile Explore] Not authenticated, skipping initialization');
        return;
      }

      const userInfo = authManager.getUserInfo();
      const token = (userInfo && userInfo.token) || getAuthToken();
      const isGuest = userInfo && userInfo.isGuest;

      console.log('[Mobile Explore] Auth status:', {
        hasToken: !!token,
        isGuest,
      });

      if (!token) {
        console.warn('[Mobile Explore] No token found, skipping initialization');
        return;
      }

      // 使用全局 state 对象，以便标签系统可以访      window.state = {
        videos: [],
        currentFilter: 'all',
        currentDifficulty: null, // 难度筛 null/'beginner'/'intermediate'/'advanced'
        isMainlandUser: false,
        currentUserId: null,
        difficultyStats: null, // 难度统计
      };
      const state = window.state; // 保持向后兼容
      // Fetch current user profile for ID (needed to show owner-only actions)
      (async () => {
        try {
          console.log('[Mobile Explore] Fetching user profile...');
          const res = await fetch(`${API_BASE}/users/me`, {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (res.ok) {
            const me = await res.json();
            state.currentUserId = me && (me.id || me.user_id) ? Number(me.id || me.user_id) : null;
            console.log('[Mobile Explore] User profile loaded:', me.username || me.email);
          } else {
            console.error('[Mobile Explore] Failed to fetch user profile:', res.status, res.statusText);

            // If 401, token is invalid/expired - clear it and redirect to login
            if (res.status === 401) {
              console.warn('[Mobile Explore] Token expired or invalid, clearing auth data...');
              // Clear all possible token storage locations
              safeStorage.clearAuth();

              alert('登录已过期，请重新登);
              window.location.href = 'mobile-auth.html';
            }
          }
        } catch (err) {
          console.error('[Mobile Explore] Error fetching user profile:', err.message);
        }
      })();

      const gridEl = document.getElementById('video-grid');
      const countEl = document.getElementById('video-count');
      const placeholderEl = document.getElementById('video-grid-placeholder');
      const emptyEl = document.getElementById('video-grid-empty');
      const filterButtons = Array.from(document.querySelectorAll('.category-tab'));

      function showPlaceholder(text) {
        const skeleton = document.getElementById('video-grid-skeleton');
        const placeholder = document.getElementById('video-grid-placeholder');

        if (skeleton) {
          skeleton.classList.remove('hidden');
          // Hide text placeholder if we have skeletons
          if (placeholder) placeholder.classList.add('hidden');
        } else if (placeholder) {
          placeholder.textContent = text;
          placeholder.classList.remove('hidden');
        }
      }

      function hidePlaceholder() {
        const skeleton = document.getElementById('video-grid-skeleton');
        const placeholder = document.getElementById('video-grid-placeholder');

        if (skeleton) skeleton.classList.add('hidden');
        if (placeholder) placeholder.classList.add('hidden');
      }

      function showEmpty(message) {
        if (!emptyEl) return;
        emptyEl.textContent = message || '暂时没有可用的视频;
        emptyEl.classList.remove('hidden');
      }

      function hideEmpty() {
        if (!emptyEl) return;
        emptyEl.classList.add('hidden');
      }

      function setActiveFilter(filterKey) {
        state.currentFilter = filterKey;
        filterButtons.forEach((btn) => {
          btn.classList.toggle('active', (btn.dataset.filter || 'all') === filterKey);
        });
      }

      function filterVideos(filterKey) {
        if (!Array.isArray(state.videos)) return [];
        let filtered = state.videos;

        // Apply status filter
        if (filterKey && filterKey !== 'all') {
          filtered = filtered.filter((video) => mapStatus(video.status).category === filterKey);
        }

        // Apply difficulty filter
        if (state.currentDifficulty) {
          filtered = filtered.filter((video) => canonicalExploreLevel(video.difficulty_level) === state.currentDifficulty);
        }

        return filtered;
      }

      function canonicalExploreLevel(raw) {
        const value = String(raw || '').trim().toLowerCase();
        if (value === 'beginner') return 'a1';
        if (value === 'intermediate') return 'b1';
        if (value === 'advanced') return 'c1';
        return ['a1', 'a2', 'b1', 'b2', 'c1', 'c2'].includes(value) ? value : null;
      }

      function profileLevelForExplore(level) {
        if (level === 'a1' || level === 'a2') return 'beginner';
        if (level === 'b1' || level === 'b2') return 'intermediate';
        if (level === 'c1' || level === 'c2') return 'advanced';
        return null;
      }

      // Load user's default level
      async function loadUserDefaultLevel() {
        try {
          const storedLevel = localStorage.getItem('linglish_active_level');
          const stored = canonicalExploreLevel(storedLevel);
          if (stored) return stored;
        } catch (e) {
          console.warn('[Difficulty] Failed to read level from localStorage:', e);
        }

        // 回退到从 API 读取
        try {
          const token = authManager.getToken();
          if (!token) return null;
          const response = await fetch('/auth/profile', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (response.ok) {
            const data = await response.json();
            const level = canonicalExploreLevel(data.user?.current_vocabulary_level || data.user?.level);
            if (level) return level;
          }
        } catch (e) {
          console.warn('[Difficulty] Failed to load user level:', e);
        }
        return null;
      }

      // Save user's level preference
      async function saveUserLevel(level) {
        try {
          const token = authManager.getToken();
          if (!token || !level) return;
          await fetch('/auth/profile', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ level })
          });
          console.log('[Difficulty] Saved user level:', level);
        } catch (e) {
          console.warn('[Difficulty] Failed to save user level:', e);
        }
      }

      // 难度筛选函      function setDifficultyFilter(difficulty) {
        state.currentDifficulty = difficulty || null;
        updateDifficultyTabs();
        const filtered = filterVideos(state.currentFilter);
        renderVideos(filtered);
        // Save to user profile if a specific level is selected
        if (difficulty) {
          try { localStorage.setItem('linglish_active_level', difficulty); } catch (_) {}
          const profileLevel = profileLevelForExplore(difficulty);
          if (profileLevel) saveUserLevel(profileLevel);
        }
      }

      // 更新难度筛选标签的激活状      function updateDifficultyTabs() {

      async function preloadVideoTags(videoList) {
        if (!window.VideoTagSystem || !Array.isArray(videoList) || !videoList.length) return;
        const ids = Array.from(new Set(videoList.map(v => v && v.id).filter(Boolean)));
        if (!ids.length) return;
        const tokenForTags = token || getAuthToken() || window.token || localStorage.getItem('linglish_token') || sessionStorage.getItem('linglish_token');
        if (!tokenForTags) return;
        const tagApiBase = (() => {
          const base = API_BASE || '';
          const origin = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
          if (!base) return origin;
          try {
            // Normalize and drop www so we can compare with page origin
            const normalize = (v) => String(v || '').replace('://www.', '://');
            const resolved = new URL(base, origin || undefined).origin;
            return (normalize(resolved) === normalize(origin)) ? origin : resolved;
          } catch (_) {
            return base;
          }
        })();
        try {
          if (typeof window.VideoTagSystem.syncVideoTagsFromServer === 'function') {
            // 使用 force: true 确保标签数据与服务器同步
            await window.VideoTagSystem.syncVideoTagsFromServer(tagApiBase, tokenForTags, ids, { force: true });
          } else {
            const fetchOne = async (vid) => {
              try {
                const base = tagApiBase.replace(/\/$/, '');
                const sameOrigin = (() => {
                  try {
                    const pageOrigin = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';
                    const normalize = (v) => String(v || '').replace('://www.', '://');
                    return normalize(base) === normalize(pageOrigin) || base === '';
                  } catch (_) { return true; }
                })();
                const url = sameOrigin ? `/videos/${vid}/tags` : `${base}/videos/${vid}/tags`;
                const res = await fetch(url, {
                  headers: { 'Authorization': `Bearer ${tokenForTags}` }
                });
                if (!res.ok) return;
                const data = await res.json();
                const tagIds = [
                  ...((data.global_tag_ids || []).map(id => String(id))),
                  ...((data.user_tag_ids || []).map(id => `u:${id}`))
                ];
                if (window.VideoTagSystem && window.VideoTagSystem.setVideoTags) {
                  window.VideoTagSystem.setVideoTags(vid, tagIds);
                }
              } catch (e) {
                console.warn('[Mobile Tag System] preload single video tags failed', e);
              }
            };
            const limit = 5;
            for (let i = 0; i < ids.length; i += limit) {
              const batch = ids.slice(i, i + limit);
              await Promise.all(batch.map(fetchOne));
            }
          }
        } catch (err) {
          console.warn('[Mobile Tag System] preload video tags failed', err);

        console.log('  - videoTagSelectorList:', !!videoTagSelectorList);

        function showVideoTagSelector(videoId) {
          if (!videoTagSelectorModal || !videoTagSelectorBackdrop) {
            console.error('[Mobile Tag System] Video tag selector modal elements not found');
            return;
          }
          currentVideoForTagging = videoId;
          renderVideoTagSelector();
          videoTagSelectorModal.classList.add('show');
          videoTagSelectorBackdrop.classList.add('show');
          document.body.style.overflow = 'hidden';
        }

        function hideVideoTagSelector() {
          if (!videoTagSelectorModal || !videoTagSelectorBackdrop) return;
          videoTagSelectorModal.classList.remove('show');
          videoTagSelectorBackdrop.classList.remove('show');
          document.body.style.overflow = '';
          currentVideoForTagging = null;

          // 刷新显示
          if (window.state) {
            renderTagFilters(window.state.videos);
            const filtered = filterVideos(window.state.currentFilter);
            renderVideos(filtered);
          }
        }

        function renderVideoTagSelector() {
          if (!currentVideoForTagging || !videoTagSelectorList) {
            console.error('[Mobile Tag System] Cannot render video tag selector: missing element or video ID');
            return;
          }

          // 先加载后端标签映          loadVideoTagsFromServer(currentVideoForTagging).then(() => {
            buildSelector();
          });
        }

        function buildSelector() {
          if (!currentVideoForTagging || !videoTagSelectorList) return;
          const allTags = tagSystem.getVisibleTags ? tagSystem.getVisibleTags() : tagSystem.getAllTags();
          const videoTags = tagSystem.getVideoTags(currentVideoForTagging);

          videoTagSelectorList.innerHTML = allTags.map(tag => {
            const isSelected = videoTags.includes(tag.id);
            const label = tag.displayName || tag.name;
            return `
        <div class="video-tag-item ${isSelected ? 'selected' : ''}" data-tag-id="${tag.id}">
          <div class="tag-item-left">
            <span class="tag-item-icon">${tag.icon}</span>
            <span class="tag-item-name">${label}</span>
          </div>
          <div class="video-tag-checkbox">${isSelected ? ' : ''}</div>
        </div>
        `;
          }).join('');

          // 绑定点击事件
          videoTagSelectorList.querySelectorAll('.video-tag-item').forEach(item => {
            item.addEventListener('click', async () => {
              const tagId = item.dataset.tagId;
              tagSystem.toggleVideoTag(currentVideoForTagging, tagId);
              renderVideoTagSelector();
              // 保存到后              await saveVideoTagsToServer(currentVideoForTagging);
            });
          });
        }

        async function loadVideoTagsFromServer(videoId) {
          try {
            const tokenSave = window.token || localStorage.getItem('linglish_token') || sessionStorage.getItem('linglish_token');
            if (typeof tagSystem.syncVideoTagsFromServer === 'function') {
              await tagSystem.syncVideoTagsFromServer(API_BASE, tokenSave, [videoId], { force: true });
            } else {
              const res = await fetch(`${API_BASE}/videos/${videoId}/tags`, {
                headers: { 'Authorization': `Bearer ${tokenSave}` }
              });
              if (!res.ok) return;
              const data = await res.json();
              const ids = [
                ...((data.global_tag_ids || []).map(id => String(id))),
                ...((data.user_tag_ids || []).map(id => String(id)))
              ];
              tagSystem.setVideoTags(videoId, ids);
            }
          } catch (e) {
            console.warn('加载视频标签失败', e);
          }
        }

        async function saveVideoTagsToServer(videoId) {
          try {
            const allTags = tagSystem.getAllTags();
            const tagIds = tagSystem.getVideoTags(videoId);
            const globalIds = [];
            const personalIds = [];
            tagIds.forEach(id => {
              const t = allTags.find(t => t.id === id);
              if (!t) return;
              if (t.scope === 'personal' || t.custom) personalIds.push(id);
              else globalIds.push(id);
            });
            const tokenSave = window.token || localStorage.getItem('linglish_token') || sessionStorage.getItem('linglish_token');
            await fetch(`${API_BASE}/videos/${videoId}/tags`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${tokenSave}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ global_tag_ids: globalIds, user_tag_ids: personalIds })
            });
          } catch (e) {
            console.warn('保存标签到后端失, e);
          }
        }

        // 添加事件监听器（添加空值检查）
        if (videoTagSelectorCloseBtn) {
          videoTagSelectorCloseBtn.addEventListener('click', hideVideoTagSelector);
        }
        if (videoTagSelectorBackdrop) {
          videoTagSelectorBackdrop.addEventListener('click', hideVideoTagSelector);
        }

        // ===== 修改 renderVideos 函数，添加标签显示和管理功能 =====
        const originalRenderVideos = window.renderVideos || renderVideos;

        // 监听视频渲染完成事件，添加标签显示和管理功能
        const observer = new MutationObserver(() => {
          const videoCards = document.querySelectorAll('.video-card');
          videoCards.forEach(card => {
            // 如果已经处理过，跳过
            if (card.dataset.tagsAdded) return;
            card.dataset.tagsAdded = 'true';

            const videoId = card.querySelector('.rename-btn')?.dataset?.id ||
              card.querySelector('.delete-btn')?.dataset?.id;

            if (!videoId) return;

            // 在视频进度条后面添加标签显示区域
            const progressDiv = card.querySelector('.video-progress');
            if (progressDiv && !card.querySelector('.video-tags-display')) {
              const tagsDisplay = document.createElement('div');
              tagsDisplay.className = 'video-tags-display';
              progressDiv.parentNode.insertBefore(tagsDisplay, progressDiv.nextSibling);
              renderVideoTags(videoId, tagsDisplay);
            }

            // 在操作按钮中添加标签按钮
            const actionsDiv = card.querySelector('.mobile-card-actions');
            if (actionsDiv && !actionsDiv.querySelector('.tag-video-btn')) {
              const tagBtn = document.createElement('button');
              tagBtn.className = 'mobile-action-btn tag-video-btn';
              tagBtn.title = '管理标签';
              tagBtn.innerHTML = '🏷;
              tagBtn.dataset.id = videoId;

              tagBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                showVideoTagSelector(videoId);
              });

              // 插入到重命名按钮之前
              const renameBtn = actionsDiv.querySelector('.rename-btn');
              if (renameBtn) {
                actionsDiv.insertBefore(tagBtn, renameBtn);
              } else {
                actionsDiv.appendChild(tagBtn);
              }
            }
          });
        });

        // 开始观察视频网格的变化
        const gridEl = document.getElementById('video-grid');
        if (gridEl) {
          observer.observe(gridEl, {
            childList: true,
            subtree: true
          });
        }

        // 初始化标签筛- 添加调试信息
        console.log('[Mobile Tag System] Starting initialization...');
        console.log('[Mobile Tag System] window.state available:', typeof window.state !== 'undefined');
        console.log('[Mobile Tag System] state.videos:', typeof window.state !== 'undefined' && window.state ? (window.state.videos || []).length : 'N/A');

        // 立即尝试渲染，因loadVideos 可能已经执行过了
        if (typeof window.state !== 'undefined' && window.state) {
          console.log('[Mobile Tag System] Immediate render attempt...');
          renderTagFilters(window.state.videos || []);
        }

        window.addEventListener('DOMContentLoaded', () => {
          console.log('[Mobile Tag System] DOMContentLoaded fired');
          if (typeof window.state !== 'undefined' && window.state) {
            renderTagFilters(window.state.videos || []);
          }
        });

        // 在视频加载完成后渲染标签筛        const originalLoadVideos = window.loadVideos;
        if (typeof originalLoadVideos === 'function') {
          console.log('[Mobile Tag System] Wrapping loadVideos function');
          window.loadVideos = async function () {
            await originalLoadVideos();
            console.log('[Mobile Tag System] Videos loaded, rendering filters...');
            if (window.state) {
              renderTagFilters(window.state.videos);
            }
          };
        } else {
          console.warn('[Mobile Tag System] loadVideos function not found!');
        }

        console.log('[Mobile Tag System] Initialized');
      });
    })();
  </script>

  <script>
    // Initialize user info display
    (async function initUserInfo() {
      try {
        const clearGuestFlags = () => {
          try {
            localStorage.removeItem('is_guest');
            localStorage.removeItem('isGuest');
            localStorage.removeItem('guest_id');
            sessionStorage.removeItem('is_guest');
            sessionStorage.removeItem('isGuest');
            sessionStorage.removeItem('guest_id');
          } catch (_) { }
        };

        // Prefer fresher session tokens; avoid stale guest tokens lingering in localStorage
        const readToken = () => {
          const sessionToken = sessionStorage.getItem('linglish_token') || sessionStorage.getItem('authToken');
          const localToken = localStorage.getItem('linglish_token') || localStorage.getItem('authToken');
          const isGuest =
            localStorage.getItem('is_guest') === 'true' ||
            sessionStorage.getItem('is_guest') === 'true' ||
            localStorage.getItem('isGuest') === 'true' ||
            sessionStorage.getItem('isGuest') === 'true';

          // If we have a session token, treat it as the current login and clear guest flags
          if (sessionToken) {
            clearGuestFlags();
            return sessionToken;
          }

          // Only fall back to local token when not marked as guest
          if (localToken && !isGuest) return localToken;
          return localToken || null;
        };

        const guestCheckFlags = {
          localStorage_is_guest: localStorage.getItem('is_guest'),
          sessionStorage_is_guest: sessionStorage.getItem('is_guest'),
          localStorage_isGuest: localStorage.getItem('isGuest'),
          sessionStorage_isGuest: sessionStorage.getItem('isGuest')
        };

        const isGuestMode = (() => {
          try {
            if (typeof window.GuestCheck !== 'undefined' && typeof window.GuestCheck.isGuest === 'function') {
              return !!window.GuestCheck.isGuest();
            }
            return (
              localStorage.getItem('is_guest') === 'true' ||
              sessionStorage.getItem('is_guest') === 'true' ||
              localStorage.getItem('isGuest') === 'true' ||
              sessionStorage.getItem('isGuest') === 'true'
            );
          } catch (_) { return false; }
        })();

        console.log('[Mobile Explore Header] Guest check:', { isGuestMode, guestCheckFlags });

        const token = readToken();

        const vipBadgeEl = document.getElementById('mobile-vip-badge');
        if (vipBadgeEl) {
          vipBadgeEl.classList.remove('show');
          console.log('[Mobile Explore Header] VIP badge hidden by default');
        }

        // 游客模式：不请求 /users/me，避401 日志噪音
        if (isGuestMode) {
          const userInfoEl = document.getElementById('mobile-user-info');
          const userNameEl = document.getElementById('mobile-user-name');
          if (userInfoEl) userInfoEl.hidden = false;
          if (userNameEl) userNameEl.textContent = '游客';
          console.log('[Mobile Explore Header] Guest mode - VIP badge should stay hidden');
          return;
        }

        if (!token) {
          console.log('[Mobile Explore] No token found');
          return;
        }

        // Fetch user data
        const API_BASE = window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.port === '4000'
          ? 'http://localhost:4000'
          : '';

        const response = await fetch(`${API_BASE}/users/me`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error('Failed to fetch user data');
        }

        const user = await response.json();

        // Only clear guest flags if this is a real user (not a guest)
        // Guest email format: guest_xxxxx@temp.linglish.local
        const isGuestUser = user.email && user.email.includes('@temp.linglish.local');
        if (!isGuestUser) {
          clearGuestFlags();
          console.log('[Mobile Explore] Clearing guest flags for regular user');
        } else {
          console.log('[Mobile Explore] Guest user detected, keeping guest flags');
        }

        console.log('[Mobile Explore] User profile loaded:', Boolean(user));

        // Extract display name
        let displayName = 'User';
        if (user.username) {
          displayName = user.username;
        } else if (user.email) {
          displayName = user.email.split('@')[0];
        }

        // Show user info section
        const userInfoEl = document.getElementById('mobile-user-info');
        const userNameEl = document.getElementById('mobile-user-name');

        if (userInfoEl) {
          userInfoEl.hidden = false;
        }

        if (userNameEl) {
          userNameEl.textContent = displayName;
        }

        // Show VIP badge if user is VIP or Family member
        if (vipBadgeEl) {
          if (user.membership_type && user.membership_type !== 'free') {
            vipBadgeEl.classList.add('show');
            const tier = (user.membership_type || '').trim().toLowerCase();
            const isFamily = tier === 'family';
            const isSvip = tier === 'svip';
            vipBadgeEl.classList.remove('vip', 'family', 'svip');
            vipBadgeEl.classList.add(isFamily ? 'family' : (isSvip ? 'svip' : 'vip'));

            const vipTextEl = vipBadgeEl.querySelector('.vip-text');
            if (vipTextEl) {
              vipTextEl.textContent = isFamily ? 'Family' : (isSvip ? 'SVIP' : 'VIP');
            }
            const vipIconEl = vipBadgeEl.querySelector('.vip-icon');
            if (vipIconEl) {
              vipIconEl.textContent = isSvip ? '🚀' : (isFamily ? '👑' : '🔥');
            }

            console.log('[Mobile Explore] VIP badge shown:', user.membership_type);
          } else {
            vipBadgeEl.classList.remove('show');
            console.log('[Mobile Explore] User is free tier');
          }
        }

      } catch (error) {
        console.error('[Mobile Explore] Failed to load user info:', error);
      }
    })();
  </script>
