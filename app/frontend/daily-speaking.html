<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日常用语 — Linglish</title>
  <link rel="icon" href="/linglish-favicon.svg?v=4" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/tokens.css?v=2">
  <link rel="stylesheet" href="./styles/icons.css?v=1">
  <link rel="stylesheet" href="./styles/speak-ui.css?v=3">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
      color: #0f172a;
      font-family: Manrope, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .nav {
      position: relative;
      z-index: 20;
      flex: none;
      width: min(1520px, calc(100% - 24px));
      margin: 8px auto 0;
      padding: 4px 14px;
      min-height: 52px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 4px 90px rgba(0, 0, 0, 0.04);
    }
    .brand {
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      font-size: 18px;
    }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .accent {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 999px;
      background: #f1f5f9;
    }
    .accent-btn {
      border: 0;
      background: transparent;
      color: #475569;
      border-radius: 999px;
      min-height: 34px;
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .accent-btn.active { background: #0f766e; color: #fff; }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 14px;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      background: #fff;
      color: #0f766e;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    .nav-btn.home {
      border-color: #0f766e;
      background: #0f766e;
      color: #fff;
    }
    main {
      flex: 1;
      min-height: 0;
      width: min(1520px, 100%);
      margin: 0 auto;
      padding: 8px 12px 28px;
      box-sizing: border-box;
      display: flex;
    }
    .packs { display: flex; justify-content: center; gap: 8px; margin: 0; }
    .pack {
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #0f172a;
      border-radius: 999px;
      min-height: 40px;
      padding: 0 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .pack.active { background: #0f766e; color: #fff; border-color: #0f766e; }
    .words { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    .word {
      border-radius: 999px;
      background: #f0fdfa;
      color: #0f766e;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .workspace {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(180px, 220px) minmax(0, 1.85fr) minmax(220px, 300px);
      grid-template-rows: minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
    }
    .card {
      min-height: 0;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border-radius: 24px;
      padding: 14px 14px 10px;
      box-shadow: 0 4px 90px rgba(0, 0, 0, 0.04);
    }
    .card.stage { padding-left: 12px; padding-right: 12px; }
    .lines, .dialogue {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
    }
    .line {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 16px;
      padding: 12px 14px;
      font: inherit;
      cursor: pointer;
      color: #0f172a;
    }
    .line strong { display: block; font-size: 16px; line-height: 22px; }
    .line span { display: block; margin-top: 4px; color: #64748b; font-size: 14px; }
    .tag {
      margin: 16px 4px 2px;
      color: #0f766e;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    .tag:first-child { margin-top: 0; }
    .line.active { background: #f0fdfa; border-color: #99f6e4; }
    .q-list { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 10px 12px; }
    .q-group { margin: 8px 8px 2px; color: #64748b; font-size: 12px; font-weight: 800; }
    .q-jump {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 6px 10px;
      font: inherit;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .q-jump.active { background: #ccfbf1; color: #0f766e; }
    .exam-sheet { width: 100%; text-align: left; }
    .exam-sheet[hidden] { display: none; }
    .choices { display: flex; flex-direction: column; gap: 8px; }
    .choice {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-weight: 700;
      line-height: 24px;
      color: #0f172a;
      cursor: pointer;
    }
    .choice:hover { border-color: #99f6e4; }
    .answer-toggle {
      margin-top: 10px;
      border: 1px dashed #0f766e;
      background: #f0fdfa;
      color: #0f766e;
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .answer-body {
      margin: 8px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff;
      color: #0f172a;
      font-weight: 700;
      line-height: 26px;
    }
    .choice.is-key { border-color: #0f766e; background: #f0fdfa; }
    .why {
      display: block;
      margin-top: 6px;
      color: #0f766e;
      font-size: 15px;
      font-weight: 650;
      line-height: 24px;
    }
    .read-fold {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      padding: 10px 12px;
    }
    .read-fold summary { cursor: pointer; font-weight: 800; line-height: 28px; }
    .read-body { margin-top: 10px; line-height: 28px; white-space: pre-wrap; }
    .opt-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .opt-line { display: block; color: #334155; font-size: 15px; font-weight: 700; line-height: 22px; }
    .turn em:empty { display: none; padding: 0; border: 0; }
    .stage-head {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      margin: 0 0 8px;
    }
    .stage-head .accent { margin-left: auto; flex: none; }
    .scene-title { margin: 0; flex: none; font-size: 22px; line-height: 28px; }
    .place {
      margin: 0;
      min-width: 0;
      overflow: hidden;
      color: #64748b;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .methods {
      display: flex;
      gap: 4px;
      margin: 0 0 8px;
      padding: 4px;
      border-radius: 16px;
      background: #f1f5f9;
    }
    .method { flex: 1; }
    .caption-switch {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: transparent;
      color: #475569;
      border-radius: 12px;
      min-height: 40px;
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .caption-switch .knob {
      width: 36px;
      height: 22px;
      border-radius: 999px;
      background: #cbd5e1;
      position: relative;
    }
    .caption-switch .knob::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      top: 2px;
      left: 2px;
    }
    .caption-switch.on { color: #0f766e; background: #fff; }
    .caption-switch.on .knob { background: #0f766e; }
    .caption-switch.on .knob::after { left: 16px; }
    .now.caption .now-who,
    .now.caption .gloss-row,
    .now.caption .mic,
    .now.caption .read-fold { display: none; }
    .now.caption .now-body {
      width: 100%;
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px 18px 8px;
    }
    .now.caption .now-en { font-weight: 700; }
    .now.caption .now-zh { font-weight: 650; color: #334155; }
    .method, .review-btn {
      border: 0;
      background: transparent;
      color: #475569;
      border-radius: 12px;
      min-height: 40px;
      padding: 0 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .method.active { background: #fff; color: #0f766e; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); }
    .stage {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .now {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      gap: 8px;
      margin: 0 0 8px;
      padding: 14px 12px 12px;
      overflow: auto;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      background: #f8fafc;
    }
    .now-body {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      width: 100%;
    }
    .now-who { margin: 0; color: #0f766e; font-size: 15px; font-weight: 800; }
    .now-en { margin: 0; font-size: 28px; line-height: 40px; font-weight: 700; }
    .now-en[hidden] { display: none; }
    .now-zh { margin: 0; color: #0f766e; font-size: 18px; line-height: 28px; font-weight: 700; }
    .now-zh[hidden] { display: none; }
    .now-zh.pending { color: #64748b; font-weight: 650; }
    .choice-zh { display: block; margin-top: 2px; color: #0f766e; font-size: 14px; font-weight: 700; line-height: 20px; }
    .choice-zh:empty { display: none; }
    .gloss-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 14px 10px;
      width: 100%;
    }
    .gloss-row[hidden] { display: none; }
    .gloss-chunk { display: inline-flex; align-items: flex-end; }
    .gloss-word {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 44px;
      width: max-content;
      max-width: 140px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .gloss-ipa {
      min-height: 18px;
      padding: 0 6px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      white-space: nowrap;
    }
    .gloss-ipa:empty { background: transparent; }
    .gloss-en {
      min-height: 34px;
      padding: 4px 10px;
      background: #e2e8f0;
      font-size: 20px;
      line-height: 26px;
      font-weight: 800;
    }
    .gloss-word.start .gloss-en { border-radius: 12px 0 0 12px; }
    .gloss-word.end .gloss-en { border-radius: 0 12px 12px 0; }
    .gloss-word.mid .gloss-en { border-radius: 0; }
    .gloss-word.only .gloss-en { border-radius: 12px; }
    .gloss-chunk.c0 .gloss-en { background: #fde68a; }
    .gloss-chunk.c1 .gloss-en { background: #fecaca; }
    .gloss-chunk.c2 .gloss-en { background: #bfdbfe; }
    .gloss-chunk.c3 .gloss-en { background: #99f6e4; }
    .gloss-word.current .gloss-en { box-shadow: inset 0 -3px 0 #7c3aed; }
    .gloss-word.done .gloss-en { box-shadow: inset 0 -3px 0 #0f766e; }
    .gloss-pos { min-height: 16px; color: #0f766e; font-size: 12px; line-height: 16px; font-weight: 700; white-space: nowrap; }
    .gloss-zh { min-height: 18px; color: #475569; font-size: 13px; line-height: 18px; white-space: nowrap; }
    .gloss-pop {
      position: fixed;
      z-index: 80;
      width: 280px;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 14px;
      background: #1e293b;
      color: #e2e8f0;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.28);
      text-align: left;
    }
    .gloss-pop[hidden] { display: none; }
    .gloss-pop-role {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 6px;
      color: #fff;
      font-weight: 800;
    }
    .gloss-pop-role i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fb7185;
      flex: none;
    }
    .gloss-pop-role em { margin-left: auto; color: #94a3b8; font-size: 13px; font-weight: 500; }
    .gloss-pop p { margin: 0; font-size: 13px; line-height: 1.5; }
    .split-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 8px 18px;
      width: 100%;
      margin-top: 12px;
    }
    .split-row[hidden] { display: none; }
    .split-word {
      color: #94a3b8;
      font-size: 28px;
      line-height: 40px;
      font-weight: 700;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 2px;
    }
    .split-word.current { color: #7c3aed; border-bottom-color: #7c3aed; }
    .split-word.done { color: #0f172a; border-bottom-color: #99f6e4; }
    .mic {
      width: 64px;
      height: 64px;
      margin-top: 18px;
      border: 0;
      border-radius: 50%;
      background: #0f766e;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none;
    }
    .mic[hidden] { display: none; }
    .mic.listening { background: #dc2626; }
    .mic svg { width: 28px; height: 28px; display: block; }
    .transport { margin-top: auto; }
    .transport-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .transport-row button {
      width: 100%;
      min-width: 0;
      padding-left: 8px;
      padding-right: 8px;
      white-space: nowrap;
    }
    .shadow-btn.holding { background: #0f766e; color: #fff; border-color: #0f766e; }
    .review {
      margin: 0 0 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: #f0fdfa;
    }
    .review p { margin: 0 0 8px; color: #0f766e; font-weight: 800; }
    .review li { margin: 6px 0; color: #0f172a; }
    .review em { display: block; color: #64748b; font-style: normal; }
    .turn .covered { color: #0f766e; font-weight: 700; }
    .turn {
      display: grid;
      grid-template-columns: 56px 1fr;
      grid-template-areas: "who en" "zh zh";
      align-items: start;
      column-gap: 12px;
      row-gap: 8px;
      width: 100%;
      text-align: left;
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 16px;
      padding: 12px 14px;
      font: inherit;
      cursor: pointer;
      color: #0f172a;
    }
    .who-col { grid-area: who; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .turn .who { color: #0f766e; font-weight: 800; line-height: 20px; }
    .turn strong { grid-area: en; display: block; font-size: 17px; line-height: 26px; }
    .turn em {
      grid-area: zh;
      display: block;
      margin: 0;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
      color: #64748b;
      font-style: normal;
      font-size: 14px;
      line-height: 22px;
      word-break: keep-all;
      line-break: strict;
      overflow-wrap: anywhere;
    }
    .turn.active em { border-top-color: #ccfbf1; }
    .turn.active { background: #f0fdfa; border-color: #99f6e4; }
    .line-play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #0f766e;
      color: #fff;
    }
    .line-play svg { width: 16px; height: 16px; display: block; }
    .actions-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0 0;
      min-width: 0;
    }
    .actions { display: flex; flex-wrap: nowrap; gap: 8px; margin: 0; flex: none; }
    button.btn-primary {
      border: 0;
      cursor: pointer;
      min-height: 44px;
      padding: 0 22px;
      color: #fff;
      font: inherit;
      font-weight: 700;
      border-radius: 999px;
      background: linear-gradient(135deg, #0d9488, #2dd4bf);
    }
    button.btn-outline {
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #0f172a;
      cursor: pointer;
      min-height: 44px;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      border-radius: 999px;
    }
    .actions button.btn-outline { min-height: 40px; padding: 0 14px; font-size: 14px; }
    button:disabled { opacity: 0.55; cursor: wait; }
    .status {
      flex: 1;
      margin: 0;
      color: #0f766e;
      font-weight: 700;
      min-height: 20px;
      min-width: 0;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    audio { width: 100%; height: 36px; margin: 6px 0 0; flex: none; }
    .audio-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .audio-row[hidden] { display: none; }
    .audio-row audio { flex: 1; min-width: 0; width: auto; }
    .audio-delete {
      flex: none;
      margin-top: 6px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #fecaca;
      border-radius: 999px;
      background: #fff;
      color: #b91c1c;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-btn.materials {
      border-color: #99f6e4;
      background: #f0fdfa;
      color: #0f766e;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }
    .nav-btn.materials.active { background: #0f766e; color: #fff; }
    .materials-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.42);
    }
    .materials-modal[hidden] { display: none; }
    .materials-panel {
      width: min(560px, 100%);
      max-height: min(72vh, 640px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 22px 22px 18px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.18);
    }
    .materials-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .materials-head h2 {
      margin: 0;
      font-size: 20px;
      line-height: 28px;
      font-weight: 800;
    }
    .materials-head p {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 14px;
      line-height: 20px;
    }
    .materials-close {
      flex: none;
      width: 36px;
      height: 36px;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      background: #fff;
      color: #475569;
      font: inherit;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .materials-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .materials-list .hint {
      margin: 8px 0;
      color: #64748b;
      font-size: 14px;
      line-height: 20px;
    }
    .materials-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      color: #0f172a;
      text-align: left;
      text-decoration: none;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    .materials-item:hover { background: #f0fdfa; border-color: #99f6e4; }
    .materials-item strong {
      display: block;
      font-size: 15px;
      line-height: 22px;
    }
    .materials-item em {
      display: block;
      margin-top: 2px;
      color: #64748b;
      font-style: normal;
      font-size: 13px;
      line-height: 18px;
    }
    .materials-item .enter {
      flex: none;
      color: #0f766e;
      font-weight: 700;
      font-size: 14px;
    }
    .materials-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 4px;
    }
    .materials-foot a {
      color: #0f766e;
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
    }
    .materials-foot .btn-primary {
      min-height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    @media (max-width: 980px) {
      html, body { height: auto; overflow: auto; }
      body { display: block; }
      .nav { width: auto; margin: 12px 12px 0; grid-template-columns: 1fr auto; border-radius: 24px; }
      .packs { grid-column: 1 / -1; justify-content: flex-start; }
      main { display: block; height: auto; padding: 12px; }
      .workspace { display: grid; height: auto; grid-template-columns: 1fr; grid-template-rows: none; }
      .card { height: auto; overflow: visible; }
      .stage { height: auto; overflow: visible; }
      .lines, .dialogue { max-height: 320px; flex: none; }
      .now { min-height: 160px; }
      .now-en { font-size: 22px; line-height: 32px; }
    }
  </style>
  <script src="./js/auth-manager.js?v=20261019"></script>
  <script src="./js/nav-back.js?v=1"></script>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="./index-desktop.html" title="返回首页">Linglish</a>
    <div class="packs" id="packs">
      <button class="pack active" type="button" data-pack="daily">日常用语</button>
      <button class="pack" type="button" data-pack="core">850句</button>
    </div>
    <div class="nav-actions">
      <button class="nav-btn materials" id="materials-btn" type="button">我的教材</button>
      <a class="nav-btn" id="nav-back" data-nav="back" href="./index-desktop.html">返回</a>
      <a class="nav-btn home" data-nav="home" href="./index-desktop.html">首页</a>
    </div>
  </nav>
  <div class="materials-modal" id="materials-modal" hidden>
    <div class="materials-panel" role="dialog" aria-modal="true" aria-labelledby="materials-title">
      <div class="materials-head">
        <div>
          <h2 id="materials-title">从已导入教材里选</h2>
          <p>选一份，就在这一页听和跟读。</p>
        </div>
        <button class="materials-close" id="materials-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="materials-list" id="materials-list">
        <p class="hint">正在读取…</p>
      </div>
      <div class="materials-foot">
        <a href="./document-import.html">上传新文件</a>
        <a class="btn-primary" href="./document-import.html">导入新教材</a>
      </div>
    </div>
  </div>
  <main>
    <div class="workspace">
      <section class="card rail-lines">
        <div class="lines" id="scenes"></div>
      </section>
      <section class="card stage">
        <div class="stage-head">
          <h2 class="scene-title" id="scene-title">路上见面</h2>
          <p class="place" id="scene-place"></p>
          <div class="accent" id="accent" role="group" aria-label="美式或英式">
            <button class="accent-btn active" type="button" data-accent="us">美式</button>
            <button class="accent-btn" type="button" data-accent="uk">英式</button>
          </div>
        </div>
        <div class="words" id="words" hidden></div>
        <div class="methods" id="methods">
          <button class="method active" type="button" data-method="listen">先听再跟</button>
          <button class="method" type="button" data-method="speak">先说再看</button>
          <button class="method" type="button" data-pack="field">实景五段</button>
          <button class="caption-switch" id="caption-switch" type="button" aria-pressed="false">
            <span class="knob" aria-hidden="true"></span>
            纯字幕
          </button>
          <button class="caption-switch" id="translate-switch" type="button" aria-pressed="false">
            <span class="knob" aria-hidden="true"></span>
            翻译
          </button>
        </div>
        <div class="now" id="now">
          <div class="now-body">
            <p class="now-who" id="now-who"></p>
            <p class="now-en" id="now-en"></p>
            <p class="now-zh" id="now-zh" hidden></p>
            <div class="gloss-row" id="gloss-row" hidden></div>
            <div class="exam-sheet" id="exam-sheet" hidden></div>
          </div>
          <div class="split-row" id="split-row" hidden></div>
          <button class="mic" id="mic-btn" type="button" hidden aria-label="话筒（快捷键 M）" title="话筒（M）">
            <span data-lx-icon="mic" data-lx-class="lx-icon--xl"></span>
          </button>
        </div>
        <div class="review" id="review" hidden></div>
        <div class="transport">
          <div class="transport-row">
            <button class="btn-primary" id="play-btn" type="button" title="播放 / 暂停（空格）">播放</button>
            <button class="btn-outline" id="prev-btn" type="button" title="上一句（←）">上一句</button>
            <button class="btn-outline" id="next-btn" type="button" title="下一句（→）">下一句</button>
            <button class="btn-outline shadow-btn" id="shadow-btn" type="button" title="按住说，松开结束。点一下会留几秒。Enter 同样按住">跟读</button>
          </div>
          <div class="actions-bar">
            <div class="actions">
              <button class="btn-outline" id="read-btn" type="button">朗读整段</button>
              <button class="btn-outline" id="note-line-btn" type="button" title="把当前这句做成精读笔记卡">本句精读</button>
              <button class="btn-outline" id="note-scene-btn" type="button" title="把当前场景整段做成精读笔记卡">整段精读</button>
              <button class="btn-outline" id="reveal-btn" type="button" hidden>看原句</button>
              <button class="btn-outline" id="review-btn" type="button">带走三句</button>
              <button class="btn-outline" id="mine-btn" type="button" disabled>听我的录音</button>
            </div>
            <p class="status" id="status">选一个场景开始。</p>
          </div>
        </div>
        <div class="audio-row" id="line-audio-row" hidden>
          <audio id="line-audio" controls></audio>
          <button class="audio-delete" id="line-audio-delete" type="button">删除</button>
        </div>
        <div class="audio-row" id="mine-audio-row" hidden>
          <audio id="mine-audio" controls></audio>
          <button class="audio-delete" id="mine-audio-delete" type="button">删除</button>
        </div>
      </section>
      <section class="card">
        <div class="dialogue" id="dialogue"></div>
      </section>
    </div>
  </main>
  <div class="gloss-pop" id="gloss-pop" hidden></div>
  <script src="./js/icons.js?v=1"></script>
  <script src="./js/workbench/import-bridge.js?v=20261019"></script>
  <script src="./js/tts-voice.js?v=2"></script>
  <script src="./data/core-850.js?v=1"></script>
  <script src="./js/pages/daily-speaking-app.js?v=1"></script>
</body>
</html>
