    function examWillFold(focus) {
      return Boolean(focus && focus.long && !captionOn && packId === 'material' && focus.kind && focus.kind !== 'question');
    }

    function remainingSpeechTargets() {
      if (!splitActive() || !splitState) return [];
      return splitState.targets.filter((_, index) => !splitState.done[index] || !splitState.slots[index]);
    }

    function isLikelyValidEnglishSpeech(text) {
      const raw = String(text || '').trim();
      if (!raw) return false;
      // 纯中文 / 噪音符号不算有效人声输入
      if (/[\u4e00-\u9fff]/.test(raw) && !/[a-zA-Z]/.test(raw)) return false;
      const tokens = normalizeSpoken(raw).split(/\s+/).filter(Boolean);
      if (!tokens.length) return false;
      // 过短且对不上目标词的 interim，多半是环境杂音
      if (tokens.length === 1 && tokens[0].length <= 1) return false;
      return true;
    }

    function scoreSpeechAgainstTargets(piece, targets) {
      const tokens = expandSpeechTokens(normalizeSpoken(piece).split(/\s+/).filter(Boolean));
      if (!tokens.length) return -1;
      let score = 0;
      let cursor = 0;
      let hits = 0;
      tokens.forEach((token) => {
        let matched = false;
        for (let index = cursor; index < targets.length; index += 1) {
          if (wordMatches(targets[index], token, true)) {
            score += 4;
            hits += 1;
            cursor = index + 1;
            matched = true;
            return;
          }
        }
        // 正在说的半词：只给下一个空位加分
        if (!matched && cursor < targets.length) {
          const wanted = normalizeSpoken(spokenLabel(targets[cursor]));
          if (wanted && (wanted.startsWith(token) || token.startsWith(wanted.slice(0, Math.min(3, wanted.length))))) {
            score += 1.5;
            hits += 0.5;
            matched = true;
          }
        }
        if (!matched) score -= 0.6;
      });
      if (!hits) return -1;
      return score + hits * 0.25;
    }

    function pruneSpeechToTargets(piece, allowPartial) {
      if (!isLikelyValidEnglishSpeech(piece)) return '';
      const targets = (splitActive() && splitState && splitState.targets) || [];
      if (!targets.length) return normalizeSpoken(piece);
      const tokens = expandSpeechTokens(normalizeSpoken(piece).split(/\s+/).filter(Boolean));
      const kept = [];
      let cursor = 0;
      tokens.forEach((token, tokenIndex) => {
        const openTail = Boolean(allowPartial) && tokenIndex === tokens.length - 1;
        let found = -1;
        for (let index = cursor; index < Math.min(targets.length, cursor + 4); index += 1) {
          if (wordMatches(targets[index], token, !openTail)) {
            found = index;
            break;
          }
        }
        if (found < 0 && openTail && cursor < targets.length) {
          const wanted = normalizeSpoken(spokenLabel(targets[cursor]));
          if (wanted && (wanted.startsWith(token) || token.startsWith(wanted.slice(0, Math.min(3, wanted.length))))) {
            found = cursor;
          }
        }
        if (found < 0) return;
        kept.push(token);
        cursor = found + 1;
      });
      return kept.join(' ');
    }

    function bestTranscriptPiece(result, preferFinal) {
      if (!result || !result.length) return '';
      const targets = remainingSpeechTargets();
      const fallbackTargets = (splitActive() && splitState && splitState.targets) || targets;
      let best = '';
      let bestScore = -1;
      const limit = Math.min(result.length, 5);
      for (let i = 0; i < limit; i += 1) {
        const piece = String(result[i].transcript || '').trim();
        if (!piece || !isLikelyValidEnglishSpeech(piece)) continue;
        let confidence = 0;
        try {
          if (typeof result[i].confidence === 'number') confidence = result[i].confidence;
        } catch (_) {}
        // Chrome 对 interim 常给 0；仅当最终结果明确给了低置信度才丢弃
        if (preferFinal && confidence > 0 && confidence < 0.28) continue;
        let score = scoreSpeechAgainstTargets(piece, targets.length ? targets : fallbackTargets);
        if (score < 0) {
          // 整句回听时也允许对整句目标计分
          score = scoreSpeechAgainstTargets(piece, fallbackTargets);
        }
        if (score < 0) continue;
        score += confidence;
        if (score > bestScore) {
          bestScore = score;
          best = piece;
        }
      }
      if (!best) return '';
      return preferFinal ? (pruneSpeechToTargets(best, false) || best) : (pruneSpeechToTargets(best, true) || '');
    }

    function transcriptFrom(event) {
      let sessionFinal = '';
      let interim = '';
      let hasFinal = false;
      const results = event.results || [];
      const start = Number.isFinite(event.resultIndex) ? event.resultIndex : 0;
      const walk = (from, to) => {
        for (let i = from; i < to; i += 1) {
          const result = results[i];
          if (!result) continue;
          const piece = bestTranscriptPiece(result, Boolean(result.isFinal));
          if (!piece) continue;
          if (result.isFinal) {
            hasFinal = true;
            sessionFinal += ' ' + piece;
          } else {
            interim = piece;
          }
        }
      };
      walk(start, results.length);
      // 兼容部分浏览器只在完整 results 里给 final
      if (!sessionFinal && !interim) walk(0, results.length);
      return {
        sessionFinal: sessionFinal.trim(),
        interim: String(interim || '').trim(),
        hasFinal,
      };
    }

    async function ensureMicPermission() {
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
        return true;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
        stream.getTracks().forEach((track) => track.stop());
        return true;
      } catch (_) {
        return false;
      }
    }

    function mergeHearTranscript(micText) {
      const input = document.getElementById('hear-input');
      const typed = input ? String(input.value || '') : '';
      const chunks = [];
      // 已填上的词先锁住，避免语音 interim 把打字结果冲掉
      if (splitActive() && splitState) {
        splitState.targets.forEach((word, index) => {
          if (splitState.done[index]) chunks.push(spokenLabel(word));
        });
      }
      if (typed.trim()) chunks.push(typed);
      if (String(micText || '').trim()) chunks.push(micText);
      const merged = normalizeSpoken(chunks.join(' '));
      if (!merged) return '';
      const tokens = expandSpeechTokens(merged.split(/\s+/).filter(Boolean));
      const deduped = [];
      tokens.forEach((token) => {
        const norm = normalizeSpoken(token);
        if (!norm) return;
        if (deduped.length && normalizeSpoken(deduped[deduped.length - 1]) === norm) return;
        deduped.push(token);
      });
      const joined = deduped.join(' ');
      return pruneSpeechToTargets(joined, true) || joined;
    }

    function applyMicTranscript(text, fromMic) {
      const pruned = pruneSpeechToTargets(text, true);
      const spoken = normalizeSpoken(pruned || text);
      if (!spoken || !isLikelyValidEnglishSpeech(spoken)) return;
      const input = document.getElementById('hear-input');
      if (!input) return;
      const typingNow = Boolean(fromMic)
        && !isMobileSpeaking()
        && document.activeElement === input
        && (Date.now() - hearTypedAt < 700);

      if (fromMic) {
        if (isMobileSpeaking() && !hearFromMic && (input.value.trim() || Date.now() - hearTypedAt < 800)) {
          // 手机端不要被键盘输入抢占识别结果
          return;
        }
        hearFromMic = true;
      }

      // 语音 + 打字并行：合并两边结果再填横线
      const merged = fromMic ? (mergeHearTranscript(spoken) || spoken) : spoken;
      if (!merged) return;

      if (!typingNow) {
        input.value = merged;
        hearSeen = merged;
      }
      syncHearLine(merged);
      if (/[\u4e00-\u9fff]/.test(merged) && !filledCount()) {
        setStatus('识别成了中文。请说英文，再说一次。');
      } else if (filledCount()) {
        const left = splitState.done.filter((flag) => !flag).length;
        setStatus(left
          ? `已对上 ${filledCount()} 个词，还差 ${left} 个。可继续说，也可打字。`
          : '这句对上了。');
      }
    }

    function startComputerMic(parts) {
      stopComputerMic();
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) {
        setStatus('横线已打开。这个浏览器不能直接听麦克风，可以打字，或点键盘上的语音。');
        return;
      }
      const mobile = isMobileSpeaking();
      const recognition = new Recognition();
      hearRecognition = recognition;
      hearFromMic = true;
      let restarts = 0;
      let heardUseful = false;
      recognition.lang = speakLang();
      // 电脑端连续听 + 中间结果，边说边按词填空（微信语音输入式）
      recognition.continuous = !mobile;
      recognition.interimResults = true;
      try { recognition.maxAlternatives = 5; } catch (_) {}
      // 有短语偏置时，把本句目标词喂给识别引擎，提高有效人声命中
      try {
        if (Array.isArray(parts) && parts.length && 'phrases' in recognition) {
          const Phrase = window.SpeechRecognitionPhrase;
          const phrases = parts.map((word) => {
            const label = spokenLabel(word);
            if (!label) return null;
            if (typeof Phrase === 'function') return new Phrase(label, 8);
            return { phrase: label, boost: 8 };
          }).filter(Boolean);
          if (phrases.length) recognition.phrases = phrases;
        }
      } catch (_) {}
      recognition.onresult = (event) => {
        if (hearRecognition !== recognition || !splitActive() || !splitListen) return;
        const spoken = transcriptFrom(event);
        if (spoken.sessionFinal) {
          hearFinalBuffer = (hearFinalBuffer + ' ' + spoken.sessionFinal).replace(/\s+/g, ' ').trim();
          hearFinalBuffer = pruneSpeechToTargets(hearFinalBuffer, false) || hearFinalBuffer;
        }
        const combined = (hearFinalBuffer + (spoken.interim ? ' ' + spoken.interim : '')).replace(/\s+/g, ' ').trim();
        if (!combined || !isLikelyValidEnglishSpeech(combined)) return;
        heardUseful = true;
        restarts = 0;
        applyMicTranscript(combined, true);
      };
      recognition.onnomatch = () => {
        // 杂音 / 无效人声：不填词，继续听
        if (hearRecognition === recognition && splitListen && !filledCount()) {
          setStatus('没听清有效英文，请靠近麦克风再说一次。');
        }
      };
      const failMicKeepTyping = (message) => {
        stopComputerMic();
        hearFromMic = false;
        if (message) setStatus(message);
        render();
      };
      recognition.onerror = (event) => {
        if (hearRecognition !== recognition) return;
        const code = event && event.error;
        if (code === 'no-speech' || code === 'aborted') return;
        if (code === 'not-allowed') {
          failMicKeepTyping('还没有允许麦克风。点允许后再点「口语训练」，或直接打字。');
          return;
        }
        if (code === 'audio-capture') {
          failMicKeepTyping('没有找到麦克风。请检查权限后重试，或直接打字。');
          return;
        }
        if (code === 'network') {
          failMicKeepTyping('语音识别需要网络。请检查网络，或直接打字。');
          return;
        }
        // 其它错误尽量自动重启，避免一次失败就停
        if (restarts < 14 && splitListen) {
          try { recognition.stop(); } catch (_) {}
          return;
        }
        failMicKeepTyping('麦克风暂时听不到。再点「口语训练」重试，或直接打字。');
      };
      recognition.onend = () => {
        if (hearRecognition !== recognition || !splitListen || !splitActive()) return;
        if (splitState.done.every(Boolean)) {
          stopComputerMic();
          hearFromMic = false;
          render();
          return;
        }
        const maxRestarts = mobile ? 16 : 24;
        if (restarts >= maxRestarts) {
          failMicKeepTyping(filledCount()
            ? '听写暂停了。可继续打字，或再点「口语训练」。'
            : '没听清有效人声。再点「口语训练」，或直接打字。');
          return;
        }
        restarts += 1;
        window.setTimeout(() => {
          if (hearRecognition !== recognition || !splitListen || !hearFromMic) return;
          try { recognition.start(); } catch (_) { failMicKeepTyping('麦克风忙。稍后再试，或直接打字。'); }
        }, mobile ? 180 : (heardUseful ? 40 : 90));
      };
      try {
        recognition.start();
        setStatus('正在听…可语音也可打字，词对上就自动填。');
      } catch (_) {
        failMicKeepTyping('麦克风忙。稍后再点「口语训练」，或直接打字。');
      }
    }

    function blankSlots(parts) {
      return {
        key: lineKey(lineIndex),
        targets: parts.slice(),
        slots: parts.map(() => ''),
        done: parts.map(() => false),
        queue: [],
        draft: ''
      };
    }

    function filledCount() {
      if (!splitState || !splitState.done) return 0;
      return splitState.done.filter(Boolean).length;
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('READ_FAILED'));
        reader.readAsDataURL(blob);
      });
    }

    function stopHearRecorder(immediate) {
      if (hearRecordTimer) {
        clearTimeout(hearRecordTimer);
        hearRecordTimer = 0;
      }
      const recorder = hearRecorder;
      const stream = hearRecordStream;
      hearRecorder = null;
      hearRecordStream = null;
      if (recorder && recorder.state !== 'inactive') {
        try {
          if (immediate) recorder.onstop = null;
          recorder.stop();
        } catch (_) {}
      }
      if (stream) {
        try { stream.getTracks().forEach((track) => track.stop()); } catch (_) {}
      }
    }

    async function recognizeBlobWithServer(blob, expectedText) {
      const token = readToken();
      if (!token) {
        setStatus('语音填空需要先登录。登录后再点话筒说英文。');
        return '';
      }
      if (!blob || !blob.size) {
        setStatus('没有录到声音。请靠近话筒再说一次，说完再点停止。');
        return '';
      }
      const dataUrl = await blobToDataUrl(blob);
      const response = await fetch('/pronunciation/assess', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token,
        },
        body: JSON.stringify({
          text: expectedText,
          audio_data: dataUrl,
          fast_asr: true,
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        setStatus('登录已过期。请重新登录后再用语音输入。');
        return '';
      }
      if (response.status === 402) {
        setStatus('今日语音识别次数已用完。可明天再试，或升级会员。');
        return '';
      }
      if (!response.ok) {
        throw new Error(data.message || 'ASR_FAILED');
      }
      return String(data.hypothesis || '').trim();
    }

    async function finishHearRecordAndFill() {
      if (hearRecordBusy) return;
      const recorder = hearRecorder;
      if (!recorder) {
        splitListen = null;
        render();
        return;
      }
      hearRecordBusy = true;
      stopComputerMic();
      setStatus('正在识别你说的英文…');
      const micHint = document.getElementById('mic-hint');
      if (micHint) micHint.textContent = '识别中…';
      const blob = await new Promise((resolve) => {
        const chunks = hearChunks.slice();
        const finish = () => {
          const all = hearChunks.length ? hearChunks.slice() : chunks;
          resolve(new Blob(all, { type: recorder.mimeType || 'audio/webm' }));
        };
        recorder.addEventListener('stop', finish, { once: true });
        try {
          if (typeof recorder.requestData === 'function') recorder.requestData();
          recorder.stop();
        } catch (_) {
          finish();
        }
      });
      stopHearRecorder(true);
      hearChunks = [];
      try {
        // 若实时识别已填满，不必再等服务端
        if (splitState && splitState.done.every(Boolean)) {
          finishTypedLine();
          setStatus('这句已对上。');
          return;
        }
        const expected = current()[1] || '';
        const hypothesis = await recognizeBlobWithServer(blob, expected);
        if (hypothesis) {
          hearFinalBuffer = hypothesis;
          applyMicTranscript(hypothesis, true);
          if (splitState && splitState.done.every(Boolean)) {
            finishTypedLine();
            setStatus('识别成功，这句已对上。');
          } else {
            const left = splitState ? splitState.done.filter((flag) => !flag).length : 0;
            setStatus(left
              ? `识别到：${hypothesis}。还差 ${left} 个词，可再说一次。`
              : `识别到：${hypothesis}`);
          }
        } else if (!readToken()) {
          // status already set
        } else if (filledCount()) {
          setStatus(`已对上 ${filledCount()} 个词。可再说一次补全。`);
        } else {
          setStatus('没有听清。请再说一次英文，说完再点话筒停止。');
        }
      } catch (error) {
        console.warn('[daily-speaking] wechat asr failed', error);
        setStatus(isWeChatBrowser()
          ? '微信识别失败。请再说一次，或点右上角 ··· 用 Safari / Chrome 打开。'
          : '识别失败。请再说一次，或换 Chrome / Edge。');
      } finally {
        hearRecordBusy = false;
        splitListen = null;
        const input = document.getElementById('hear-input');
        if (input) input.readOnly = false;
        render();
      }
    }

    async function startHearRecordAsr(parts) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        setStatus(isWeChatBrowser()
          ? '当前微信版本不支持网页录音。请点右上角 ···，用浏览器打开后再试。'
          : '当前浏览器不能录音。请换 Chrome / Edge，或直接打字。');
        return false;
      }
      try { stopPlaybackOnly(); } catch (_) {}
      stopHearRecorder(true);
      stopComputerMic();
      hearChunks = [];
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
      } catch (error) {
        setStatus(isWeChatBrowser()
          ? '请允许麦克风权限。若没有弹窗，点右上角 ··· 用浏览器打开。'
          : '需要麦克风权限才能语音输入。请允许后重试。');
        throw error;
      }
      hearRecordStream = stream;
      let mime = '';
      try {
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
        else if (MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
        else if (MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
      } catch (_) {}
      const recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      hearRecorder = recorder;
      recorder.addEventListener('dataavailable', (event) => {
        if (event.data && event.data.size) hearChunks.push(event.data);
      });
      recorder.start(200);
      splitListen = true;
      hearFromMic = true;
      if (hearRecordTimer) clearTimeout(hearRecordTimer);
      // 防止一直录：最长 12 秒自动停止并识别
      hearRecordTimer = window.setTimeout(() => {
        if (hearRecorder && hearRecorder.state !== 'inactive' && !hearRecordBusy) {
          finishHearRecordAndFill();
        }
      }, 12000);
      // 非微信且浏览器支持时，并行实时识别，格子更快填上
      if (!isWeChatBrowser() && (window.SpeechRecognition || window.webkitSpeechRecognition)) {
        try { startComputerMic(parts); } catch (_) {}
      }
      render();
      setStatus('');
      const micHint = document.getElementById('mic-hint');
      if (micHint) micHint.textContent = '说完点这里停止';
      return true;
    }

    function isMicSessionLive() {
      return Boolean(hearRecognition)
        || Boolean(hearRecorder && hearRecorder.state !== 'inactive')
        || hearRecordBusy;
    }

    function stopHearSession(message) {
      splitRun += 1;
      hearFromMic = false;
      stopSplitListen();
      stopHearRecorder(true);
      const input = document.getElementById('hear-input');
      if (input) input.readOnly = false;
      render();
      if (message) setStatus(message);
      else setStatus(filledCount() ? '已停止。对上的词留着。' : '已停止。再点一次就能继续说。');
    }

    async function startMicSession(options) {
      const opts = options || {};
      const fromSpaceHold = Boolean(opts.fromSpaceHold);
      if (recording || hearRecordBusy) {
        setStatus('正在处理录音。请稍等。');
        return false;
      }
      if (busy) {
        try { stopPlaybackOnly(); } catch (_) {}
      }
      const parts = sentenceWords(current()[1]);
      if (!parts.length) return false;
      if (captionOn) {
        captionOn = false;
        try { localStorage.setItem('linglish_caption', '0'); } catch (_) {}
      }
      const useRecordAsr = shouldUseRecordAsr();

      const keep = splitActive() && splitState.targets.join('\n') === parts.join('\n');
      const input = document.getElementById('hear-input');
      if (!keep) {
        stopTyper();
        splitState = blankSlots(parts);
        hearFinalBuffer = '';
        if (input) input.value = '';
      }
      // 话筒开启时强制一词一横线（跟读格嵌在每个单词下）
      paintGloss(parts, true);
      paintHearLine();

      // 手机 / 微信：录音 → 服务端 ASR → 填横线（不依赖 Web Speech）
      if (useRecordAsr) {
        if (useRecordAsr && !readToken() && !(window.SpeechRecognition || window.webkitSpeechRecognition)) {
          setStatus('语音填空需要先登录。登录后再点话筒。');
        }
        try {
          const ok = await startHearRecordAsr(parts);
          if (!ok) {
            splitListen = null;
            render();
            return false;
          }
          return true;
        } catch (error) {
          console.warn('[daily-speaking] startHearRecordAsr failed', error);
          stopHearRecorder(true);
          splitListen = null;
          render();
          setStatus(isWeChatBrowser()
            ? '微信无法开始录音。请点右上角 ···，选择“在浏览器打开”。'
            : '无法开始录音。请检查麦克风权限后重试。');
          return false;
        }
      }

      // 标准浏览器：实时 Web Speech
      const allowed = await ensureMicPermission();
      if (!allowed) {
        setStatus('需要麦克风权限才能语音输入。请允许麦克风后重试。');
        return false;
      }
      try { stopPlaybackOnly(); } catch (_) {}
      splitListen = true;
      hearFromMic = true;
      hearTypedAt = 0;
      hearFinalBuffer = keep ? hearFinalBuffer : '';
      render();
      setStatus(fromSpaceHold
        ? '按住空格说话，松开结束。也可打字。'
        : '正在听…可语音也可打字，两边一起填词。');
      setTimeout(() => {
        const field = document.getElementById('hear-input');
        if (field) {
          field.readOnly = false;
          // 空格按住说话时不要抢焦点，否则空格会被输入框吃掉
          if (!fromSpaceHold) focusHearInput();
          else field.blur();
        }
        startHearWatch();
        startComputerMic(parts);
        showPractice();
      }, 0);
      return true;
    }

    async function toggleMic() {
      // 第二次点击：结束录音并识别
      if (splitListen && hearRecorder && hearRecorder.state !== 'inactive') {
        await finishHearRecordAndFill();
        return;
      }
      const micLive = isMicSessionLive();
      // 正在听 / 识别已挂但仍显示「正在听」：再点一律关闭，不能关不掉
      if (splitListen && (micLive || hearFromMic)) {
        stopHearSession();
        return;
      }
      // 仅打字填空（还没开麦）时再点主按钮 = 开麦，保留横线
      await startMicSession();
    }

    function stopSpeech() {
      const lineAudio = document.getElementById('line-audio');
      if (lineAudio) {
        lineAudio.pause();
      }
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    }

    function englishVoice(voices) {
      return voices.find((voice) => /^en([-_]|$)/i.test(voice.lang) && /aria|guy|jenny|sara|davis|andrew|emma|brian|zira|david/i.test(voice.name))
        || voices.find((voice) => /^en([-_]|$)/i.test(voice.lang))
        || null;
    }

    function waitForVoices() {
      const synth = window.speechSynthesis;
      if (!synth) return Promise.resolve([]);
      const ready = synth.getVoices();
      if (ready.length) return Promise.resolve(ready);
      return new Promise((resolve) => {
        const finish = () => {
          const voices = synth.getVoices();
          if (!voices.length) return;
          synth.removeEventListener('voiceschanged', finish);
          resolve(voices);
        };
        synth.addEventListener('voiceschanged', finish);
        setTimeout(() => {
          synth.removeEventListener('voiceschanged', finish);
          resolve(synth.getVoices());
        }, 80);
      });
    }

    function speakBrowser(text, token) {
      return new Promise((resolve) => {
        const synth = window.speechSynthesis;
        if (!synth || typeof SpeechSynthesisUtterance !== 'function') {
          resolve(false);
          return;
        }
        let settled = false;
        let started = false;
        const finish = (ok) => {
          if (settled) return;
          settled = true;
          clearInterval(kick);
          resolve(ok);
        };
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = speakLang();
        utterance.rate = methodId === 'speak' ? 0.84 : 0.92;
        const voice = englishVoice(synth.getVoices());
        if (voice) utterance.voice = voice;
        const maxMs = Math.min(20000, 3500 + String(text || '').length * 120);
        const timer = setTimeout(() => finish(token === playToken && started), maxMs);
        utterance.onstart = () => { started = true; };
        utterance.onend = () => { clearTimeout(timer); finish(token === playToken); };
        utterance.onerror = () => { clearTimeout(timer); finish(false); };
        const kick = setInterval(() => {
          if (synth.paused) synth.resume();
        }, 400);
        const lineAudio = document.getElementById('line-audio');
        const lineRow = document.getElementById('line-audio-row');
        if (lineAudio) lineAudio.pause();
        if (lineRow) lineRow.hidden = true;
        setTimeout(() => {
          if (synth.paused) synth.resume();
          synth.speak(utterance);
        }, 60);
      });
    }

    function playUrl(url, token) {
      return new Promise((resolve) => {
        const audio = document.getElementById('line-audio');
        if (!audio) {
          resolve(false);
          return;
        }
        let settled = false;
        const finish = (ok) => {
          if (settled) return;
          settled = true;
          resolve(ok);
        };
        audio.dataset.playToken = String(token);
        const lineRow = document.getElementById('line-audio-row');
        if (lineRow) {
          lineRow.hidden = true;
          lineRow.setAttribute('aria-hidden', 'true');
        }
        const timer = setTimeout(() => finish(true), 20000);
        const watch = setInterval(() => {
          if (token !== playToken) {
            clearInterval(watch);
            clearTimeout(timer);
            if (audio.dataset.playToken === String(token)) audio.pause();
            finish(false);
          }
        }, 200);
        audio.onended = () => { clearInterval(watch); clearTimeout(timer); finish(true); };
        audio.onerror = () => { clearInterval(watch); clearTimeout(timer); finish(false); };
        audio.src = url;
        audio.play().catch(() => { clearTimeout(timer); finish(false); });
      });
    }

    const ttsUrlCache = new Map();
    const ttsInFlight = new Map();

    function ttsCacheKey(text, voice) {
      return `${voice || voiceFor()}||${text}`;
    }

    async function fetchPracticeAudio(text, voice) {
      const key = ttsCacheKey(text, voice);
      if (ttsUrlCache.has(key)) return ttsUrlCache.get(key);
      if (ttsInFlight.has(key)) return ttsInFlight.get(key);
      const pending = (async () => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        try {
          const response = await fetch('/tts/practice', {
            method: 'POST',
            signal: controller.signal,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, voice: voice || voiceFor() }),
          });
          const data = await response.json().catch(() => ({}));
          if (response.ok && data.audioUrl) {
            ttsUrlCache.set(key, data.audioUrl);
            return data.audioUrl;
          }
        } catch (_) {} finally {
          clearTimeout(timer);
          ttsInFlight.delete(key);
        }
        return '';
      })();
      ttsInFlight.set(key, pending);
      return pending;
    }

    function warmPracticeAudio(text, voice) {
      fetchPracticeAudio(text, voice).catch(() => {});
    }

    async function speak(text, voice) {
      const token = playToken;
      stopSpeech();
      const key = ttsCacheKey(text, voice);
      const cached = ttsUrlCache.get(key);
      if (cached) {
        if (await playUrl(cached, token)) return true;
        if (token !== playToken) return false;
      }

      // 微信内 speechSynthesis 常无声，直接走网络；其它环境先本地发音
      const preferBrowser = Boolean(window.speechSynthesis)
        && typeof SpeechSynthesisUtterance === 'function'
        && !isWeChatBrowser();

      const practicePromise = fetchPracticeAudio(text, voice);

      if (preferBrowser) {
        await waitForVoices();
        if (token !== playToken) return false;
        if (await speakBrowser(text, token)) {
          practicePromise.catch(() => {});
          return true;
        }
        if (token !== playToken) return false;
      }

      const practiceUrl = await Promise.race([
        practicePromise,
        new Promise((resolve) => setTimeout(() => resolve(''), preferBrowser ? 1200 : 5000)),
      ]);
      if (token !== playToken) return false;
      if (practiceUrl && await playUrl(practiceUrl, token)) return true;
      if (token !== playToken) return false;

      const authToken = readToken();
      if (authToken) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 4000);
        try {
          const response = await fetch('/tts/generate', {
            method: 'POST',
            signal: controller.signal,
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + authToken,
            },
            body: JSON.stringify({ text, lang: 'en', provider: 'edge', voice: voice || voiceFor() }),
          });
          const data = await response.json().catch(() => ({}));
          if (token !== playToken) return false;
          if (response.ok && data.audioUrl) {
            ttsUrlCache.set(key, data.audioUrl);
            if (await playUrl(data.audioUrl, token)) return true;
          }
        } catch (_) {} finally {
          clearTimeout(timer);
        }
      }

      // 最后再试一次浏览器（非微信）
      if (preferBrowser) {
        if (token !== playToken) return false;
        return speakBrowser(text, token);
      }
      return false;
    }

    function setDockIcon(button, name, title) {
      if (!button) return;
      const icon = (window.LxIcon && window.LxIcon.html)
        ? window.LxIcon.html(name, { className: 'lx-icon--md' })
        : '';
      button.innerHTML = icon || button.innerHTML;
      if (title) {
        button.title = title;
        button.setAttribute('aria-label', title);
      }
    }

    function syncPlayLabel() {
      const button = document.getElementById('play-btn');
      if (!button) return;
      const stopping = busy && !recording;
      setDockIcon(button, stopping ? 'stop' : 'volume', stopping ? '停止播放' : '听原声（P）');
      button.classList.toggle('is-on', stopping);
    }

    function setSpeakButtons(disabled) {
      const read = document.getElementById('read-btn');
      if (read) read.disabled = disabled;
      // 上一句 / 下一句保持可点，播放中也可立刻切句并开声
      const play = document.getElementById('play-btn');
      if (play && !recording) {
        setDockIcon(play, disabled ? 'stop' : 'volume', disabled ? '停止播放' : '听原声（P）');
        play.classList.toggle('is-on', Boolean(disabled));
      }
    }

    function warmNeighborLines(center) {
      const turns = scene().turns || [];
      [-1, 0, 1].forEach((offset) => {
        const turn = turns[center + offset];
        if (turn) warmPracticeAudio(turn.speak || turn[1], voiceFor(turn[0]));
      });
    }

    async function playLineNow(index, statusText) {
      const turns = scene().turns || [];
      const turn = turns[index];
      if (!turn) return false;
      if (recording) {
        setStatus('正在录音。先结束跟读，再播放。');
        return false;
      }
      if (busy) haltPlayback();
      const token = ++playToken;
      busy = true;
      lineIndex = index;
      document.getElementById('review').hidden = true;
      render();
      showPractice();
      syncPlayLabel();
      setSpeakButtons(true);
      setPlayingLine(index);
      if (statusText) setStatus(statusText);
      else setStatus('');
      warmNeighborLines(index);
      let heard = false;
      try {
        heard = await speak(turn.speak || turn[1], voiceFor(turn[0]));
      } finally {
        if (token === playToken) {
          clearPlayingLine();
          busy = false;
          setSpeakButtons(false);
          syncPlayLabel();
        }
      }
      if (token !== playToken) return false;
      return heard;
    }

    function setPlayingLine(index) {
      playingLineIndex = Number.isFinite(index) ? index : -1;
      document.querySelectorAll('#dialogue .turn').forEach((el) => {
        const line = Number(el.dataset.line);
        const on = line === playingLineIndex;
        el.classList.toggle('is-playing', on);
        const horn = el.querySelector('.line-play');
        if (!horn) return;
        horn.classList.toggle('is-playing', on);
        horn.setAttribute('aria-label', on ? '播放中' : '朗读');
        if (window.LxIcon && typeof window.LxIcon.html === 'function') {
          horn.innerHTML = window.LxIcon.html(on ? 'pause' : 'volume', { className: 'lx-icon--sm' });
        } else {
          horn.textContent = on ? '❚❚' : '🔊';
        }
      });
    }

    function clearPlayingLine() {
      if (playingLineIndex < 0) return;
      playingLineIndex = -1;
      setPlayingLine(-1);
    }

    function haltPlayback() {
      playToken += 1;
      splitRun += 1;
      stopSplitListen();
      stopSpeech();
      busy = false;
      clearPlayingLine();
      const lineRow = document.getElementById('line-audio-row');
      if (lineRow) {
        lineRow.hidden = true;
        lineRow.setAttribute('aria-hidden', 'true');
      }
      const review = document.getElementById('review-btn');
      if (review) review.disabled = false;
      speakGeneration += 1;
      speakHold = false;
      clearTimeout(speakStopTimer);
      const shadow = document.getElementById('shadow-btn');
      if (shadow && !recording) {
        shadow.disabled = false;
        shadow.classList.remove('holding');
        shadow.textContent = shadowLabel();
      }
      setSpeakButtons(false);
    }

    async function playCurrent() {
      if (recording) {
        setStatus('正在录音。先结束跟读，再播放。');
        return;
      }
      if (isDictation() && dictationStep === 1) {
        setStatus('盲听阶段请点「朗读整段」。听完整段后再听写单句。');
        return;
      }
      if (methodId === 'speak') {
        revealed.add(lineKey(lineIndex));
        render();
      }
      const heard = await playLineNow(lineIndex, '');
      if (heard) setStatus('这句读完了。要再听点「重复播放」，继续下一段点「下一句」。');
      else setStatus('没有播出来。再点「重复播放」，或换一行。');
    }

    async function readAloud() {
      if (busy || recording) return;
      const token = ++playToken;
      busy = true;
      setSpeakButtons(true);
      syncDictationCoach();
      const turns = scene().turns;
      let heard = true;
      for (let index = 0; index < turns.length; index += 1) {
        if (token !== playToken) return;
        lineIndex = index;
        if (methodId === 'speak') revealed.add(lineKey(index));
        playingLineIndex = index;
        render();
        setStatus(isDictation() && dictationStep === 1
          ? `盲听 ${index + 1}/${turns.length}：${turns[index][0]}…`
          : `正在朗读 ${turns[index][0]} 的这句…`);
        heard = await speak(turns[index].speak || turns[index][1], voiceFor(turns[index][0]));
        if (token !== playToken) return;
        if (!heard) break;
      }
      clearPlayingLine();
      setSpeakButtons(false);
      busy = false;
      if (isDictation() && dictationStep === 1 && heard) {
        lineIndex = 0;
        dictationHeard = true;
        setDictationStep(2, '盲听完了。现在听写第一句：先播放，再用麦克风或键盘补全。');
        return;
      }
      setStatus(heard ? '整段对话读完了。可以点一句跟读。' : '朗读中断了。再点「重复播放」听本句。');
      syncDictationCoach();
    }

    async function stopRecording() {
      if (recorder && recorder.state !== 'inactive') recorder.stop();
    }

    async function openMic(button, playAfter) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('这台设备不能录音。可以点「看英文」，或切回「先听再跟」。');
        button.disabled = false;
        setSpeakButtons(false);
        busy = false;
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const spoken = current();
        chunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
        recorder.onstop = async () => {
          clearTimeout(speakStopTimer);
          speakStopTimer = 0;
          button.classList.remove('holding');
          stream.getTracks().forEach(track => track.stop());
          if (mineUrl) URL.revokeObjectURL(mineUrl);
          mineUrl = URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }));
          mineLineIndex = lineIndex;
          mineDurationSec = Math.max(1, Math.round(((Date.now() - (mineStartedAt || Date.now())) || 1000) / 1000));
          const mine = document.getElementById('mine-audio');
          mine.src = mineUrl;
          // 不展示音轨条：对话里用微信绿气泡预听
          const mineRow = document.getElementById('mine-audio-row');
          if (mineRow) {
            mineRow.hidden = true;
            mineRow.setAttribute('aria-hidden', 'true');
          }
          document.getElementById('mine-btn').disabled = false;
          recording = false;
          busy = false;
          button.disabled = false;
          setSpeakButtons(false);
          try { render(); } catch (_) {}
          if (playAfter) {
            revealed.add(lineKey(lineIndex));
            render();
            const token = ++playToken;
            busy = true;
            button.disabled = true;
            setSpeakButtons(true);
            setPlayingLine(lineIndex);
            setStatus('这是原句。正在播放…');
            const heard = await speak(spoken[1], voiceFor(spoken[0]));
            if (token !== playToken) return;
            clearPlayingLine();
            busy = false;
            button.disabled = false;
            setSpeakButtons(false);
            button.textContent = shadowLabel();
            setStatus(heard ? '原句听完了。要再跟一次，点「跟读这句」。' : '原句没有播出来。点「播放这句」再听一次。');
            return;
          }
          button.textContent = shadowLabel();
          button.classList.remove('holding');
          if (isDictation() && dictationStep === 4) {
            const total = scene().turns.length;
            setStatus(lineIndex >= total - 1
              ? '跟读完了。可以点「带走三句」，或换下一段再盲听。'
              : '跟读完了。点「下一句听写」继续。');
            syncDictationCoach();
          } else {
            setStatus('这句跟读已录好。可以听自己的录音，或练下一句。');
          }
        };
        mineStartedAt = Date.now();
        recorder.start();
        recording = true;
        busy = false;
        button.disabled = false;
        noteSpeakReady(button);
      } catch (_) {
        setStatus('没有打开麦克风。可以点「看英文」，或切回「先听再跟」。');
        button.disabled = false;
        setSpeakButtons(false);
        busy = false;
      }
    }

    function speakBufferMs() {
      const words = Math.max(1, sentenceWords(current()[1]).length);
      return Math.min(8000, Math.max(2200, 900 + words * 380));
    }

    function noteSpeakReady(button) {
      clearTimeout(speakStopTimer);
      if (speakHold) {
        button.classList.add('holding');
        button.textContent = '松开结束';
        setStatus('按住说。松开就结束。');
        return;
      }
      button.classList.remove('holding');
      button.textContent = '说完了';
      const seconds = Math.max(1, Math.round(speakBufferMs() / 1000));
      setStatus(`说吧。${seconds} 秒后自动结束。`);
      speakStopTimer = setTimeout(() => {
        if (recording && !speakHold) finishSpeak();
      }, speakBufferMs());
    }

    async function finishSpeak() {
      clearTimeout(speakStopTimer);
      speakStopTimer = 0;
      speakHold = false;
      const button = document.getElementById('shadow-btn');
      button.classList.remove('holding');
      if (!recording) {
        button.disabled = false;
        button.textContent = shadowLabel();
        return;
      }
      button.disabled = true;
      setStatus('正在保存录音…');
      await stopRecording();
    }

    function onSpeakPress() {
      const button = document.getElementById('shadow-btn');
      if (recording) {
        speakHold = true;
        clearTimeout(speakStopTimer);
        button.classList.add('holding');
        button.textContent = '松开结束';
        return;
      }
      if (busy) return;
      speakHold = true;
      button.classList.add('holding');
      startShadow();
    }

    function onSpeakRelease() {
      if (!speakHold) return;
      speakHold = false;
      const button = document.getElementById('shadow-btn');
      button.classList.remove('holding');
      if (recording) finishSpeak();
    }

    async function startShadow() {
      splitRun += 1;
      stopSplitListen();
      const button = document.getElementById('shadow-btn');
      const generation = ++speakGeneration;
      if (recording || busy) return;
      const hearFirst = methodId !== 'speak' || englishShown(lineIndex);
      if (hearFirst) {
        const token = ++playToken;
        busy = true;
        setSpeakButtons(true);
        setPlayingLine(lineIndex);
        setStatus(`先听 ${current()[0]} 说一遍，然后跟着说。`);
        const heard = await speak(current()[1], voiceFor(current()[0]));
        if (token !== playToken || generation !== speakGeneration) {
          clearPlayingLine();
          button.disabled = false;
          button.classList.remove('holding');
          button.textContent = shadowLabel();
          return;
        }
        clearPlayingLine();
        if (!heard) setStatus('原句没有播出来。麦克风打开后，你仍可以跟着说。');
        setSpeakButtons(false);
      }
      if (generation !== speakGeneration) return;
      await openMic(button, !hearFirst);
    }

    function releasePlayback() {
      if (!busy) return;
      haltPlayback();
    }

    function loadCorePack() {
      if (window.CORE_850 && window.CORE_850.length) return Promise.resolve(true);
      return new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = './data/core-850.js?v=2';
        script.onload = () => resolve(Boolean(window.CORE_850 && window.CORE_850.length));
        script.onerror = () => resolve(false);
        document.body.appendChild(script);
      });
    }

    function loadScriptPack(globalName, src) {
      if (window[globalName] && window[globalName].length) return Promise.resolve(true);
      return new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => resolve(Boolean(window[globalName] && window[globalName].length));
        script.onerror = () => resolve(false);
        document.body.appendChild(script);
      });
    }

    function packLabel(id) {
      if (id === 'core') return '850句';
      if (id === 'medical') return '医学词汇';
      if (id === 'daylife') return '一日口语';
      if (id === 'travel') return '旅游口语';
      if (id === 'kids') return '儿童口语';
      if (id === 'field') return '实景五段';
      if (id === 'material') return '我的教材';
      return '日常用语';
    }

    function syncPackSelect() {
      const select = document.getElementById('pack-select');
      if (!select) return;
      const known = ['daily', 'daylife', 'travel', 'kids', 'core', 'medical'];
      if (known.includes(packId)) select.value = packId;
    }

    async function switchPack(nextPack, options = {}) {
      if (!nextPack) return false;
      if (recording && !options.force) {
        setStatus('正在录音。先结束跟读，再换词库。');
        return false;
      }
      const ready = {
        core: Boolean(window.CORE_850 && window.CORE_850.length),
        medical: Boolean(window.MEDICAL_VOCAB && window.MEDICAL_VOCAB.length),
        daylife: Boolean(window.DAY_LIFE && window.DAY_LIFE.length),
        travel: Boolean(window.TRAVEL_SPEAK && window.TRAVEL_SPEAK.length),
        kids: Boolean(window.KIDS_SPEAK && window.KIDS_SPEAK.length),
      };
      if (nextPack === packId && !options.force) {
        if ((nextPack === 'core' && !ready.core)
          || (nextPack === 'medical' && !ready.medical)
          || (nextPack === 'daylife' && !ready.daylife)
          || (nextPack === 'travel' && !ready.travel)
          || (nextPack === 'kids' && !ready.kids)) {
          /* continue to load */
        } else {
          return true;
        }
      }
      releasePlayback();
      if (nextPack === 'core' && !ready.core) {
        setStatus('正在打开 850 词…');
        if (!(await loadCorePack())) {
          setStatus('850 词没有加载成功。请刷新页面后再点一次「850句」。');
          return false;
        }
      }
      if (nextPack === 'medical' && !ready.medical) {
        setStatus('正在打开医学词汇…');
        if (!(await loadScriptPack('MEDICAL_VOCAB', './data/medical-vocab.js?v=5'))) {
          setStatus('医学词汇没有加载成功。请刷新后再点一次。');
          return false;
        }
      }
      if (nextPack === 'daylife' && !ready.daylife) {
        setStatus('正在打开一日口语…');
        if (!(await loadScriptPack('DAY_LIFE', './data/day-life.js?v=1'))) {
          setStatus('一日口语没有加载成功。请刷新后再点一次。');
          return false;
        }
      }
      if (nextPack === 'travel' && !ready.travel) {
        setStatus('正在打开旅游口语…');
        if (!(await loadScriptPack('TRAVEL_SPEAK', './data/travel-speak.js?v=4'))) {
          setStatus('旅游口语没有加载成功。请刷新后再点一次。');
          return false;
        }
      }
      if (nextPack === 'kids' && !ready.kids) {
        setStatus('正在打开儿童口语…');
        if (!(await loadScriptPack('KIDS_SPEAK', './data/kids-speak.js?v=1'))) {
          setStatus('儿童口语没有加载成功。请刷新后再点一次。');
          return false;
        }
      }
      packId = nextPack;
      if (nextPack !== 'material') {
        currentMaterialId = '';
        materialTitle = '';
        materialScenes = null;
      }
      sceneIndex = Number.isFinite(options.scene) ? Number(options.scene) : 0;
      lineIndex = Number.isFinite(options.line) ? Number(options.line) : 0;
      const scenes = activeScenes();
      if (scenes.length) {
        sceneIndex = Math.max(0, Math.min(sceneIndex, scenes.length - 1));
        const maxLine = Math.max(((scenes[sceneIndex].turns && scenes[sceneIndex].turns.length) || 1) - 1, 0);
        lineIndex = Math.max(0, Math.min(lineIndex, maxLine));
      } else {
        sceneIndex = 0;
        lineIndex = 0;
      }
      if (isDictation()) resetDictationForScene(1);
      syncPackSelect();
      document.getElementById('review').hidden = true;
      stopSpeech();
      render();
      const sceneList = document.getElementById('scenes');
      sceneList.scrollTop = 0;
      syncSpeakingUrl();
      saveSpeakingProgressNow();
      if (options.quiet) return true;

    function reviewIndexes(turns) {
      if (turns.length <= 3) return turns.map((_, index) => index);
      const mid = Math.floor((turns.length - 1) / 2);
      return [0, mid, turns.length - 1];
    }

    async function reviewThree() {
      if (busy || recording) return;
      const turns = scene().turns;
      const indexes = reviewIndexes(turns);
      const box = document.getElementById('review');
      box.hidden = false;
      box.innerHTML = '<p>这段只带走这三句。再说一遍，不讲语法。</p><ol>' + indexes.map((index) => (
        `<li><strong>${escapeHtml(turns[index][1])}</strong><em>${escapeHtml(turns[index][2])}</em></li>`
      )).join('') + '</ol>';
      indexes.forEach((index) => revealed.add(lineKey(index)));
      const token = ++playToken;
      busy = true;
      document.getElementById('review-btn').disabled = true;
      setSpeakButtons(true);
      for (const index of indexes) {
        if (token !== playToken) return;
        lineIndex = index;
        playingLineIndex = index;
        render();
        setStatus(`跟着说：${turns[index][1]}`);
        await speak(turns[index][1], voiceFor(turns[index][0]));
        if (token !== playToken) return;
      }
      clearPlayingLine();
      setStatus('三句说完就可以换下一段。');
      document.getElementById('review-btn').disabled = false;
      setSpeakButtons(false);
      busy = false;

    function revealCurrent() {

          setStatus('盲听阶段先听整段，听完再听写。');
          return;

        playCurrent();

        playCurrent();
        return;

      revealed.add(lineKey(lineIndex));
      render();
      setStatus('这一句的英文打开了。点「重复播放」可以再听。');
    }

    async function nextLine() {
      if (recording) return;
      const total = scene().turns.length;
      if (isDictation()) {
        if (busy) haltPlayback();
        if (dictationStep === 1) {
          setStatus('先盲听整段。点「朗读整段」听完后再换句。');
          return;
        }
        if (dictationStep === 2 && !revealed.has(lineKey(lineIndex))) {
          setStatus('这一句还没听写完。补全后再下一句，或点步骤条跳到拆词。');
          return;
        }
        if (lineIndex >= total - 1) {
          await reviewThree();
          return;
        }
        lineIndex += 1;
        document.getElementById('review').hidden = true;
        setDictationStep(2, '下一句听写。先听一遍，再说出来或打出来。');
        showPractice();
        return;
      }
      if (methodId === 'speak') {
        if (busy) haltPlayback();
        if (!englishShown(lineIndex)) {
          setStatus('这一句的英文还藏着。先看中文，说完再点「看英文」。');
          return;
        }
        if (lineIndex >= total - 1) {
          await reviewThree();
          return;
        }
        lineIndex += 1;
        document.getElementById('review').hidden = true;
        render();
        showPractice();
        setStatus('下一句。先看中文，自己说。');
        return;
      }
      const nextIndex = lineIndex + 1 < total ? lineIndex + 1 : 0;
      const turn = scene().turns[nextIndex];
      warmNeighborLines(nextIndex);
      const nextBtn = document.getElementById('next-btn');
      if (nextBtn && document.activeElement === nextBtn) {
        try { nextBtn.blur(); } catch (_) {}
      }
      const startNote = nextIndex === 0 && total > 1
        ? `这段到头了，回到第一句：${turn[0]}`
        : `下一句：${turn[0]}`;
      const heard = await playLineNow(nextIndex, startNote);
      showPractice();
      setStatus(heard
        ? '这句读完了。要再听点「重复播放」，继续下一段点「下一句」。'
        : '这句没有播出来。点「重复播放」再听一次。');
    }

    async function openKeyboardHear() {
      const parts = sentenceWords(current()[1]);
      if (!parts.length) {
        setStatus('这句还不能填词。');
        return;
      }
      if (captionOn) {
        captionOn = false;

        if (captionSwitch) {
          captionSwitch.classList.remove('on');

        }
      }
      if (!splitListen) {
        // 只开填空打字，不强制开麦；用户仍可再点口语训练开语音
        const keep = splitActive() && splitState.targets.join('\n') === parts.join('\n');
        const input = document.getElementById('hear-input');
        if (!keep) {
          stopTyper();
          splitState = blankSlots(parts);
          hearFinalBuffer = '';
          if (input) input.value = '';
        }
        try { stopPlaybackOnly(); } catch (_) {}
        splitListen = true;
        hearFromMic = false;
        paintGloss(parts, true);
        paintHearLine();
        render();
        if (input) {
          input.readOnly = false;
          focusHearInput();
        }
        startHearWatch();
        setStatus('可以打字填词。要语音再说，点「口语训练」或按空格。');
        return;
      }
      const field = document.getElementById('hear-input');
      if (field) {
        field.readOnly = false;

    function openSceneIntensiveNote(mode) {

      const ok = window.WorkbenchImport.openIntensiveNote({

        template: 'intensive-note',

        source: 'daily-speaking',
        sameTab: true,
        onEmpty: () => setStatus(mode === 'line' ? '当前没有可导出的英文句子。' : '当前场景没有英文句子。'),

    function shortcutTarget(el) {
      if (!el || el.disabled || el.hidden) return false;
      if (el.getAttribute('aria-hidden') === 'true') return false;
      if (el.offsetParent === null && getComputedStyle(el).position !== 'fixed') return false;

      return true;
    }

    function isTypingTarget(el) {
      if (!el) return false;
      const tag = (el.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
      return Boolean(el.isContentEditable);
    }

    function readAuthToken() {
      const keys = ['linglish_token', 'authToken'];
      for (const key of keys) {
        try {
          const value = localStorage.getItem(key) || sessionStorage.getItem(key);
          if (value && value !== 'null' && value !== 'undefined') return value;
        } catch (_) {}
      }
      return '';
    }

    function englishEnough(line) {
      const words = String(line || '').match(/[A-Za-z][A-Za-z']*/g) || [];
      return words.join('').length >= 6;
    }

    function paperBlocks(content) {
      try {
        const parsed = JSON.parse(content);
        if (parsed && parsed.kind === 'exam-paper' && Array.isArray(parsed.blocks)) return parsed;
      } catch (_) {}
      return null;
    }

    function isLongText(text) {
      const raw = String(text || '').trim();
      if (!raw) return false;
      const words = raw.match(/[A-Za-z][A-Za-z']*/g) || [];
      // 先抹掉常见缩写点，再按句号切，避免 Mrs. / Dr. 被当成两句
      const normalized = raw
        .replace(/\b(Mr|Mrs|Ms|Miss|Dr|Prof|Jr|Sr|St|vs|etc|e\.g|i\.e)\./gi, '$1')
        .replace(/\b[A-Z]\./g, 'X');
      const sentences = normalized.split(/[.!?。！？]+/).filter((item) => item.trim().length > 6);
      return words.length > 28 || sentences.length > 1 || raw.length > 140;
    }

    function makeTurn(who, text, extra) {
      const turn = [who, text, ''];
      Object.assign(turn, extra || {});
      return turn;
    }

    function collectAnswers(blocks) {
      const map = new Map();
      (blocks || []).forEach((block) => {
        if (block.type !== 'answer') return;
        (block.lines || []).forEach((line) => {
          const text = String(line.text || '').trim();
          const spoken = String(line.speak || '');
          const range = text.match(/(\d+)\s*[-–~到至]\s*(\d+)\s*([A-Ea-e]+)\b/)
            || spoken.match(/第(\d+)到第(\d+)题的答案是\s*([A-E，,\s]+)/);
          if (range) {
            const from = Number(range[1]);
            const to = Number(range[2]);
            const letters = /[，,]/.test(range[3])
              ? range[3].split(/[，,\s]+/).filter(Boolean)
              : range[3].toUpperCase().split('');
            letters.forEach((letter, offset) => {
              const number = from + offset;
              if (number <= to && /^[A-E]$/i.test(letter)) map.set(number, letter.toUpperCase());
            });
            return;
          }
          const single = text.match(/^(\d{1,3})[.、．]\s*(.+)$/)
            || spoken.match(/第(\d+)题的答案是\s*(.+)$/)
            || spoken.match(/第(\d+)题，\s*(.+)$/);
          if (single) map.set(Number(single[1]), single[2].trim());
        });
      });
      return map;
    }

    function scenesFromPaper(paper, title) {
      const answers = collectAnswers(paper.blocks);
      const scenes = [];
      let current = null;
      let group = '';
      const push = () => {
        if (current && current.turns.length) {
          const passages = current.turns.filter((turn) => turn.kind === 'passage' && turn[0] === '课文');
          if (passages.length > 1) passages.forEach((turn, index) => { turn[0] = `课文 ${index + 1}`; });
          const keys = current.turns.filter((turn) => turn.kind === 'answer');
          if (keys.length > 1) keys.forEach((turn, index) => { turn[0] = `答案 ${index + 1}`; });
          scenes.push(current);
        }
        current = null;
        group = '';
      };
      const ensure = () => {
        if (!current) current = { tag: '教材', title: paper.title || title, place: title, turns: [] };
      };
      (paper.blocks || []).forEach((block) => {
        if (block.type === 'heading' && block.level === 2) {
          push();
          current = { tag: '教材', title: block.text, place: title, turns: [] };
          return;
        }
        if (block.type === 'heading' && block.level === 3) {
          ensure();
          group = block.text;
          return;
        }
        if (block.type === 'choices') {
          const prev = current && current.turns[current.turns.length - 1];
          if (prev && prev.kind === 'question' && !(prev.options || []).length) {
            prev.options = (block.items || []).map((item) => String(item).trim()).filter(Boolean);
            prev.speak = [prev.stem, ...prev.options].filter(Boolean).join(' ');
          }
          return;
        }
        if (block.type === 'question') {
          ensure();
          const number = Number(block.number);
          const stem = String(block.stem || '').trim();
          const options = (block.options || []).map((item) => String(item).trim()).filter(Boolean);
          const speak = [stem, ...options].filter(Boolean).join(' ') || String(block.speak || '');
          if (!englishEnough(speak) && !/[\u4e00-\u9fff]{4,}/.test(speak)) return;
          current.turns.push(makeTurn(number ? `第${number}题` : '题目', stem || speak, {
            kind: 'question',
            stem,
            options,
            answer: answers.get(number) || '',
            speak,
            group,
            long: false,
          }));
          return;
        }
        if (block.type === 'passage') {
          ensure();
          const paragraphs = (block.paragraphs || []).map((item) => String(item.text || item.speak || '').trim()).filter(Boolean);
          if (!paragraphs.length) return;
          const body = paragraphs.join('\n\n');
          current.turns.push(makeTurn('课文', body, {
            kind: 'passage',
            body,
            speak: body,
            group,
            long: true,
          }));
          return;
        }
        if (block.type === 'answer') {
          ensure();
          (block.lines || []).forEach((line) => {
            const text = String(line.text || '').trim();
            if (!text) return;
            const spoken = line.speak || text;
            current.turns.push(makeTurn('答案', spoken, {
              kind: 'answer',
              body: text,
              speak: spoken,
              answer: text,
              group,
              long: isLongText(text),
            }));
          });
          return;
        }
        if ((block.type === 'prompt' || block.type === 'info' || block.type === 'note' || block.type === 'list') && (block.text || block.items)) {
          const text = String(block.text || (block.items || []).join('\n')).trim();
          if (!text) return;
          if (!englishEnough(text) && !/[\u4e00-\u9fff]{6,}/.test(text)) return;
          ensure();
          const long = isLongText(text);
          current.turns.push(makeTurn('说明', text, {
            kind: long ? 'passage' : 'note',
            body: text,
            speak: text,
            group,
            long,
          }));
        }
      });
      push();
      return scenes;
    }

    function scenesFromPlain(content, title) {
      const raw = String(content || '').replace(/\r/g, '').trim();
      if (!raw) return [];
      const chunks = raw.split(/\n{2,}/).map((item) => item.trim()).filter(Boolean);
      const units = chunks.length > 1 ? chunks : raw.split(/\n/).map((item) => item.trim()).filter(Boolean);
      const heading = (line) => {
        const one = line.split('\n')[0].trim();
        if (line.includes('\n') || one.length > 36) return false;
        return /^第[一二三四五六七八九十0-9]+[部节章课]/.test(one)
          || /^(unit|chapter|lesson)\b/i.test(one)
          || /^#{1,3}\s+\S/.test(one);
      };
      const scenes = [];
      let current = null;
      let paragraph = 0;
      const push = () => {
        if (current && current.turns.length) scenes.push(current);
        current = null;
        paragraph = 0;
      };
      units.forEach((unit) => {
        if (heading(unit)) {
          push();
          current = { tag: '教材', title: unit.replace(/^#{1,3}\s+/, '').trim(), place: title, turns: [] };
          return;
        }
        const text = unit.trim();
        if (!englishEnough(text) && !/[\u4e00-\u9fff]{6,}/.test(text)) return;
        if (!current) current = { tag: '教材', title, place: '导入的课文', turns: [] };
        paragraph += 1;
        const long = isLongText(text);
        current.turns.push(makeTurn(long ? `第${paragraph}段` : `第${paragraph}句`, text, {
          kind: long ? 'passage' : 'text',
          body: text,
          speak: text,
          long,
        }));
      });
      push();
      return scenes;
    }

    function scenesFromArticle(article) {
      const title = String(article.title || '我的教材');
      const paper = paperBlocks(article.content);
      if (paper) return scenesFromPaper(paper, title);
      return scenesFromPlain(article.content, title);
    }

    async function openMaterial(id, options = {}) {
      if (recording) {
        setStatus('先结束跟读，再打开教材。');
        return;
      }
      const token = readAuthToken();
      closeMaterialsModal();
      setStatus('正在打开教材…');
      try {
        const response = await fetch('/articles/' + encodeURIComponent(id), {
          headers: token ? { Authorization: 'Bearer ' + token } : {},
        });
        const article = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(article.message || '打不开这份教材');
        const scenes = scenesFromArticle(article);
        if (!scenes.length) {
          setStatus('这份教材里没有可跟读的句子。');
          return;
        }
        releasePlayback();
        materialScenes = scenes;
        packId = 'material';
        currentMaterialId = String(id || '');
        materialTitle = String(article.title || '我的教材');
        let nextScene = Number.isFinite(options.scene) ? Number(options.scene) : 0;
        let nextLine = Number.isFinite(options.line) ? Number(options.line) : 0;
        if (options.fromProgress) {
          const saved = findSpeakingProgress((item) => item.id === 'material:' + currentMaterialId);
          if (saved) {
            nextScene = Number(saved.sceneIndex) || 0;
            nextLine = Number(saved.lineIndex) || 0;
          }
        }
        sceneIndex = Math.max(0, Math.min(nextScene, scenes.length - 1));
        const maxLine = Math.max(((scenes[sceneIndex].turns && scenes[sceneIndex].turns.length) || 1) - 1, 0);
        lineIndex = Math.max(0, Math.min(nextLine, maxLine));
        syncPackSelect();
        document.getElementById('review').hidden = true;
        stopSpeech();
        render();
        document.getElementById('scenes').scrollTop = 0;
        const total = scenes.reduce((sum, item) => sum + item.turns.length, 0);
        const resumed = Boolean(options.fromProgress || options.scene || options.line) && (sceneIndex > 0 || lineIndex > 0);
        setStatus(resumed
          ? `继续学习「${materialTitle}」· ${current()[0] || ''}。`
          : `已打开「${materialTitle}」。${scenes.length} 个章节，${total} 项。左侧按章节选题。短题看选项，长文点开阅读。`);
        syncSpeakingUrl();
        saveSpeakingProgressNow();
      } catch (err) {
        setStatus(err.message || '教材没有打开。');
      }
    }

    function closeMaterialsModal() {
      const modal = document.getElementById('materials-modal');
      if (!modal || modal.hidden) return;
      modal.hidden = true;
    }

    async function openMaterialsModal() {
      const modal = document.getElementById('materials-modal');
      const list = document.getElementById('materials-list');
      if (!modal || !list) return;
      modal.hidden = false;
      list.innerHTML = '<p class="hint">正在读取…</p>';
      const token = readAuthToken();
      if (!token) {
        list.innerHTML = '<p class="hint">登录后才能查看已导入的教材。也可以先去导入页。</p>';
        return;
      }
      try {
        const response = await fetch('/articles', { headers: { Authorization: 'Bearer ' + token } });
        const data = await response.json().catch(() => ({}));
        const kinds = new Set(['pdf', 'text', 'txt', 'md', 'docx', 'epub', 'image', 'html']);
        const items = (data.items || []).filter((article) =>
          kinds.has(article.source_type) || article.pdf_path
        );
        if (!items.length) {
          list.innerHTML = '<p class="hint">还没有导入的教材。点下方「导入新教材」添加。</p>';
          return;
        }
        const progressById = new Map();
        loadSpeakingProgressList().forEach((row) => {
          if (row && row.materialId) progressById.set(String(row.materialId), row);
        });
        list.innerHTML = items.map((article) => {
          const kind = article.source_type || '文档';
          const saved = progressById.get(String(article.id));
          const percent = saved
            ? Math.max(0, Math.min(100, Number(saved.percent) || 0))
            : null;
          const meta = percent == null
            ? `${escapeHtml(kind)} · ${article.word_count || 0} 词`
            : `${escapeHtml(kind)} · ${article.word_count || 0} 词 · <span class="progress-pct">${percent}%</span>`;
          const enter = percent == null ? '在这页练' : (percent > 0 ? '继续练' : '在这页练');
          return `<button class="materials-item" type="button" data-material="${escapeHtml(article.id)}">
            <span>
              <strong>${escapeHtml(article.title || '未命名文档')}</strong>
              <em>${meta}</em>
            </span>
            <span class="enter">${enter}</span>
          </button>`;
        }).join('');
      } catch (_) {
        list.innerHTML = '<p class="hint">暂时读不到教材列表，请稍后再试。</p>';
      }
    }

    document.getElementById('materials-list').addEventListener('click', (event) => {
      const item = event.target.closest('[data-material]');
      if (!item) return;
      openMaterial(item.dataset.material, { fromProgress: true });
    });
    document.getElementById('materials-btn').addEventListener('click', openMaterialsModal);
    document.getElementById('materials-close').addEventListener('click', closeMaterialsModal);
    document.getElementById('materials-modal').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) closeMaterialsModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;

      const materialsOpen = !document.getElementById('materials-modal').hidden;
      if (materialsOpen) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeMaterialsModal();
        }
        return;
      }

      const key = event.key;
      if (key === ' ' || key === 'Spacebar') {
        // 输入框打字时保留空格键；口语听写时用空格按住说话
        const typingHear = isTypingTarget(event.target)
          && event.target && event.target.id === 'hear-input'
          && !(splitListen && hearFromMic);
        if (typingHear) return;
        if (isTypingTarget(event.target) && !(event.target && event.target.id === 'hear-input')) return;
        event.preventDefault();
        if (event.repeat || spaceHeld) return;
        spaceHeld = true;
        spaceHoldToken += 1;
        const token = spaceHoldToken;
        // 按住空格：开始听；松开再停。忽略键盘重复触发，避免刚开又关。
        if (isMicSessionLive() || (splitListen && hearFromMic)) return;
        startMicSession({ fromSpaceHold: true }).then((ok) => {
          if (!ok && token === spaceHoldToken) spaceHeld = false;
        }).catch(() => {
          if (token === spaceHoldToken) spaceHeld = false;
        });
        return;
      }

      if (isTypingTarget(event.target)) return;

      if (stageTypeSizeEnabled()
        && (key === '+' || key === '=' || key === 'Add' || key === 'NumpadAdd')) {
        event.preventDefault();
        nudgeStageTypeScale(1);
        return;
      }
      if (stageTypeSizeEnabled()
        && (key === '-' || key === '_' || key === 'Subtract' || key === 'NumpadSubtract')) {
        event.preventDefault();
        nudgeStageTypeScale(-1);
        return;
      }

      if (key === 'ArrowLeft') {
        event.preventDefault();
        shortcutTarget(document.getElementById('prev-btn'));
        return;
      }
      if (key === 'ArrowRight') {
        event.preventDefault();
        shortcutTarget(document.getElementById('next-btn'));
        return;
      }
      if (key === 'Enter') {
        event.preventDefault();
        if (event.repeat || enterHeld) return;
        enterHeld = true;
        onSpeakPress();
        return;
      }
      if (key === 'm' || key === 'M') {
        event.preventDefault();
        shortcutTarget(document.getElementById('mic-btn'));
        return;
      }
      if (key === 'p' || key === 'P') {
        event.preventDefault();
        shortcutTarget(document.getElementById('play-btn'));
      }
    });
    function clearLineAudio() {
      const audio = document.getElementById('line-audio');
      const playing = audio && audio.src && !audio.paused && !audio.ended;
      if (playing) haltPlayback();
      if (audio) {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
      }
      const row = document.getElementById('line-audio-row');
      if (row) row.hidden = true;
      setStatus('已删除这句原声。再点「重复播放」会重新读。');
    }

    function clearMineAudio() {
      const mine = document.getElementById('mine-audio');
      if (mine) {
        mine.pause();
        mine.removeAttribute('src');
        mine.load();
      }
      if (mineUrl) URL.revokeObjectURL(mineUrl);
      mineUrl = '';
      mineLineIndex = -1;
      mineDurationSec = 0;
      mineStartedAt = 0;
      const row = document.getElementById('mine-audio-row');
      if (row) row.hidden = true;
      document.getElementById('mine-btn').disabled = true;
      try { render(); } catch (_) {}
      setStatus('已删除你的跟读。');
    }

    document.getElementById('line-audio-delete').addEventListener('click', () => {
      if (recording) {
        setStatus('正在录音。先结束跟读，再删除原声。');
        return;
      }
      clearLineAudio();
    });
    document.getElementById('mine-audio-delete').addEventListener('click', () => {
      if (recording) {
        setStatus('正在录音。先结束跟读，再删除跟读。');
        return;
      }
      clearMineAudio();
    });

    document.addEventListener('keyup', (event) => {
      if (event.key === ' ' || event.key === 'Spacebar') {
        if (!spaceHeld) return;
        spaceHeld = false;
        spaceHoldToken += 1;
        if (isMicSessionLive() || (splitListen && hearFromMic)) {
          stopHearSession(filledCount()
            ? '已停止。对上的词留着。可再按住空格继续说。'
            : '已停止。再按住空格继续说，或点按钮。');
        }
        return;
      }
      if (event.key !== 'Enter' || !enterHeld) return;
      enterHeld = false;
      onSpeakRelease();
    });
    window.addEventListener('blur', () => {
      enterHeld = false;
      if (spaceHeld) {
        spaceHeld = false;
        spaceHoldToken += 1;
        if (isMicSessionLive() || (splitListen && hearFromMic)) {
          stopHearSession('已停止。窗口失焦，松开空格后可再按住继续。');
        }
      }
      if (speakHold) onSpeakRelease();
    });
    document.getElementById('mine-btn').addEventListener('click', () => {
      const mine = document.getElementById('mine-audio');
      if (!mine || !mine.src) return;
      const mineRow = document.getElementById('mine-audio-row');
      if (mineRow) {
        mineRow.hidden = true;
        mineRow.setAttribute('aria-hidden', 'true');
      }
      try { mine.pause(); mine.currentTime = 0; } catch (_) {}
      mine.play().then(() => setStatus('正在播放你的跟读。')).catch(() => {
        setStatus('录音播放失败，请再试一次。');
      });
    });

    window.addEventListener('storage', (event) => {
      if (!event) return;
      if (event.key !== 'linglish_tts_voice' && event.key !== 'linglish_daily_accent') return;
      if (recording || busy) return;
      if (!refreshAccentFromMembership()) return;
      haltPlayback();
      document.getElementById('review').hidden = true;
      render();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || recording || busy) return;
      if (!refreshAccentFromMembership()) return;
      render();
    });
    waitForVoices();
    loadGlossLexicon();

    async function bootSpeaking() {
      const params = new URLSearchParams(location.search);
      const materialId = params.get('material');
      const packParam = params.get('pack');
      const sceneParam = params.has('scene') ? Number(params.get('scene')) : NaN;
      const lineParam = params.has('line') ? Number(params.get('line')) : NaN;
      const hasExplicitPos = Number.isFinite(sceneParam) || Number.isFinite(lineParam);

      if (materialId) {
        await openMaterial(materialId, {
          scene: sceneParam,
          line: lineParam,
          fromProgress: !hasExplicitPos,
        });
        return;
      }

      if (packParam) {
        const saved = !hasExplicitPos
          ? findSpeakingProgress((item) => item.id === 'pack:' + packParam)
          : null;
        const scene = hasExplicitPos ? (sceneParam || 0) : (Number(saved && saved.sceneIndex) || 0);
        const line = hasExplicitPos ? (lineParam || 0) : (Number(saved && saved.lineIndex) || 0);
        await switchPack(packParam, {
          scene,
          line,
          force: true,
          quiet: Boolean(saved) || hasExplicitPos,
          resumeNote: saved
            ? `继续学习「${packLabel(packParam)}」· ${saved.place || ''}。`
            : '',
        });
        return;
      }

      const latest = loadSpeakingProgressList()[0];
      if (latest && latest.materialId) {
        await openMaterial(latest.materialId, {
          scene: Number(latest.sceneIndex) || 0,
          line: Number(latest.lineIndex) || 0,
        });
        return;
      }
      if (latest && latest.packId && latest.packId !== 'material') {
        await switchPack(latest.packId, {
          scene: Number(latest.sceneIndex) || 0,
          line: Number(latest.lineIndex) || 0,
          force: true,
          quiet: true,
          resumeNote: `继续学习「${packLabel(latest.packId)}」· ${latest.place || ''}。`,
        });
        return;
      }

      syncPackSelect();
      render();
    }

    bootSpeaking();
  </script>
