<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日常用语 — Linglish</title>
  <link rel="icon" href="/linglish-favicon.svg?v=4" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/tokens.css?v=2">
  <link rel="stylesheet" href="./styles/icons.css?v=1">
  <link rel="stylesheet" href="./styles/speak-ui.css?v=3">
  <style>
    html, body {
      height: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overflow-x: hidden;
      background: #f8fafc;
      color: #0f172a;
      font-family: Manrope, "PingFang SC", "Microsoft YaHei", sans-serif;
      overscroll-behavior-x: none;
    }
    .nav {
      position: relative;
      z-index: 20;
      flex: none;
      width: min(1520px, calc(100% - 24px));
      margin: 8px auto 0;
      padding: 4px 14px;
      min-height: 52px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 4px 90px rgba(0, 0, 0, 0.04);
    }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand {
      color: #0f172a;
      font-weight: 800;
      text-decoration: none;
      font-size: 18px;
      line-height: 1;
      white-space: nowrap;
    }
    .nav-btn.back {
      height: 32px;
      padding: 0 12px;
      border-color: #e2e8f0;
      background: #fff;
      color: #0f766e;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-left: auto;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 14px;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      background: #fff;
      color: #0f766e;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-btn.materials {
      border-color: #0f766e;
      background: #0f766e;
      color: #fff;
      box-shadow: 0 2px 10px rgba(15, 118, 110, 0.22);
    }
    main {
      flex: 1;
      min-height: 0;
      width: min(1520px, 100%);
      margin: 0 auto;
      padding: 8px 12px 28px;
      box-sizing: border-box;
      display: flex;
    }
    /* 电脑 / 客户端：铺满可视宽度；手机保持下方 max-width:980 原样 */
    @media (min-width: 981px) {
      .nav {
        width: calc(100% - 16px);
        max-width: none;
        margin: 6px 8px 0;
      }
      main {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 6px 8px 12px;
      }
      .workspace {
        grid-template-columns: minmax(200px, 280px) minmax(0, 1fr) minmax(260px, 380px);
        gap: 12px;
      }
    }
    @media (min-width: 1400px) {
      .workspace {
        grid-template-columns: minmax(220px, 320px) minmax(0, 1fr) minmax(300px, 440px);
      }
    }
    .packs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 0;
      min-width: 0;
      flex-wrap: nowrap;
    }
    .packs .method-select.pack-method,
    .packs .pack-select {
      flex: 0 1 auto;
      width: auto;
      min-width: 0;
      max-width: min(168px, 46vw);
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid #0f766e;
      border-radius: 999px;
      background: #fff;
      color: #0f766e;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .packs .pack-select {
      border-color: #cbd5e1;
      color: #0f172a;
      font-weight: 700;
    }
    .packs .pack-select:focus {
      outline: none;
      border-color: #0f766e;
      color: #0f766e;
    }
    .words {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 8px;
      max-height: 72px;
      overflow: auto;
      padding-right: 2px;
    }
    .word {
      border-radius: 999px;
      background: #f0fdfa;
      color: #0f766e;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .workspace {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(180px, 220px) minmax(0, 1.85fr) minmax(220px, 300px);
      grid-template-rows: minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
    }
    .card {
      min-height: 0;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border-radius: 24px;
      padding: 14px 14px 10px;
      box-shadow: 0 4px 90px rgba(0, 0, 0, 0.04);
    }
    .card.stage {
      padding-left: 0;
      padding-right: 0;
    }
    .card.stage > .scene-picker,
    .card.stage > .words,
    .card.stage > .method-hint,
    .card.stage > .dictation-coach,
    .card.stage > .mic-dock,
    .card.stage > .review,
    .card.stage > .transport,
    .card.stage > .audio-row {
      padding-left: 12px;
      padding-right: 12px;
      box-sizing: border-box;
    }
    .lines, .dialogue {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
    }
    .line {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 16px;
      padding: 12px 14px;
      font: inherit;
      cursor: pointer;
      color: #0f172a;
    }
    .line strong { display: block; font-size: 16px; line-height: 22px; }
    .line span { display: block; margin-top: 4px; color: #64748b; font-size: 14px; }
    .tag {
      margin: 16px 4px 2px;
      color: #0f766e;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    .tag:first-child { margin-top: 0; }
    .line.active { background: #f0fdfa; border-color: #99f6e4; }
    .q-list { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 10px 12px; }
    .q-group { margin: 8px 8px 2px; color: #64748b; font-size: 12px; font-weight: 800; }
    .q-jump {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 6px 10px;
      font: inherit;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .q-jump.active { background: #ccfbf1; color: #0f766e; }
    .exam-sheet { width: 100%; text-align: left; }
    .exam-sheet[hidden] { display: none; }
    .now.is-exam {
      justify-content: flex-start;
      overflow: hidden;
    }
    .now.is-exam .now-body {
      justify-content: flex-start;
      align-items: stretch;
      text-align: left;
      gap: 10px;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px;
    }
    .now.is-exam .now-who {
      font-size: 12px;
    }
    .now.is-exam .now-en {
      width: 100%;
      font-size: 20px;
      line-height: 28px;
      font-weight: 800;
      text-align: left;
    }
    .now.is-exam.caption .now-en {
      font-size: 20px !important;
      line-height: 28px !important;
    }
    .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .choice {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 12px;
      padding: 8px 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      line-height: 22px;
      color: #0f172a;
      cursor: pointer;
    }
    .choice:hover { border-color: #99f6e4; }
    .answer-toggle {
      margin-top: 10px;
      border: 1px dashed #0f766e;
      background: #f0fdfa;
      color: #0f766e;
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .answer-body {
      margin: 8px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff;
      color: #0f172a;
      font-weight: 700;
      line-height: 26px;
    }
    .choice.is-key { border-color: #0f766e; background: #f0fdfa; }
    .why {
      display: block;
      margin-top: 6px;
      color: #0f766e;
      font-size: 15px;
      font-weight: 650;
      line-height: 24px;
    }
    .read-fold {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      padding: 10px 12px;
    }
    .read-fold summary { cursor: pointer; font-weight: 800; line-height: 28px; }
    .read-body { margin-top: 10px; line-height: 28px; white-space: pre-wrap; }
    .opt-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .opt-line { display: block; color: #334155; font-size: 15px; font-weight: 700; line-height: 22px; }
    .turn em:empty { display: none; padding: 0; border: 0; }
    .scene-title {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .place[hidden],
    .method-hint[hidden] {
      display: none !important;
    }
    .method-tabs {
      display: none;
    }
    .method-tools {
      display: flex;
      flex: 0 1 auto;
      gap: 4px;
      width: auto;
      max-width: min(220px, 48%);
      min-width: 0;
    }
    .method-tools .caption-switch {
      flex: 1 1 0;
      justify-content: center;
      min-width: 0;
      min-height: 40px;
      padding: 0 8px;
      background: #f1f5f9;
      font-size: 13px;
    }
    .method-tools .caption-switch .knob {
      width: 30px;
      height: 18px;
      flex: none;
    }
    .method-tools .caption-switch .knob::after {
      width: 14px;
      height: 14px;
    }
    .method-tools .caption-switch.on .knob::after { left: 14px; }
    .reveal-now {
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      background: #0f766e;
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 750;
      line-height: 22px;
      padding: 10px 22px;
      cursor: pointer;
    }
    .reveal-now[hidden] { display: none; }
    #reveal-btn:not([hidden]) { border-color: #99f6e4; background: #f0fdfa; color: #0f766e; }
    .caption-switch {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: transparent;
      color: #475569;
      border-radius: 12px;
      min-height: 40px;
      padding: 0 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .caption-switch .knob {
      width: 36px;
      height: 22px;
      border-radius: 999px;
      background: #cbd5e1;
      position: relative;
    }
    .caption-switch .knob::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      top: 2px;
      left: 2px;
    }
    .caption-switch.on { color: #0f766e; background: #fff; }
    .caption-switch.on .knob { background: #0f766e; }
    .caption-switch.on .knob::after { left: 16px; }
    .now.caption .now-who,
    .now.caption .gloss-row,
    .now.caption .read-fold,
    .now.caption .hear-line { display: none !important; }
    /* 纯字幕仍保留底部对话，方便点某一句跟读；舞台大字与列表并存 */
    .now.is-exam.folding .now-en {
      display: none !important;
    }
    .now.caption .now-body {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 10px 12px;
    }
    .now.caption .now-en {
      display: block !important;
      font-weight: 700;
    }
    .now.caption .now-zh {
      font-weight: 500;
      color: #64748b;
      font-size: 16px;
      line-height: 24px;
    }
    .method, .review-btn {
      border: 0;
      background: transparent;
      color: #475569;
      border-radius: 12px;
      min-height: 40px;
      padding: 0 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .method.active { background: #fff; color: #0f766e; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); }
    .stage {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .now {
      --speak-stage-h: var(--lx-focus-player-max-h, min(68dvh, 680px, calc(100dvh - 210px)));
      --stage-type-scale: 1;
      position: relative;
      flex: 0 0 auto;
      width: min(100%, var(--lx-focus-player-width, calc(var(--speak-stage-h) * 16 / 9)));
      max-width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      max-height: var(--speak-stage-h);
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 4px;
      margin: 0 auto;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: var(--lx-paper, #fff);
      color: var(--lx-ink-900);
      box-sizing: border-box;
    }
    .now-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 4px;
      width: 100%;
      min-height: 0;
      padding: 8px 10px;
      box-sizing: border-box;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      zoom: var(--stage-type-scale, 1);
    }
    @supports not (zoom: 1) {
      .now-body {
        transform: scale(var(--stage-type-scale, 1));
        transform-origin: top center;
      }
    }
    .stage-type-size {
      display: none;
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 4;
      align-items: center;
      gap: 0;
      padding: 2px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }
    body.has-stage-type-size .stage-type-size {
      display: inline-flex;
    }
    .stage-type-size button {
      width: 34px;
      height: 32px;
      margin: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #334155;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
    .stage-type-size button:hover {
      background: #f1f5f9;
      color: #0f766e;
    }
    .stage-type-size button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    /* 电脑版：中间字幕画幅固定，麦克风/上一句/重复播放不随内容高低跳动 */
    @media (min-width: 981px) {
      .card.stage {
        min-height: 0;
      }
      .card.stage > .scene-picker,
      .card.stage > .words,
      .card.stage > .method-hint,
      .card.stage > .dictation-coach,
      .card.stage > .mic-dock,
      .card.stage > .review,
      .card.stage > .transport,
      .card.stage > .audio-row {
        flex: 0 0 auto;
      }
      .now,
      .now.is-exam {
        flex: 1 1 0;
        width: 100%;
        max-width: 100%;
        aspect-ratio: auto;
        height: auto;
        min-height: 260px;
        max-height: none;
        margin: 0;
        overflow: hidden;
      }
      .now-body,
      .now.is-exam .now-body {
        flex: 1 1 auto;
        min-height: 0;
        max-height: none;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .mic-dock {
        margin-top: 6px;
        margin-bottom: 4px;
      }
    }
    .now-who { margin: 0; color: var(--lx-primary); font-size: 16px; font-weight: 800; }
    .now-en {
      margin: 0;
      max-width: 100%;
      color: var(--lx-ink-900);
      font-size: 36px;
      line-height: 48px;
      font-weight: 700;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .now-en[hidden] { display: none; }
    .now-en .covered { color: var(--lx-ink-400); font-size: 15px; font-weight: 700; }
    .now-zh {
      margin: 0 0 2px;
      max-width: 100%;
      color: var(--lx-ink-600, #475569);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 17px;
      line-height: 24px;
      font-weight: 500;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
      order: -1;
    }
    .now-body > .now-who { order: -2; }
    .now-zh[hidden] { display: none; }
    .now-zh.pending { color: var(--lx-ink-500); font-weight: 500; font-size: 15px; line-height: 22px; }
    .now-zh.prompt {
      color: var(--lx-ink-700, #334155);
      font-size: 18px;
      line-height: 26px;
      font-weight: 600;
    }
    .now-zh.is-secondary {
      color: var(--lx-primary);
      font-size: 15px;
      line-height: 22px;
      font-weight: 500;
      order: 2;
    }
    .choice-zh { display: block; margin-top: 2px; color: var(--lx-primary); font-size: 14px; font-weight: 700; line-height: 20px; }
    .choice-zh:empty { display: none; }
    .gloss-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 6px 8px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }
    .gloss-row[hidden] { display: none; }
    .gloss-chunk {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      max-width: 100%;
      min-width: 0;
      gap: 0;
      margin: 0;
    }
    .gloss-word {
      display: grid;
      grid-template-rows: 22px 18px auto 18px minmax(0, auto);
      justify-items: center;
      align-items: center;
      row-gap: 0;
      min-width: 0;
      max-width: 100%;
      width: max-content;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .gloss-role {
      min-height: 22px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
      line-height: 22px;
      white-space: nowrap;
      overflow: hidden;
    }
    .gloss-role:empty {
      background: transparent;
      padding: 0;
      min-height: 0;
      height: 0;
      overflow: hidden;
    }
    .gloss-role.role-subject { background: #dbeafe; color: #1d4ed8; }
    .gloss-role.role-predicate { background: #dcfce7; color: #15803d; }
    .gloss-role.role-object { background: #ffedd5; color: #c2410c; }
    .gloss-role.role-other { background: #f1f5f9; color: #64748b; }
    .gloss-ipa {
      min-height: 18px;
      height: 18px;
      padding: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--lx-ink-400);
      font-size: 13px;
      font-weight: 650;
      line-height: 18px;
      white-space: nowrap;
      overflow: hidden;
    }
    .gloss-ipa:empty { background: transparent; }
    .gloss-en {
      min-height: 0;
      padding: 2px 2px;
      background: var(--lx-line);
      color: var(--lx-ink-900);
      font-size: 32px;
      line-height: 42px;
      font-weight: 800;
      white-space: nowrap;
    }
    .gloss-word.start .gloss-en { border-radius: 10px 0 0 10px; }
    .gloss-word.end .gloss-en { border-radius: 0 10px 10px 0; }
    .gloss-word.mid .gloss-en { border-radius: 0; }
    .gloss-word.only .gloss-en { border-radius: 10px; }
    .gloss-chunk.c0 .gloss-en { background: var(--lx-soft-gold); }
    .gloss-chunk.c1 .gloss-en { background: var(--lx-soft-rose); }
    .gloss-chunk.c2 .gloss-en { background: var(--lx-soft-sky); }
    .gloss-chunk.c3 .gloss-en { background: var(--lx-soft-teal); }
    .gloss-word.current .gloss-en { box-shadow: inset 0 -2px 0 var(--lx-mint); }
    .gloss-word.done .gloss-en { box-shadow: inset 0 -2px 0 var(--lx-teal-300); }

    function refreshAccentFromMembership() {
      const next = savedAccent();
      if (next === accentId) return false;
      const previousTitle = scene() ? scene().title : '';
      accentId = next;
      if (packId !== 'core') {
        const target = pairTitle(previousTitle);
        const found = activeScenes().findIndex((item) => item.title === target);
        sceneIndex = found >= 0 ? found : Math.min(sceneIndex, Math.max(activeScenes().length - 1, 0));
        lineIndex = 0;
      }
      return true;
    }

    function sceneAccent(item) {
      if (!item || !item.title) return '';
      if (item.title.startsWith('美式')) return 'us';
      if (item.title.startsWith('英式')) return 'uk';
      return '';
    }

    function sceneName(item) {
      return String(item && item.title || '').replace(/^(美式|英式)/, '');
    }

    function matchesAccent(item) {
      const accent = sceneAccent(item);
      return !accent || accent === accentId;
    }

    function activeScenes() {
      if (packId === 'material' && materialScenes && materialScenes.length) return materialScenes;
      if (packId === 'core' && window.CORE_850) return window.CORE_850;
      if (packId === 'medical' && window.MEDICAL_VOCAB) return window.MEDICAL_VOCAB;
      if (packId === 'daylife' && window.DAY_LIFE) return window.DAY_LIFE;
      if (packId === 'travel' && window.TRAVEL_SPEAK) return window.TRAVEL_SPEAK;
      if (packId === 'kids' && window.KIDS_SPEAK) return window.KIDS_SPEAK;

      return SCENES.filter(matchesAccent);

    function pairTitle(title) {
      const bare = String(title || '').replace(/^(美式|英式)/, '');
      if (String(title || '').startsWith('美式') || String(title || '').startsWith('英式')) {
        return (accentId === 'uk' ? '英式' : '美式') + bare;

      return title;

      coach.querySelectorAll('[data-step]').forEach((el) => {

    function normalizePosKey(raw) {
      const key = String(raw || '').toLowerCase().trim();
      if (!key) return '';
      if (POS_ZH[key]) return key;
      if (key.startsWith('noun') || key === 'n') return 'noun';
      if (key.startsWith('verb') || key === 'v') return 'verb';
      if (key.startsWith('adj')) return 'adjective';
      if (key.startsWith('adv')) return 'adverb';
      if (key.startsWith('pron')) return 'pronoun';
      if (key.startsWith('det') || key.startsWith('art')) return 'determiner';
      if (key.startsWith('prep')) return 'preposition';
      if (key.startsWith('conj')) return 'conjunction';
      if (key.startsWith('inter')) return 'interjection';
      if (key.startsWith('part')) return 'particle';
      if (key.startsWith('mod')) return 'modal';
      if (key.startsWith('num')) return 'number';
      return '';
    }

      if (POS_ZH[key]) return POS_ZH[key];
      if (key.startsWith('noun') || key === 'n') return '名词';
      if (key.startsWith('verb') || key === 'v') return '动词';
      if (key.startsWith('adj')) return '形容词';
      if (key.startsWith('adv')) return '副词';
      if (key.startsWith('pron')) return '代词';
      if (key.startsWith('det') || key.startsWith('art')) return '限定词';
      if (key.startsWith('prep')) return '介词';
      if (key.startsWith('conj')) return '连词';
      if (key.startsWith('inter')) return '感叹词';
      if (key.startsWith('part')) return '助词';
      if (key.startsWith('mod')) return '情态';
      if (key.startsWith('num')) return '数词';
      return '';
    }

    function shortZh(text) {
      const raw = String(text || '').trim();
      if (!/[\u4e00-\u9fa5]/.test(raw)) return '';
      const piece = raw.split(/[，,。；;、/]/)[0].trim();
      return piece.length > 8 ? piece.slice(0, 8) : piece;
    }

    function rawPoses(key) {
      const cached = glossCache.get(key) || {};
      const local = glossLexicon[key] || {};
      return [...new Set([cached.posKey, ...(local.poses || []), local.pos, FALLBACK_POS[key]].filter(Boolean))];
    }

    function resolvePosKey(key, index, parts) {
      if (key === 'fine') return packId === 'core' ? 'noun' : 'adjective';
      if (FALLBACK_POS[key]) return FALLBACK_POS[key];
      const poses = rawPoses(key);
      const prev = index > 0 ? spokenLabel(parts[index - 1]).toLowerCase() : '';
      const next = index + 1 < parts.length ? spokenLabel(parts[index + 1]).toLowerCase() : '';
      if (key === 'to') return rawPoses(next).includes('verb') || AUX_WORD.has(next) ? 'particle' : 'preposition';
      if (WH_WORD.has(key)) return poses.includes('adverb') ? 'adverb' : (poses.includes('pronoun') ? 'pronoun' : (poses[0] || 'adverb'));
      if (prev === 'to' && poses.includes('verb')) return 'verb';
      if (key === 'thank' && next === 'you') return 'verb';
      if (['i', 'you', 'we', 'they', 'he', 'she'].includes(prev) && poses.includes('verb')) return 'verb';
      if (poses.includes('verb') && poses.includes('noun') && ['i', 'you', 'we', 'they', 'he', 'she', 'to'].includes(prev)) return 'verb';
      return poses[0] || '';
    }

    function glossZh(key, posKey, zh) {
      if (key === 'no' && posKey === 'determiner') return '没有';
      if (packId !== 'core' && key === 'fine') return '好';
      return zh;
    }

    function glossInfo(word, index, parts) {
      const key = spokenLabel(word).toLowerCase();
      const cached = glossCache.get(key) || {};
      const local = glossLexicon[key] || {};
      const posKey = parts ? resolvePosKey(key, index, parts) : (FALLBACK_POS[key] || cached.posKey || local.pos || '');
      return {
        ipa: String(cached.ipa || local.ipa || '').replace(/[\[\]]/g, ''),
        posKey,
        pos: posLabel(posKey),
        zh: glossZh(key, posKey, cached.zh || local.zh || '')
      };
    }

    function isVerbPos(pos, key) {
      return pos === 'verb' || pos === 'modal' || AUX_WORD.has(key);
    }

    function chunkIds(parts) {
      const ids = [];
      let id = 0;
      let infinitive = false;
      let prevPos = '';
      let prevKey = '';
      parts.forEach((word, index) => {
        const key = spokenLabel(word).toLowerCase();
        const pos = resolvePosKey(key, index, parts);
        if (index > 0) {
          const prevRaw = String(parts[index - 1] || '');
          const sentenceBreak = /[.!?…]["')\]]*$/.test(prevRaw);
          const phraseStart = (PHRASE_START.has(key) || WH_WORD.has(key)) && !(infinitive && key !== 'every' && key !== 'each' && !['in', 'on', 'at', 'for', 'with', 'from', 'after', 'before', 'about', 'into', 'over', 'under', 'without', 'during', 'through'].includes(key) && key !== 'to');
          const startsAdverbial = key === 'every' || key === 'each' || (PHRASE_START.has(key) && key !== 'to');
          if (infinitive && startsAdverbial) infinitive = false;
          if (sentenceBreak) {
            infinitive = false;
            id += 1;
          } else if (key === 'to' && (rawPoses(spokenLabel(parts[index + 1] || '').toLowerCase()).includes('verb') || AUX_WORD.has(spokenLabel(parts[index + 1] || '').toLowerCase()))) {
            infinitive = true;
            id += 1;
          } else if (startsAdverbial || WH_WORD.has(key) || pos === 'interjection' || prevPos === 'interjection') {
            id += 1;
          } else if (!infinitive && isVerbPos(pos, key) && !isVerbPos(prevPos, prevKey) && prevKey !== 'to' && prevKey !== 'not') {
            id += 1;
          } else if (!infinitive && isVerbPos(prevPos, prevKey) && !isVerbPos(pos, key) && key !== 'not' && pos !== 'adverb') {
            id += 1;
          } else if (prevPos === 'noun' && (pos === 'adjective' || pos === 'determiner' || pos === 'interjection')) {
            id += 1;
          } else if (phraseStart) {
            id += 1;
          }
        }
        ids.push(id);
        prevPos = pos;
        prevKey = key;
      });
      return ids;
    }

    function hideGlossPop() {
      const pop = document.getElementById('gloss-pop');
      if (pop) pop.hidden = true;
    }

    function roleName(index, parts, kind) {
      let verbBefore = false;
      let verbAfter = false;
      parts.forEach((word, i) => {
        const key = spokenLabel(word).toLowerCase();
        const pos = resolvePosKey(key, i, parts);
        if (!isVerbPos(pos, key)) return;
        if (i < index) verbBefore = true;
        if (i > index) verbAfter = true;
      });
      if (kind === 'pronoun' && verbAfter) return '主语';
      if (verbAfter && !verbBefore) return '主语';
      if (verbBefore && !verbAfter) return '宾语';
      return kind === 'pronoun' ? '主语' : '名词';
    }

    function roleFor(index, parts, info) {
      const display = spokenLabel(parts[index]);
      const pos = info.posKey;
      const zh = info.zh;
      const prev = index > 0 ? spokenLabel(parts[index - 1]).toLowerCase() : '';
      if (display.toLowerCase() === 'to' && pos === 'particle') {
        return { zh: '不定式标记', en: 'infinitive marker', body: '助词 to，作不定式标记，用来引出后面的动词。' };
      }
      if (pos === 'verb' || pos === 'modal') {
        const role = prev === 'to' ? '不定式' : '谓语';
        const en = prev === 'to' ? 'infinitive' : 'predicate';
        const label = pos === 'modal' ? '情态动词' : '动词';
        const body = zh
          ? `${label} ${display}，作${role}，表示「${zh}」这个动作。`
          : `${label} ${display}，作${role}。`;
        return { zh: role, en, body };
      }
      if (pos === 'noun' || pos === 'pronoun') {
        const role = roleName(index, parts, pos === 'pronoun' ? 'pronoun' : 'noun');
        const en = role === '主语' ? 'subject' : role === '宾语' ? 'object' : 'noun';
        const label = pos === 'pronoun' ? '代词' : '名词';
        const body = zh ? `${label} ${display}，作${role}，表示「${zh}」。` : `${label} ${display}，作${role}。`;
        return { zh: role, en, body };
      }
      const table = {
        adjective: ['定语', 'attribute', '形容词', '作定语'],
        adverb: ['状语', 'adverbial', '副词', '作状语'],
        determiner: ['限定', 'determiner', '限定词', '用来限定后面的词'],
        preposition: ['介词', 'preposition', '介词', '用来带出后面的名词'],
        conjunction: ['连词', 'conjunction', '连词', '用来连接前后的内容'],
        interjection: ['感叹', 'interjection', '感叹词', '用来打招呼或表达情绪'],
        particle: ['助词', 'particle', '助词', ''],
        number: ['数词', 'number', '数词', '']
      };
      const item = table[pos];
      if (!item) return { zh: '词', en: 'word', body: zh ? `${display}，表示「${zh}」。` : display };
      const body = zh
        ? `${item[2]} ${display}，${item[3]}${item[3] ? '，' : ''}表示「${zh}」。`.replace('，，', '，')
        : `${item[2]} ${display}${item[3] ? `，${item[3]}` : ''}。`;
      return { zh: item[0], en: item[1], body };
    }

    function showGlossPop(index, anchor) {
      const pop = document.getElementById('gloss-pop');
      const info = glossInfo(glossParts[index], index, glossParts);
      const role = roleFor(index, glossParts, info);
      pop.innerHTML = `<p class="gloss-pop-role"><i></i>${escapeHtml(role.zh)} <em>${escapeHtml(role.en)}</em></p><p>${escapeHtml(role.body)}</p>`;
      pop.hidden = false;
      const rect = anchor.getBoundingClientRect();
      const width = pop.offsetWidth || 260;
      const height = pop.offsetHeight || 72;
      const left = Math.min(window.innerWidth - width - 8, Math.max(8, rect.left + rect.width / 2 - width / 2));
      const top = Math.min(window.innerHeight - height - 8, rect.bottom + 8);
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
    }

    function paintGloss(parts, shown) {
      const row = document.getElementById('gloss-row');
      const sentence = document.getElementById('now-en');
      hideGlossPop();
      if (!shown || !parts.length) {
        row.hidden = true;
        row.innerHTML = '';
        row.classList.remove('is-hearing');
        glossParts = [];
        sentence.hidden = false;
        paintLineTips([], false);
        return;
      }
      sentence.hidden = true;
      row.hidden = false;
      glossParts = parts;
      const chunks = chunkIds(parts);
      const splitting = splitActive();
      row.classList.toggle('is-hearing', splitting);
      let html = '';
      parts.forEach((word, index) => {
        const id = chunks[index];
        const prev = index > 0 ? chunks[index - 1] : -1;
        const next = index + 1 < parts.length ? chunks[index + 1] : -1;
        if (id !== prev) html += `<span class="gloss-chunk c${id % 4}">`;
        const info = glossInfo(word, index, parts);
        const state = splitting ? slotClass(index) : '';
        const edge = id !== prev && id !== next ? ' only' : id !== prev ? ' start' : id !== next ? ' end' : ' mid';
        const slotShown = splitting
          ? (splitState.slots[index] || '')
          : '';
        const slot = splitting
          ? `<span class="hear-slot ${state}" data-slot="${index}">${escapeHtml(slotShown)}</span>`
          : '';
        const maskWrite = isDictation() && dictationStep === 2;
        const filled = splitting && splitState.done && splitState.done[index];
        const label = maskWrite && !filled
          ? '—'.repeat(Math.max(2, Math.min(8, spokenLabel(word).length || 2)))
          : spokenLabel(word);
        const ipa = maskWrite ? '' : info.ipa;
        const role = maskWrite ? null : roleFor(index, parts, info);
        const roleZh = role ? role.zh : '';
        const roleClass = roleZh === '主语'
          ? 'role-subject'
          : (roleZh === '谓语' || roleZh === '不定式'
            ? 'role-predicate'
            : (roleZh === '宾语' ? 'role-object' : (roleZh ? 'role-other' : '')));
        // 「翻译」关掉时，不显示词下中文释义
        const zh = (maskWrite || !translateOn) ? '' : info.zh;
        // 每个成分块只在开头标一次主谓宾，避免一词一标签太碎
        const showRole = !maskWrite && id !== prev && roleZh;
        html += `<button class="gloss-word${edge} ${state}${maskWrite && !filled ? ' is-masked' : ''}" type="button" data-gloss="${index}"${maskWrite && !filled ? ' aria-label="听写空格"' : ''}><span class="gloss-role ${showRole ? roleClass : ''}">${showRole ? escapeHtml(roleZh) : ''}</span><span class="gloss-ipa">${escapeHtml(ipa)}</span><span class="gloss-en">${escapeHtml(label)}</span><span class="gloss-zh">${escapeHtml(zh)}</span>${slot}</button>`;
        if (id !== next) html += '</span>';
      });
      row.innerHTML = html;
      paintLineTips(parts, shown);
      fitSubtitle();
      if (splitting) paintHearLine();
    }

    function paintLineTips(parts, shown) {
      const host = document.getElementById('line-tips');
      if (!host) return;
      if (!shown || !parts || !parts.length || captionOn) {
        host.hidden = true;
        host.innerHTML = '';
        return;
      }
      const roles = parts.map((word, index) => roleFor(index, parts, glossInfo(word, index, parts)).zh);
      const tips = [];
      if (roles.includes('主语') && roles.includes('谓语') && roles.includes('宾语')) {
        tips.push('主谓宾结构');
      } else if (roles.includes('主语') && roles.includes('谓语')) {
        tips.push('主谓结构');
      }
      if (roles.includes('谓语')) tips.push('先抓住谓语再说整句');
      if (roles.includes('感叹')) tips.push('口语开场常用感叹');
      const unique = [];
      tips.forEach((tip) => {
        if (tip && !unique.includes(tip)) unique.push(tip);
      });
      if (!unique.length) {
        host.hidden = true;
        host.innerHTML = '';
        return;
      }
      host.innerHTML = unique.slice(0, 3).map((tip) => `<span class="line-tip">${escapeHtml(tip)}</span>`).join('');
      host.hidden = false;
    }

    function isIpadLike() {
      const ua = navigator.userAgent || '';
      if (/iPad/i.test(ua)) return true;
      try {
        if (navigator.platform === 'MacIntel' && Number(navigator.maxTouchPoints || 0) > 1) return true;
      } catch (_) {}
      return false;
    }

    function stageTypeSizeEnabled() {
      try {
        if (window.matchMedia && window.matchMedia('(min-width: 981px)').matches) return true;
      } catch (_) {}
      return isIpadLike();
    }

    function clearInlineStageFonts() {
      const row = document.getElementById('gloss-row');
      if (row) {
        row.querySelectorAll('.gloss-en').forEach((el) => {
          el.style.fontSize = '';
          el.style.lineHeight = '';
          el.style.padding = '';
        });
      }
      const en = document.getElementById('now-en');
      const zh = document.getElementById('now-zh');
      if (en) {
        en.style.fontSize = '';
        en.style.lineHeight = '';
      }
      if (zh) {
        zh.style.fontSize = '';
        zh.style.lineHeight = '';
      }
    }

    function syncStageTypeSizeUi() {
      const enabled = stageTypeSizeEnabled();
      document.body.classList.toggle('has-stage-type-size', enabled);
      const host = document.getElementById('stage-type-size');
      if (host) host.hidden = !enabled;
      const now = document.getElementById('now');
      if (now) now.style.setProperty('--stage-type-scale', String(stageTypeScale));
      if (host) {
        const down = host.querySelector('[data-stage-type="-1"]');
        const up = host.querySelector('[data-stage-type="1"]');
        if (down) down.disabled = stageTypeScale <= STAGE_TYPE_SCALE_MIN + 0.001;
        if (up) up.disabled = stageTypeScale >= STAGE_TYPE_SCALE_MAX - 0.001;
      }
    }

    function saveStageTypeScale() {
      try { localStorage.setItem(STAGE_TYPE_SCALE_KEY, String(stageTypeScale)); } catch (_) {}
    }

    function nudgeStageTypeScale(delta) {
      if (!stageTypeSizeEnabled()) return;
      const next = Math.round((stageTypeScale + delta * STAGE_TYPE_SCALE_STEP) * 10) / 10;
      stageTypeScale = Math.min(STAGE_TYPE_SCALE_MAX, Math.max(STAGE_TYPE_SCALE_MIN, next));
      saveStageTypeScale();
      syncStageTypeSizeUi();
      clearInlineStageFonts();
      fitSubtitle();
    }

    function fitSubtitle() {
      const now = document.getElementById('now');
      if (!now) return;
      // 题目+选项场景不压字号，避免题目比选项还小、内容被 16:9 裁切
      if (now.classList.contains('is-exam')) return;
      // 电脑 / iPad：字号由用户 ± 固定，换词不自动变大变小
      if (stageTypeSizeEnabled()) {
        clearInlineStageFonts();
        now.style.setProperty('--stage-type-scale', String(stageTypeScale));
        return;
      }
      const row = document.getElementById('gloss-row');
      const words = row && !row.hidden ? row.querySelectorAll('.gloss-en') : null;
      if (words && words.length) {
        const narrow = now.clientWidth < 560;
        const count = words.length;
        let size = narrow
          ? (count <= 4 ? 22 : count <= 8 ? 20 : 17)
          : 28;
        const apply = (px) => {
          words.forEach((el) => {
            el.style.fontSize = px + 'px';
            el.style.lineHeight = Math.round(px * 1.2) + 'px';
            el.style.padding = '1px ' + (px >= 24 ? 3 : 2) + 'px';
          });
        };
        apply(size);
        let guard = 0;
        const wrapped = () => {
          const chip = words[0].closest('.gloss-word');
          if (!chip) return false;
          return row.getBoundingClientRect().height > chip.getBoundingClientRect().height + 8;
        };
        while (narrow && guard < 6 && size > 18 && wrapped()) {
          size -= 1;
          apply(size);
          guard += 1;
        }
        while (guard < 14 && size > 15 && now.scrollHeight > now.clientHeight + 1) {
          size -= 1;
          apply(size);
          guard += 1;
        }
        return;
      }
      if (!captionOn) return;
      const en = document.getElementById('now-en');
      if (!en || en.hidden) return;
      let size = parseFloat(en.style.fontSize) || 28;
      let guard = 0;
      while (guard < 10 && size > 16 && now.scrollHeight > now.clientHeight + 1) {
        size -= 2;
        en.style.fontSize = size + 'px';
        en.style.lineHeight = Math.round(size * 1.35) + 'px';
        const zh = document.getElementById('now-zh');
        if (zh && zh.textContent) {
          const zhSize = Math.max(15, Math.round(size * 0.62));
          zh.style.fontSize = zhSize + 'px';
          zh.style.lineHeight = Math.round(zhSize * 1.4) + 'px';
        }
        guard += 1;
      }
    }

    function ensureGloss(parts) {
      const mark = lineKey(lineIndex) + '\n' + parts.join(' ');
      if (glossLine === mark) return;
      glossLine = mark;
      const token = ++glossToken;
      const keys = [...new Set(parts.map((word) => spokenLabel(word).toLowerCase()).filter((key) => /^[a-z][a-z'-]{0,30}$/.test(key)))];
      const pending = keys.filter((key) => !glossCache.has(key));
      if (!pending.length) return;
      fetch('/dictionary/gloss?words=' + encodeURIComponent(pending.join(',')))
        .then((response) => response.ok ? response.json() : { items: [] })
        .then((data) => {
          if (token !== glossToken) return;
          const found = new Map((data.items || []).map((item) => [item.word, item]));
          pending.forEach((key) => {
            const item = found.get(key);
            glossCache.set(key, {
              ipa: item?.phonetic || '',
              posKey: normalizePosKey(item?.pos || ''),
              zh: shortZh(item?.zh || '')
            });
          });
          if (englishShown(lineIndex)) paintGloss(sentenceWords(current()[1]), true);
        })
        .catch(() => {});
    }

    function normalizeSpoken(text) {
      return String(text || '')
        .toLowerCase()
        .replace(/['’]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    const SPEECH_ALIASES = {
      hi: ['high', 'hey', 'hai', 'he', 'hii', 'ha', 'hy'],
      hello: ['hallo', 'helo', 'hellow'],
      ben: ['been', 'ban', 'bent', 'bin', 'pen', 'ven', 'then', 'bend'],
      amy: ['ami', 'aimi', 'emmy', 'amie'],
      how: ['hao', 'hows'],
      you: ['u', 'ya', 'yew', 'yo'],
      your: ['youre', 'ur'],
      are: ['r', 'ah'],
      to: ['two', 'too'],
      for: ['four', 'fore'],
      see: ['sea', 'c', 'si', 'ze', 'cee', 'she'],
      no: ['know', 'now', 'nah', 'noe', 'oh'],
      long: ['lung', 'lawn', 'lang', 'along', 'lone'],
      time: ['thyme', 'times', 'tine', 'dime', 'tim'],
      good: ['god', 'gut'],
      bye: ['by', 'buy'],
      okay: ['ok', 'o.k', 'kay'],
      ok: ['okay', 'kay'],
      pretty: ['pritty', 'priddy'],
      whats: ['whats', 'watt', 'wat'],
      up: ['opp'],
      been: ['ben', 'bin'],
      thank: ['thanks', 'thx'],
      thanks: ['thank', 'thx'],
    };

    function isMobileSpeaking() {
      try {
        if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return true;
      } catch (_) {}
      return window.innerWidth <= 980
        || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
    }

    function isWeChatBrowser() {
      return /MicroMessenger/i.test(navigator.userAgent || '');
    }

    function canUseLiveSpeech() {
      // 微信 / 手机 WebView 实时识别极不稳定，统一走录音 + 服务端识别填空
      if (isWeChatBrowser() || isMobileSpeaking()) return false;
      return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
    }

    function shouldUseRecordAsr() {
      return isWeChatBrowser() || isMobileSpeaking() || !canUseLiveSpeech();
    }

    function updateMicEnvTip() {
      // 提示行已取消，保留空函数以免旧调用报错
    }

    function stopPlaybackOnly() {
      playToken += 1;
      stopSpeech();
      busy = false;
      clearPlayingLine();
      setSpeakButtons(false);
      syncPlayLabel();
    }

    function speechAliasHit(wanted, said) {
      const list = SPEECH_ALIASES[wanted];
      if (list && list.includes(said)) return true;
      if (wanted === 'im' && (said === 'i' || said === 'am')) return true;
      if (wanted === 'youre' && (said === 'your' || said === 'you')) return true;
      return Object.keys(SPEECH_ALIASES).some((key) => (
        key === said && SPEECH_ALIASES[key].includes(wanted)
      ));
    }

    function spokenDistance(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const matrix = Array.from({ length: a.length + 1 }, () => []);
      for (let i = 0; i <= a.length; i += 1) matrix[i][0] = i;
      for (let j = 0; j <= b.length; j += 1) matrix[0][j] = j;
      for (let i = 1; i <= a.length; i += 1) {
        for (let j = 1; j <= b.length; j += 1) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(matrix[i - 1][j] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j - 1] + cost);
        }
      }
      return matrix[a.length][b.length];
    }

    function splitActive() {
      return Boolean(splitState && splitState.key === lineKey(lineIndex) && splitState.targets);
    }

    function slotClass(index) {
      if (!splitActive() || !splitState.done) return '';
      if (splitState.done[index]) return 'done';
      if (splitState.queue[0] === index) return 'current';
      const next = splitState.done.findIndex((flag) => !flag);
      return index === next ? 'current' : '';
    }

    function paintHearLine() {
      const line = document.getElementById('hear-line');
      const slots = document.getElementById('hear-slots');
      if (!line) return;
      if (!splitActive()) {
        line.hidden = true;
        line.classList.remove('live', 'integrated');
        if (slots) slots.innerHTML = '';
        const glossRow = document.getElementById('gloss-row');
        if (glossRow) glossRow.classList.remove('is-hearing');
        document.querySelectorAll('#gloss-row .hear-slot').forEach((el) => el.remove());
        return;
      }
      // 输入格嵌在每个单词字幕下方，保证同行换行对齐
      line.hidden = false;
      line.classList.add('integrated');
      line.classList.toggle('live', Boolean(splitListen) || splitState.queue.length > 0);
      if (slots) slots.innerHTML = '';
      const glossRow = document.getElementById('gloss-row');
      const glossSlots = glossRow ? glossRow.querySelectorAll('[data-slot]') : [];
      if (!glossSlots.length || glossSlots.length !== splitState.targets.length) {
        paintGloss(splitState.targets, true);
      }
      const draft = splitState.draft || '';
      const open = splitState.done.findIndex((flag, index) => !flag && !splitState.queue.includes(index) && !splitState.slots[index]);
      if (glossRow) glossRow.classList.add('is-hearing');
      splitState.targets.forEach((word, index) => {
        let slot = document.querySelector(`#gloss-row [data-slot="${index}"]`);
        if (!slot) {
          const host = document.querySelector(`#gloss-row [data-gloss="${index}"]`);
          if (!host) return;
          slot = document.createElement('span');
          slot.dataset.slot = String(index);
          host.appendChild(slot);
        }
        const shown = splitState.slots[index] || (index === open ? draft : '');
        slot.textContent = shown;
        slot.className = `hear-slot ${slotClass(index)}`;
        slot.title = spokenLabel(word);
      });
    }

    function wordMatches(target, heard, fuzzy) {
      const wanted = normalizeSpoken(spokenLabel(target));
      const said = normalizeSpoken(heard);
      if (!wanted || !said) return false;
      if (said === wanted) return true;
      if (speechAliasHit(wanted, said)) return true;
      // 前缀重合：正在说的半词 / ASR 少截断
      const overlap = Math.min(wanted.length, said.length);
      if (overlap >= 3 && (wanted.startsWith(said) || said.startsWith(wanted))) return true;
      if (!fuzzy) return false;
      // 短词 ASR 常多识别 1–2 个字母（hi→high），放宽一点
      const limit = wanted.length <= 3
        ? 2
        : Math.min(2, Math.max(1, Math.floor(wanted.length / 3)));
      const lengthSlack = wanted.length <= 3 ? 3 : Math.max(2, limit + 1);
      if (Math.abs(wanted.length - said.length) > lengthSlack) return false;
      return spokenDistance(wanted, said) <= Math.max(limit, wanted.length <= 3 ? 2 : limit);
    }

    function stopTyper() {
      if (splitTyper) clearInterval(splitTyper);
      splitTyper = null;
    }

    function finishTypedLine() {
      if (!splitState || splitState.done.some((flag) => !flag)) return;
      revealed.add(splitState.key);
      stopTyper();
      stopSplitListen();
      splitState = null;
      const input = document.getElementById('hear-input');
      if (input) input.value = '';
      hearSeen = '';
      if (isDictation() && dictationStep <= 2) {
        dictationStep = 3;
        dictationHeard = true;
      }
      render();
      setStatus(isDictation()
        ? '这句对上了。点彩色词块，把词义和成分问清。'
        : '这句对上了。点彩色词块，可以看成分。');
    }

    function confirmHearLine() {
      if (!splitActive() || !splitListen) return false;
      applyHearText(true);
      if (splitState && splitState.done.every(Boolean)) {
        finishTypedLine();
        return true;
      }
      const left = splitState ? splitState.done.filter((flag) => !flag).length : 0;
      setStatus(left ? `还有 ${left} 个词没对上。词之间空格，打完按回车确认。` : '打完这句后按回车确认。');
      return false;
    }

    function pumpType() {
      if (splitTyper || !splitState) return;
      splitTyper = setInterval(() => {
        if (!splitState || !splitState.queue.length) {
          stopTyper();
          finishTypedLine();
          return;
        }
        const index = splitState.queue[0];
        const target = splitState.targets[index] || '';
        const shown = splitState.slots[index] || '';
        if (shown.length >= target.length) {
          splitState.done[index] = true;
          splitState.queue.shift();
          paintHearLine();
          if (!captionOn && englishShown(lineIndex)) paintGloss(splitState.targets, true);
          if (!splitState.queue.length) finishTypedLine();
          return;
        }
        splitState.slots[index] = target.slice(0, shown.length + 1);
        paintHearLine();
      }, 42);
    }

    function queueType(indexes) {
      if (!splitState) return;
      // 麦克风路径：像微信语音输入一样，认出一个有效词就整词填入
      if (hearFromMic) {
        indexes.forEach((index) => {
          if (splitState.done[index]) return;
          splitState.slots[index] = splitState.targets[index] || '';
          splitState.done[index] = true;
          splitState.queue = splitState.queue.filter((item) => item !== index);
        });
        if (indexes.length) {
          paintHearLine();
          if (!captionOn && englishShown(lineIndex)) paintGloss(splitState.targets, true);
        }
        if (splitState.targets.length && splitState.done.every(Boolean)) finishTypedLine();
        return;
      }
      indexes.forEach((index) => {
        if (splitState.done[index] || splitState.queue.includes(index)) return;
        splitState.queue.push(index);
      });
      if (indexes.length) {
        paintHearLine();
        if (!captionOn && englishShown(lineIndex)) paintGloss(splitState.targets, true);
      }
      pumpType();
    }

    function stopHearWatch() {
      if (hearWatch) clearInterval(hearWatch);
      hearWatch = null;
    }

    function startHearWatch() {
      stopHearWatch();
      const input = document.getElementById('hear-input');
      hearSeen = input ? input.value : '';
      hearWatch = setInterval(() => {
        if (!splitListen) {
          stopHearWatch();
          return;
        }
        const field = document.getElementById('hear-input');
        if (!field || field.value === hearSeen) return;
        hearSeen = field.value;
        applyHearText();
      }, 200);
    }

    function stopComputerMic() {
      const recognition = hearRecognition;
      hearRecognition = null;
      if (!recognition) return;
      recognition.onresult = null;
      recognition.onerror = null;
      recognition.onend = null;
      try { recognition.stop(); } catch (_) {}
    }

    function stopSplitListen() {
      splitListen = null;
      stopHearWatch();
      stopComputerMic();
      if (!hearRecordBusy) stopHearRecorder(true);
      const input = document.getElementById('hear-input');
      if (input) {
        input.readOnly = false;
        if (document.activeElement === input) input.blur();
      }
    }

    function focusHearInput() {
      const input = document.getElementById('hear-input');
      if (!input || input.disabled) return;
      input.focus({ preventScroll: true });
      const end = input.value.length;
      try { input.setSelectionRange(end, end); } catch (_) {}
    }

    function expandSpeechTokens(tokens) {
      // 把 ASR 常见拆分合并回缩写：I am → I'm，do not → don't
      const out = [];
      for (let i = 0; i < tokens.length; i += 1) {
        const a = normalizeSpoken(tokens[i]);
        const b = normalizeSpoken(tokens[i + 1] || '');
        if (a === 'i' && b === 'am') { out.push("i'm"); i += 1; continue; }
        if (a === 'you' && b === 'are') { out.push("you're"); i += 1; continue; }
        if (a === 'we' && b === 'are') { out.push("we're"); i += 1; continue; }
        if (a === 'they' && b === 'are') { out.push("they're"); i += 1; continue; }
        if (a === 'do' && b === 'not') { out.push("don't"); i += 1; continue; }
        if (a === 'does' && b === 'not') { out.push("doesn't"); i += 1; continue; }
        if (a === 'did' && b === 'not') { out.push("didn't"); i += 1; continue; }
        if (a === 'is' && b === 'not') { out.push("isn't"); i += 1; continue; }
        if (a === 'are' && b === 'not') { out.push("aren't"); i += 1; continue; }
        if (a === 'can' && b === 'not') { out.push('cannot'); i += 1; continue; }
        if (a === 'thank' && b === 'you') { out.push('thank'); out.push('you'); i += 1; continue; }
        out.push(tokens[i]);
      }
      return out;
    }

    function syncHearLine(value) {
      if (!splitState) return;
      const raw = String(value || '');
      const tokens = expandSpeechTokens(raw.trim() ? raw.trim().split(/\s+/) : []);
      const tailOpen = Boolean(tokens.length) && !/\s$/.test(raw);
      const parts = splitState.targets;
      const used = new Set();
      let cursor = 0;
      let tailConsumed = false;
      tokens.forEach((token, tokenIndex) => {
        const openTail = tailOpen && tokenIndex === tokens.length - 1;
        let found = -1;
        const matchesAt = (index) => !used.has(index) && wordMatches(parts[index], token, !openTail);
        // 优先对齐「下一个未填词」，减少乱序误吃后面的词
        if (matchesAt(cursor)) {
          found = cursor;
        } else {
          for (let index = cursor + 1; index < Math.min(parts.length, cursor + 3); index += 1) {
            if (matchesAt(index)) { found = index; break; }
          }
        }
        if (found < 0 && !openTail) {
          for (let index = cursor; index < parts.length; index += 1) {
            if (matchesAt(index)) { found = index; break; }
          }
        }
        if (found < 0 && !openTail) {
          for (let index = 0; index < cursor; index += 1) {
            if (matchesAt(index)) { found = index; break; }
          }
        }
        if (found < 0) return;
        used.add(found);
        if (openTail) tailConsumed = true;
        while (cursor < parts.length && used.has(cursor)) cursor += 1;
      });
      splitState.done.forEach((flag, index) => {
        if (used.has(index)) return;
        splitState.done[index] = false;
        splitState.slots[index] = '';
      });
      splitState.queue = splitState.queue.filter((index) => used.has(index));
      used.forEach((index) => {
        if (splitState.done[index]) splitState.slots[index] = parts[index];
      });
      splitState.draft = tailOpen && !tailConsumed ? tokens[tokens.length - 1] : '';
      const fresh = [];
      used.forEach((index) => {
        if (!splitState.done[index] && !splitState.queue.includes(index)) fresh.push(index);
      });
      if (!splitState.queue.length) stopTyper();
      if (fresh.length) {
        queueType(fresh);
        return;
      }
      paintHearLine();
      if (!captionOn && englishShown(lineIndex)) paintGloss(parts, true);
      if (parts.length && splitState.done.every(Boolean)) finishTypedLine();
    }

    function applyHearText(fromUser) {
      if (!splitActive() || !splitListen) return;
      const input = document.getElementById('hear-input');
      const value = input ? input.value : '';
      if (fromUser) {
        hearFromMic = false;
        hearTypedAt = Date.now();
      }
      hearSeen = value;
      // 打字时也并入已识别词，避免把语音刚填上的词清掉
      const merged = fromUser ? (mergeHearTranscript(value) || value) : value;
      if (fromUser && merged && merged !== normalizeSpoken(value) && input) {
        const typing = document.activeElement === input;
        if (!typing) input.value = merged;
      }
      syncHearLine(merged || value);
      if (value.trim() && /[\u4e00-\u9fff]/.test(value) && !filledCount() && !splitState.draft) {
        setStatus('识别成了中文。请说英文，再说一次。');
      } else if (fromUser && filledCount()) {
        const left = splitState.done.filter((flag) => !flag).length;
        if (left) setStatus(`已对上 ${filledCount()} 个词，还差 ${left} 个。可继续打字或说话。`);
      }
    }

    function voiceFor() {
      return window.LinglishTtsVoice ? LinglishTtsVoice.current() : 'en-US-AvaMultilingualNeural';
    }

    function setStatus(text) {
      const node = document.getElementById('status');
      if (!node) return;
      node.textContent = text || '';
    }

    function syncDialogueActive() {
      const list = document.getElementById('dialogue');
      const active = list && list.querySelector('.turn.active');
      if (!list || !active) return;
      // 只在对话列表内部滚动，避免带动整页跳到播放区
      try {
        const listRect = list.getBoundingClientRect();
        const activeRect = active.getBoundingClientRect();
        const nextTop = list.scrollTop + (activeRect.top - listRect.top)
          - (list.clientHeight / 2 - active.clientHeight / 2);
        list.scrollTop = Math.max(0, nextTop);
      } catch (_) {}
    }

    function showPractice() {
      const target = document.getElementById('now') || document.querySelector('.card.stage');
      if (!target) return;
      syncDialogueActive();
      try {
        const nav = document.querySelector('.nav');
        const topPad = Math.max(8, (nav ? nav.getBoundingClientRect().bottom : 0) + 6);
        const rect = target.getBoundingClientRect();
        // 切题后始终把字幕/题目窗留在视口上半区，不要跟着「下一句」滚到播放条
        if (rect.top < topPad || rect.top > window.innerHeight * 0.42 || rect.bottom > window.innerHeight - 24) {
          const y = (window.pageYOffset || document.documentElement.scrollTop || 0) + rect.top - topPad;
          window.scrollTo({ top: Math.max(0, y), behavior: 'auto' });
        }
      } catch (_) {
        try { target.scrollIntoView({ block: 'start', behavior: 'auto' }); } catch (__) {}
      }
    }

    function firstSentence(text) {
      const raw = String(text || '').replace(/\s+/g, ' ').trim();
      const zh = raw.match(/^[\s\S]{8,140}?[。！？]/);
      // 先屏蔽缩写点，避免摘要截成「What is Mrs.」
      const masked = raw.replace(/\b(Mr|Mrs|Ms|Miss|Dr|Prof|Jr|Sr|St|vs|etc)\./gi, '$1\u2024');
      const en = masked.match(/^[\s\S]{8,160}?(?<![A-Z])[.!?](?=\s+[A-Z"“‘]|$)/);
      const match = zh && (!en || zh[0].length <= en[0].length) ? zh : en;
      if (match) return match[0].replace(/\u2024/g, '.').trim();
      return raw.length > 72 ? `${raw.slice(0, 72)}…` : raw;
    }

    function renderMaterialIndex() {
      return activeScenes().map((item, index) => {
        let group = '';
        const jumps = item.turns.map((turn, line) => {
          const mark = turn.group && turn.group !== group ? `<p class="q-group">${escapeHtml(turn.group)}</p>` : '';
          if (turn.group) group = turn.group;
          const active = index === sceneIndex && line === lineIndex ? ' active' : '';
          return `${mark}<button class="q-jump${active}" type="button" data-scene="${index}" data-line="${line}">${escapeHtml(turn[0])}</button>`;
        }).join('');
        return `<div class="chapter"><button class="line${index === sceneIndex ? ' active' : ''}" type="button" data-scene="${index}"><strong>${escapeHtml(sceneName(item))}</strong><span>${item.turns.length} 项</span></button><div class="q-list">${jumps}</div></div>`;
      }).join('');
    }

    function translationKey(text) {
      return String(text || '').replace(/\s+/g, ' ').trim();
    }

    function cachedTranslation(text) {
      const key = translationKey(text);
      return key ? (sentenceTranslations.get(key) || '') : '';
    }

    function authoredTranslation(turn) {
      return translationKey(turn && turn[2]);
    }

    function sentenceSource(turn) {
      if (!turn || authoredTranslation(turn)) return '';
      return translationKey(turn.stem || turn.body || turn[1]);
    }

    function canRequestTranslation(text) {
      const key = translationKey(text);
      if (!key || key.length > 1200) return false;
      if (!/[A-Za-z]/.test(key)) return false;
      if (/[\u4e00-\u9fff]/.test(key) && !/[A-Za-z]{3,}/.test(key)) return false;
      if (sentenceTranslations.has(key) || translateFailed.has(key)) return false;
      return true;
    }

    function translationPieces(focus) {
      if (!translateOn || !focus) return [];
      const list = [];
      const sentence = sentenceSource(focus);
      if (canRequestTranslation(sentence)) list.push(sentence);
      (focus.options || []).forEach((item) => {
        if (canRequestTranslation(item)) list.push(translationKey(item));
      });
      const answer = translationKey(focus.answer);
      if (answer && !/^[A-Ea-e]$/.test(answer) && canRequestTranslation(answer)) list.push(answer);
      return [...new Set(list)];
    }

    function sentenceTranslation(turn) {
      if (!translateOn || !turn) return '';
      return authoredTranslation(turn) || cachedTranslation(turn.stem || turn.body || turn[1]);
    }

    function optionTranslation(text) {
      return translateOn ? cachedTranslation(text) : '';
    }

    function translatedMarkup(text) {
      const zh = optionTranslation(text);
      return `${escapeHtml(text)}${zh ? `<span class="choice-zh">${escapeHtml(zh)}</span>` : ''}`;
    }

    function answerTranslation(focus) {
      if (!translateOn || !focus) return '';
      const answer = translationKey(focus.answer);
      const letter = answer.match(/^([A-E])$/i);
      if (letter && Array.isArray(focus.options)) {
        const option = focus.options[letter[1].toUpperCase().charCodeAt(0) - 65];
        return option ? cachedTranslation(option) : '';
      }
      return cachedTranslation(answer);
    }

    function optionPlain(text) {
      return String(text || '').replace(/^[A-E][.、．]\s*/i, '').replace(/[.。]\s*$/, '').trim();
    }

    function correctPick(focus) {
      const answer = String(focus && focus.answer || '').trim();
      const letter = answer.match(/^([A-E])\b/i);
      if (!letter || !Array.isArray(focus.options)) return null;
      const index = letter[1].toUpperCase().charCodeAt(0) - 65;
      const text = focus.options[index];
      if (!text) return null;
      return { letter: letter[1].toUpperCase(), index, text, plain: optionPlain(text) };
    }

    function paperReason(focus) {
      const answer = String(focus && focus.answer || '').trim();
      const match = answer.match(/^[A-E][.、．\s]+(.+)$/i);
      if (!match) return '';
      const rest = match[1].trim();
      if (!rest || /^[A-E]$/i.test(rest)) return '';
      return rest;
    }

    function clipText(text, max) {
      const value = String(text || '').replace(/\s+/g, ' ').trim();
      if ([...value].length <= max) return value;
      return [...value].slice(0, max - 1).join('').trim() + '…';
    }

    const REASON_STOP = new Set(['the', 'a', 'an', 'of', 'and', 'or', 'to', 'in', 'on', 'for', 'is', 'are', 'was', 'were', 'this', 'that', 'with', 'from', 'about', 'what', 'which', 'who', 'when', 'where', 'why', 'how', 'does', 'do', 'did', 'his', 'her', 'their', 'your', 'you', 'she', 'he', 'they', 'it']);

    function supportingSentence(optionText) {
      const words = optionPlain(optionText).toLowerCase().match(/[a-z][a-z']{3,}/g) || [];
      const keys = words.filter((word) => !REASON_STOP.has(word));
      if (!keys.length) return '';
      const turns = packId === 'material' && materialScenes
        ? materialScenes.flatMap((item) => item.turns || [])
        : ((scene() && scene().turns) || []);
      let fallback = '';
      for (const turn of turns) {
        if (!turn || turn.kind === 'question' || turn.kind === 'answer') continue;
        const body = String(turn.body || turn[1] || '');
        if (!/[A-Za-z]{4,}/.test(body)) continue;
        const sentences = body.split(/(?<=[.!?。！？])\s+/);
        for (const sentence of sentences) {
          const lower = sentence.toLowerCase();
          const hit = keys.filter((word) => lower.includes(word));
          if (!hit.length) continue;
          const line = sentence.trim();
          if (hit.length === keys.length || hit.some((word) => word.length >= 5)) return line;
          if (!fallback) fallback = line;
        }
      }
      return fallback;
    }

    function askedAbout(stem) {
      const text = String(stem || '').replace(/\s+/g, ' ').trim();
      if (/^what time\b/i.test(text)) return '时间';
      if (/\bjob\b/i.test(text) || /^what does\b.+\bdo\b/i.test(text)) return '职业';
      if (/^where\b/i.test(text)) return '地点';
      if (/^when\b/i.test(text)) return '什么时候';
      if (/^who\b/i.test(text)) return '谁';
      if (/^why\b/i.test(text)) return '原因';
      if (/^how many\b|^how much\b/i.test(text)) return '数量';
      if (/^how old\b/i.test(text)) return '年龄';
      if (/^how often\b/i.test(text)) return '频率';
      if (/^how long\b/i.test(text)) return '多久';
      if (/\banimals?\b/i.test(text)) return '哪种动物';
      return '';
    }

    function whySentence(focus) {
      if (!focus || !focus.answer || focus.kind === 'answer') return '';
      const given = paperReason(focus);
      if (given) return `为什么：${given}`;
      const picked = correctPick(focus);
      const stem = String(focus.stem || focus[1] || '').replace(/\s+/g, ' ').trim();
      if (!picked) {
        const answer = String(focus.answer).trim();
        if (!stem || !answer) return '';
        return `为什么：题目问的是「${clipText(stem, 42)}」，答案「${clipText(answer, 42)}」直接回应了这个问题。`;
      }
      const evidence = supportingSentence(picked.text);
      if (evidence) return `为什么选 ${picked.letter}：原文写着「${clipText(evidence, 72)}」，所以对应 ${picked.plain}。`;
      const about = askedAbout(stem);
      if (about) return `为什么选 ${picked.letter}：这题问的是${about}，${picked.plain} 正好回答了这一点。`;
      if (stem) return `为什么选 ${picked.letter}：题目问「${clipText(stem, 48)}」，${picked.plain} 就是在回答它。`;
      return `为什么选 ${picked.letter}：这一项是 ${picked.plain}。`;
    }

    function answerMarkup(focus) {
      const extra = answerTranslation(focus);
      const why = whySentence(focus);
      return `${escapeHtml(focus.answer || '')}${extra ? `<span class="choice-zh">${escapeHtml(extra)}</span>` : ''}${why ? `<span class="why">${escapeHtml(why)}</span>` : ''}`;
    }

    function markAnswerChoice(on) {
      const picked = correctPick(current());
      document.querySelectorAll('#exam-sheet .choice').forEach((button) => {
        button.classList.toggle('is-key', Boolean(on && picked && Number(button.dataset.choice) === picked.index));
      });
    }

    async function requestTranslation(text, token) {
      const key = translationKey(text);
      const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = setTimeout(() => {
        try { if (ctrl) ctrl.abort(); } catch (_) {}
      }, 12000);
      try {
        const response = await fetch('/dictionary/translate-text', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify({ text: key }),
          signal: ctrl ? ctrl.signal : undefined
        });
        if (response.status === 401 || response.status === 403) {
          translateBlocked = 'login';
          return false;
        }
        const data = await response.json().catch(() => ({}));
        const translation = translationKey(data && data.translation);
        if (response.ok && data && data.success && /[\u4e00-\u9fff]/.test(translation)) {
          sentenceTranslations.set(key, translation);
          return true;
        }
        translateFailed.add(key);
        return false;
      } catch (_) {
        translateFailed.add(key);
        return false;
      } finally {
        clearTimeout(timer);
      }
    }

    function queueTranslations(focus) {
      if (!translateOn || translateBlocked || !focus) return;
      const needed = translationPieces(focus).filter((item) => !translatePending.has(item));
      if (!needed.length) return;
      const token = readAuthToken();
      if (!token) {
        translateBlocked = 'login';
        setStatus('登录后可以打开整句翻译。');
        return;
      }
      needed.forEach((item) => translatePending.add(item));
      const sentence = sentenceSource(focus);
      Promise.all(needed.map((text) => requestTranslation(text, token))).then((flags) => {
        needed.forEach((item) => translatePending.delete(item));
        if (!translateOn) return;
        if (translateBlocked === 'login') {
          setStatus('登录后可以打开整句翻译。');
          render();
          return;
        }
        render();
        if (flags.some(Boolean)) return;
        if (sentence && needed.includes(sentence)) {
          setStatus('这句暂时没有翻译成功，请稍后再试。');
        } else {
          setStatus('翻译暂时没成功，请稍后再试。');
        }
      }).catch(() => {
        needed.forEach((item) => translatePending.delete(item));
        needed.forEach((item) => translateFailed.add(item));
        if (!translateOn) return;
        render();
        setStatus('翻译超时了，请稍后再试。');
      });
    }

    function renderExam(focus, focusShown) {
      const sheet = document.getElementById('exam-sheet');
      const nowEn = document.getElementById('now-en');
      const now = document.getElementById('now');
      const setExamMode = (on, folding) => {
        if (now) {
          now.classList.toggle('is-exam', Boolean(on));
          now.classList.toggle('folding', Boolean(folding));
        }
        if (on && nowEn) {
          nowEn.style.fontSize = '';
          nowEn.style.lineHeight = '';
        }
      };
      if (!sheet) return false;
      if (packId !== 'material' || !focus || !focus.kind) {
        sheet.hidden = true;
        sheet.innerHTML = '';
        setExamMode(false, false);
        if (nowEn) nowEn.hidden = false;
        return false;
      }
      const options = (focus.options || []).map((item, index) => (
        `<button class="choice" type="button" data-choice="${index}">${translatedMarkup(item)}</button>`
      )).join('');
      const answer = focus.kind !== 'answer' && focus.answer
        ? `<button class="answer-toggle" type="button" data-answer>答案</button><p class="answer-body" id="answer-body" hidden>${answerMarkup(focus)}</p>`
        : '';
      // 题目只显示一遍：题干在上方，选项在下方；不走折叠摘要，避免「截断题干 + 全文」叠两层
      const foldLong = Boolean(focus.long && !captionOn && focus.kind !== 'question');
      if (foldLong) {
        const summary = firstSentence(focus.body || focus[1]);
        const body = escapeHtml(focus.body || focus[1]).replace(/\n/g, '<br>');
        const zh = sentenceTranslation(focus);
        const source = sentenceSource(focus);
        const passageWaiting = !zh && translateOn && !translateBlocked && Boolean(source)
          && (translatePending.has(source) || canRequestTranslation(source));
        const zhHtml = zh
          ? `<p class="now-zh passage-zh">${escapeHtml(zh)}</p>`
          : (passageWaiting ? '<p class="now-zh pending passage-zh">正在翻译…</p>' : '');
        sheet.hidden = false;
        sheet.innerHTML = `<details class="read-fold"><summary>${escapeHtml(summary)}</summary><div class="read-body">${body}</div></details>${zhHtml}${options ? `<div class="choices">${options}</div>` : ''}${answer}`;
        setExamMode(true, true);
        if (nowEn) nowEn.hidden = true;
        return true;
      }
      if (nowEn) nowEn.hidden = !focusShown;
      if (!options && !answer) {
        sheet.hidden = true;
        sheet.innerHTML = '';
        setExamMode(false, false);
        return false;
      }
      sheet.hidden = false;
      sheet.innerHTML = `${options ? `<div class="choices">${options}</div>` : ''}${answer}`;
      setExamMode(true, false);
      return false;
    }

    function turnEnglish(turn, shown) {
      if (!shown) return '<span class="covered">英文先藏着</span>';
      if (turn.kind === 'question') {
        const options = (turn.options || []).map((item) => `<span class="opt-line">${translatedMarkup(item)}</span>`).join('');
        return `${escapeHtml(turn.stem || turn[1])}${options ? `<span class="opt-list">${options}</span>` : ''}`;
      }
      if (turn.long) return escapeHtml(firstSentence(turn.body || turn[1]));
      return escapeHtml(turn[1]);
    }

    function captionFont(text) {
      const count = [...String(text || '')].length;
      if (count <= 28) return 40;
      if (count <= 56) return 32;
      if (count <= 110) return 26;
      if (count <= 180) return 22;
      return 18;
    }

    function applyCaption(english, chinese) {
      const now = document.getElementById('now');
      const en = document.getElementById('now-en');
      const zh = document.getElementById('now-zh');
      const toggle = document.getElementById('caption-switch');
      now.classList.toggle('caption', captionOn);
      if (toggle) {
        toggle.classList.toggle('on', captionOn);
        toggle.setAttribute('aria-pressed', captionOn ? 'true' : 'false');
      }
      const translateToggle = document.getElementById('translate-switch');
      if (translateToggle) {
        translateToggle.classList.toggle('on', translateOn);
        translateToggle.setAttribute('aria-pressed', translateOn ? 'true' : 'false');
      }
      if (!captionOn || now.classList.contains('is-exam') || stageTypeSizeEnabled()) {
        en.style.fontSize = '';
        en.style.lineHeight = '';
        zh.style.fontSize = '';
        zh.style.lineHeight = '';
        return;
      }
      if (!english) {
        en.style.fontSize = '';
        en.style.lineHeight = '';
      } else {
        const size = captionFont(english);
        en.style.fontSize = size + 'px';
        en.style.lineHeight = Math.round(size * 1.4) + 'px';
      }
      const size = captionFont(english || chinese);
      const zhSize = Math.max(16, Math.round(size * 0.62));
      zh.style.fontSize = zhSize + 'px';
      zh.style.lineHeight = Math.round(zhSize * 1.45) + 'px';
      if (!chinese) zh.style.fontSize = '';

          ? `${sceneName(item)}（${item.turns.length}项）`

      const params = new URLSearchParams();

      params.set('scene', String(item.sceneIndex || 0));

    function syncSpeakingUrl() {
      if (!location.pathname.endsWith('daily-speaking.html')) return;
      const params = new URLSearchParams();
      if (packId === 'material' && currentMaterialId) params.set('material', String(currentMaterialId));
      else if (packId !== 'daily') params.set('pack', packId);
      if (sceneIndex > 0) params.set('scene', String(sceneIndex));
      if (lineIndex > 0) params.set('line', String(lineIndex));
      const next = params.toString() ? './daily-speaking.html?' + params.toString() : './daily-speaking.html';
      const current = location.pathname.split('/').pop() + location.search;
      const target = next.replace(/^\.\//, '');
      if (current !== target) history.replaceState(null, '', next);

    function saveSpeakingProgressNow() {
      try {
        const scenes = activeScenes();
        if (!scenes.length) return;
        const turn = current();
        if (!turn) return;
        const total = scenes.reduce((sum, item) => sum + ((item.turns && item.turns.length) || 0), 0);
        if (!total) return;
        const position = speakingAbsolutePosition();
        const item = {
          id: speakingProgressId(),

          title: packId === 'material'
            ? (materialTitle || '我的教材')

          sceneIndex,

          position,
          total,
          percent: Math.min(100, Math.round((position / Math.max(total - 1, 1)) * 100)),
          updatedAt: Date.now(),
          href: '',
