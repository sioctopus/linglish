  <script>
    // Filter noisy extension JSON.parse('undefined') errors (does not affect app logic)
    // IMPORTANT: This must be the first script to catch extension errors
    (function () {
      try {
        const patterns = [
          /\"undefined\" is not valid JSON/i,
          /\"null\" is not valid JSON/i,
          /Unexpected token 'u'.*JSON/i,
          /Unexpected token 'n'.*JSON/i,
          /SyntaxError.*undefined.*JSON/i,
          /SyntaxError.*null.*JSON/i,
          /JSON\.parse/i,
          /updateConfig/i,
          /initConfig/i,
          /metadata\.js/i,
          /content\.js/i,
        ];
        const matchMsg = (msg) => {
          try { return patterns.some((re) => re.test(String(msg || ''))); } catch { return false; }
        };

        // Check if error is from extension (check stack trace)
        const isExtensionError = (error) => {
          try {
            if (!error) return false;
            const stack = error.stack || error.toString();
            // Check for common extension patterns
            if (/chrome-extension:\/\//i.test(stack)) return true;
            if (/moz-extension:\/\//i.test(stack)) return true;
            if (/safari-extension:\/\//i.test(stack)) return true;
            if (/webkit-masked-url:\/\//i.test(stack)) return true;
            if (/metadata\.js/i.test(stack)) return true;
            if (/content\.js/i.test(stack)) return true;
            if (/updateConfig|initConfig/i.test(stack)) return true;
            return false;
          } catch (_) {
            return false;
          }
        };

        // Override console methods
        const ce = console.error ? console.error.bind(console) : null;
        const cw = console.warn ? console.warn.bind(console) : null;
        if (ce) {
          console.error = function (...args) {
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            // Check if it's an error object
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return ce(...args);
          };
        }
        if (cw) {
          console.warn = function (...args) {
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return cw(...args);
          };
        }

        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', (ev) => {
          try {
            const reason = ev?.reason;
            // Check message
            const msg = reason?.message || reason?.toString?.() || reason;
            if (matchMsg(String(msg || ''))) {
              ev.preventDefault();
              return;
            }
            // Check if from extension
            if (isExtensionError(reason)) {
              ev.preventDefault();
              return;
            }
          } catch (_) { }
        });

        // Catch error events
        window.addEventListener('error', (ev) => {
          try {
            const msg = ev?.message || '';
            if (matchMsg(String(msg))) {
              ev.preventDefault();
              return;
            }
            // Check if error is from extension
            if (ev?.error && isExtensionError(ev.error)) {
              ev.preventDefault();
              return;
            }
            // Check filename for extension patterns
            const filename = ev?.filename || '';
            if (/chrome-extension|moz-extension|safari-extension|webkit-masked-url|metadata\.js|content\.js/i.test(filename)) {
              ev.preventDefault();
              return;
            }
          } catch (_) { }
        }, true);
      } catch (_) { }
    })();
  </script>

      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }

    .skeleton-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.5);

      height: 20px;
      width: 70%;
      margin-bottom: 12px;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    /* Pull to Refresh */
    .pull-indicator {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 0;
      overflow: hidden;
      transition: height 0.2s ease;
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
      gap: 8px;

      width: 16px;
      height: 16px;
      border: 2px solid #cbd5e1;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }

      display: block;

      to {
        transform: rotate(360deg);

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // User Info Logic
      try {
        const userInfoEl = document.getElementById('mobile-user-info');
        const userNameEl = document.getElementById('mobile-user-name');
        const vipBadgeEl = document.getElementById('mobile-vip-badge');

        if (userInfoEl && authManager && authManager.isAuthenticated()) {
          // Fetch fresh user data
          const token = authManager.getToken();
          const API_BASE = window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.port === '4000'
            ? 'http://localhost:4000'
            : '';

          try {
            const res = await fetch(`${API_BASE}/users/me`, {
              headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
              const user = await res.json();

              // Display Name
              let displayName = 'User';
              if (user.username) {
                displayName = user.username;
              } else if (user.email) {
                displayName = user.email.split('@')[0];
              }
              if (userNameEl) userNameEl.textContent = displayName;

              // VIP Status
              if (vipBadgeEl && user.membership_type && user.membership_type !== 'free') {
                vipBadgeEl.style.display = 'inline-flex';
                const isFamily = user.membership_type === 'family';
                vipBadgeEl.classList.toggle('family', isFamily);
                const vipText = vipBadgeEl.querySelector('.vip-text');
                if (vipText) vipText.textContent = isFamily ? 'Family' : 'VIP';
              }

              userInfoEl.style.display = 'flex';
            }
          } catch (err) {
            console.warn('Failed to fetch user profile:', err);
            // Fallback to authManager data if fetch fails
            const user = authManager.getUserInfo();
            if (user) {
              let displayName = user.username || user.email?.split('@')[0] || 'User';
              if (userNameEl) userNameEl.textContent = displayName;
              userInfoEl.style.display = 'flex';
            }
          }
        }
      } catch (e) {
        console.warn('Failed to update user info:', e);
      }

      const API_BASE = '';
      const pillButtons = document.querySelectorAll('.category-pills .pill-btn');
      const myVideosSection = document.querySelector('.my-videos-section');
      const myVideosList = document.getElementById('my-video-list');
      const loadingPlaceholder = document.getElementById('my-videos-placeholder');
      const emptyState = document.getElementById('my-videos-empty');
      const allVideosWrapper = document.querySelector('.all-videos-wrapper');
      const allVideosSection = document.getElementById('all-videos-section');
      const aiScenarioList = document.getElementById('ai-scenario-list');
      const aiScenarioStatus = document.getElementById('ai-scenario-status');

      const getArenaToken = () => {
        try {
          if (typeof authManager !== 'undefined' && typeof authManager.getToken === 'function') {
            return authManager.getToken() || '';
          }
        } catch (_) { }
        return localStorage.getItem('authToken') || sessionStorage.getItem('authToken')
          || localStorage.getItem('linglish_token') || sessionStorage.getItem('linglish_token') || '';
      };

      const detectArenaGuest = () => LinglishRoleplayEntrypoints.detectGuest({
        authManager: typeof authManager !== 'undefined' ? authManager : null,
        guestCheck: window.GuestCheck,
        localStorage,
        sessionStorage,
      });

      const state = {
        token: getArenaToken(),
        isGuest: detectArenaGuest(),
        userId: null,
        videos: [],
        scenarios: [],
        currentDifficulty: null, // 难度筛选: null/'beginner'/'intermediate'/'advanced'
      };

      // 从 localStorage 初始化用户等级
      function initLevelFromStorage() {
        try {
          const activeLevel = localStorage.getItem('linglish_active_level');
          if (activeLevel && ['beginner', 'intermediate', 'advanced'].includes(activeLevel)) {
            state.currentDifficulty = activeLevel;
            console.log('[Arena] Initialized level from localStorage:', activeLevel);
          }
        } catch (e) {
          console.warn('[Arena] Failed to init level from storage:', e);
        }
      }
      initLevelFromStorage();

      // 根据难度等级过滤视频
      function filterVideosByDifficulty(videos) {
        if (!state.currentDifficulty) return videos;
        return videos.filter(v => v.difficulty_level === state.currentDifficulty);
      }

      function escapeHtml(str = '') {
        return String(str).replace(/[&<>"']/g, (char) => {
          const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
          return map[char] || char;
        });
      }

      function truncateDescription(text, maxLength = 100) {
        if (!text) return '';
        const str = String(text).trim();
        if (str.length <= maxLength) return str;
        return str.substring(0, maxLength).trim() + '...';
      }

      const incomingScenarioTheme = new URLSearchParams(window.location.search).get('theme') || '';

      function clearArenaAuth() {
        try {
          if (window.AuthManager && typeof window.AuthManager.clearToken === 'function') {
            window.AuthManager.clearToken();
            return;
          }
          if (typeof authManager !== 'undefined' && typeof authManager.safeRemove === 'function') {
            ['authToken', 'linglish_token'].forEach((key) => {
              authManager.safeRemove(localStorage, key);
              authManager.safeRemove(sessionStorage, key);
            });
            if (typeof authManager.clearGuestFlags === 'function') authManager.clearGuestFlags();
            authManager.authToken = null;
            return;
          }
        } catch (_) { }
        ['authToken', 'linglish_token'].forEach((key) => {
          try { localStorage.removeItem(key); } catch (_) { }
          try { sessionStorage.removeItem(key); } catch (_) { }
        });
      }

      const aiCatalogController = LinglishRoleplayEntrypoints.createCatalogController({
        request: (token) => fetch(`${API_BASE}/ai-roleplay/scenarios?limit=12`, {
          headers: { Authorization: `Bearer ${token}` },
        }),
        getToken: getArenaToken,
        isGuest: detectArenaGuest,
        clearAuth: clearArenaAuth,
        onState: (catalogState) => {
          state.token = getArenaToken();
          state.isGuest = Boolean(catalogState.isGuest);
          state.scenarios = Array.isArray(catalogState.scenarios) ? catalogState.scenarios : [];
          LinglishRoleplayEntrypoints.renderCatalogState({
            document,
            listElement: aiScenarioList,
            statusElement: aiScenarioStatus,
            state: catalogState,
            theme: incomingScenarioTheme,
            onRetry: () => aiCatalogController.retry(),
          });
        },
      });

      function loadAIScenarios() {
        if (!aiScenarioList || !aiScenarioStatus) return Promise.resolve();
        return aiCatalogController.load();
      }

      function formatDuration(seconds) {
        if (!Number.isFinite(seconds) || seconds <= 0) {
          return '00:00';
        }
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function formatDurationText(seconds) {
        if (!Number.isFinite(seconds) || seconds <= 0) {
          return (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('mobile.arena.card.duration_unknown') : '时长未知';
        }
        if (seconds < 60) {
          const unit = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('mobile.arena.card.seconds') : '秒';
          return `${Math.max(1, Math.round(seconds))} ${unit}`;
        }
        const mins = Math.max(1, Math.round(seconds / 60));
        const unit = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('mobile.arena.card.minutes') : '分钟';
        return `${mins} ${unit}`;
      }

      function estimateWordCount(transcript = '') {
        const normalized = String(transcript).replace(/\s+/g, ' ').trim();
        if (!normalized) {
          return 0;
        }
        const parts = normalized.split(' ').filter(Boolean);
        if (parts.length > 1) {
          return parts.length;
        }
        return Math.min(normalized.length, 2000);
      }

      function mapStatus(status) {
        const t = (key, fallback) => (typeof i18n !== 'undefined' && i18n.t) ? i18n.t(key) : fallback;
        switch (status) {
          case 'ready':
            return { label: `✅ ${t('mobile.arena.video.status.ready', '可练习')}`, width: '100%' };
          case 'processing':
            return { label: `⏳ ${t('mobile.arena.video.status.processing', '视频处理中')}`, width: '35%' };
          case 'failed':
            return { label: `⚠️ ${t('mobile.arena.video.status.failed', '处理失败')}`, width: '0%' };
          default:
            return { label: `📥 ${t('mobile.arena.video.status.uploaded', '已上传')}`, width: '15%' };
        }
      }

      function resolveThumbnail(video) {
        // 优先使用YouTube缩略图（如果是YouTube视频）
        if (video && video.youtube_video_id) {
          console.log('[Thumbnail] Using YouTube thumbnail for:', video.youtube_video_id);
          return `https://img.youtube.com/vi/${video.youtube_video_id}/hqdefault.jpg`;
        }

        const candidate = video?.thumbnail_url || video?.thumbnail_path;
        if (candidate) {
          const needsBase = !/^https?:\/\//i.test(candidate);
          const url = needsBase ? `${API_BASE}${candidate}` : candidate;
          console.log('[Thumbnail] Using stored thumbnail:', url);
          return url;
        }

        // 使用简化的SVG占位符
        const videoId = video?.id || '';
        console.log('[Thumbnail] Using SVG fallback for video:', videoId);
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:rgb(102,126,234)"/><stop offset="100%" style="stop-color:rgb(118,75,162)"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="72" fill="white">🎬</text></svg>`)}`;
      }

      function showPlaceholder(text) {
        const skeleton = document.getElementById('my-videos-skeleton');
        const placeholder = document.getElementById('my-videos-placeholder');

        if (skeleton) {
          skeleton.classList.remove('hidden');
          if (placeholder) placeholder.classList.add('hidden');
        } else if (loadingPlaceholder) {
          loadingPlaceholder.textContent = text;
          loadingPlaceholder.classList.remove('hidden');
        }
      }

      function hidePlaceholder() {
        const skeleton = document.getElementById('my-videos-skeleton');
        const placeholder = document.getElementById('my-videos-placeholder');

        if (skeleton) skeleton.classList.add('hidden');
        if (loadingPlaceholder) loadingPlaceholder.classList.add('hidden');
      }

      function showEmpty(message) {
        if (!emptyState) return;
        const defaultMsg = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('mobile.arena.empty_videos') : '暂时没有可用视频。';
        emptyState.textContent = message || defaultMsg;
        emptyState.classList.remove('hidden');
      }

      function hideEmpty() {
        if (!emptyState) return;
        emptyState.classList.add('hidden');
      }

      function scheduleLogout() {
        if (typeof authManager !== 'undefined' && authManager && typeof authManager.logout === 'function') {
          setTimeout(() => authManager.logout(), 1200);
        }
      }

      function renderMyVideos(videos) {
        if (!myVideosList) return;
        myVideosList.innerHTML = '';

        if (!Array.isArray(videos) || videos.length === 0) {
          const msg = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('mobile.arena.my_videos.no_uploads') : '还没有上传过练习视频。';
          showEmpty(msg);
          return;
        }

        hideEmpty();
        const fragment = document.createDocumentFragment();

        videos.forEach((video) => {
          const card = document.createElement('div');
          card.className = 'scenario-card my-video-card';
          card.dataset.category = 'mine';

          const videoId = video?.id;
          const videoLabel = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('vocab.detail.video_fallback') : '视频 #';
          const title = video?.title || video?.original_filename || `${videoLabel}${videoId || ''}`;
          const langLabel = video?.language ? `${video.language}` : '';
          const customPractice = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('mobile.arena.video.custom_practice') : '自制练习场景';
          const rawDescription = video?.description || (langLabel || customPractice);
          const description = truncateDescription(rawDescription, 100);
          const durationSec = Number(video?.duration_sec) || 0;
          const durationLabel = formatDuration(durationSec);
          const durationText = formatDurationText(durationSec);
          const wordCount = estimateWordCount(video?.transcript);
          const statusInfo = mapStatus(video?.status);
          const thumbnailUrl = resolveThumbnail(video);
          const targetUrl = videoId != null && videoId !== ''
            ? `practice-session.html?videoId=${encodeURIComponent(String(videoId))}&mode=arena`
            : 'practice-session.html?mode=arena';

          card.innerHTML = `
            <div class="current-badge personal">🎬 我的作品</div>
            <div class="scenario-image">
              <img src="${thumbnailUrl}" alt="${escapeHtml(title)}" onerror="this.style.opacity='0';">
              <div class="scenario-image-fallback">🎬</div>
              <div class="scenario-difficulty easy">⭐ <span data-i18n="mobile.arena.difficulty.custom">自制</span></div>
              <div class="video-duration-overlay">${durationLabel}</div>
            </div>
            <div class="scenario-info">
              <h4 class="scenario-title">${escapeHtml(title)}</h4>
              <div class="scenario-progress">
                <div class="progress-bar-scenario">
                  <div class="progress-fill-scenario" style="width: ${statusInfo.width};"></div>
                </div>
                <span class="progress-label-scenario">${statusInfo.label}</span>
              </div>
            </div>
          `;

          card.addEventListener('click', () => {
            window.location.href = targetUrl;
          });

          fragment.appendChild(card);
        });

        myVideosList.appendChild(fragment);
      }

      function renderAllVideos(videos) {
        if (!allVideosSection) return;
        allVideosSection.innerHTML = '';

        if (!Array.isArray(videos) || videos.length === 0) {
          allVideosSection.innerHTML = '<div class="my-videos-empty">暂无视频</div>';
          return;
        }

        const fragment = document.createDocumentFragment();

        videos.forEach((video) => {
          const card = document.createElement('div');
          card.className = 'scenario-card';
          card.dataset.category = 'all';

          const videoId = video?.id;
          const videoLabel = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t('vocab.detail.video_fallback') : '视频 #';
          const title = video?.title || video?.original_filename || `${videoLabel}${videoId || ''}`;
          const durationSec = Number(video?.duration_sec) || 0;
          const durationLabel = formatDuration(durationSec);
          const statusInfo = mapStatus(video?.status);
          const thumbnailUrl = resolveThumbnail(video);
          const targetUrl = videoId != null && videoId !== ''
            ? `practice-session.html?videoId=${encodeURIComponent(String(videoId))}&mode=arena`
            : 'practice-session.html?mode=arena';

          // Check if this is user's own video
          const isMyVideo = state.userId != null && Number(video?.uploader_id) === Number(state.userId);
          const badgeHtml = isMyVideo ? '<div class="current-badge personal">🎬 我的作品</div>' : '';

          card.innerHTML = `
            ${badgeHtml}
            <div class="scenario-image">
              <img src="${thumbnailUrl}" alt="${escapeHtml(title)}" onerror="this.style.opacity='0';">
              <div class="scenario-image-fallback">🎬</div>
              <div class="video-duration-overlay">${durationLabel}</div>
            </div>
            <div class="scenario-info">
              <h4 class="scenario-title">${escapeHtml(title)}</h4>
              <div class="scenario-progress">
                <div class="progress-bar-scenario">
                  <div class="progress-fill-scenario" style="width: ${statusInfo.width};"></div>
                </div>
                <span class="progress-label-scenario">${statusInfo.label}</span>
              </div>
            </div>
          `;

          card.addEventListener('click', () => {
            window.location.href = targetUrl;
          });

          fragment.appendChild(card);
        });

        allVideosSection.appendChild(fragment);
      }

      async function loadMyVideos() {
        if (!myVideosList) return;

        if (!state.token) {
          hidePlaceholder();
          renderMyVideos([]);
          return;
        }

        showPlaceholder('正在加载我的视频...');
        hideEmpty();

        const headers = { Authorization: `Bearer ${state.token}` };

        try {
          const profileResponse = await fetch(`${API_BASE}/users/me`, { headers });
          if (profileResponse.ok) {
            const profile = await profileResponse.json();
            state.userId = Number(profile?.id) || null;
          } else if (profileResponse.status === 401) {
            showEmpty('登录信息已过期，请重新登录。');
            scheduleLogout();
            return;
          }
        } catch (err) {
          console.warn('Failed to load user profile:', err);
        }

        try {
          const res = await fetch(`${API_BASE}/video-resources?lite=1`, { headers });
          if (res.status === 401) {
            showEmpty('登录信息已过期，请重新登录。');
            scheduleLogout();
            return;
          }
          if (!res.ok) {
            throw new Error(`Unexpected status ${res.status}`);
          }
          const data = await res.json();
          state.videos = Array.isArray(data?.items) ? data.items : [];

          // 先按难度等级过滤
          const filteredByLevel = filterVideosByDifficulty(state.videos);

          let myVideos = filteredByLevel;
          if (state.userId != null) {
            const owned = filteredByLevel.filter((video) => Number(video?.uploader_id) === Number(state.userId));
            if (owned.length > 0) {
              myVideos = owned;
            }
          }
          renderMyVideos(myVideos);
          // Render all videos to the general section (also filtered by level)
          renderAllVideos(filteredByLevel);
        } catch (err) {
          console.warn('Failed to load video resources:', err);
          showEmpty('加载失败，请稍后重试。');
        } finally {
          hidePlaceholder();
        }
      }

      function setActiveButton(target) {
        pillButtons.forEach((btn) => btn.classList.toggle('active', btn === target));
      }

      function applyFilter(filter) {
        if (!myVideosSection || !allVideosWrapper) return;

        if (filter === 'mine') {
          // Show only my videos section
          myVideosSection.classList.remove('hidden');
          allVideosWrapper.classList.add('hidden');
          return;
        }

        // Show both sections for 'all' filter
        myVideosSection.classList.remove('hidden');
        allVideosWrapper.classList.remove('hidden');
      }

      pillButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const filter = button.dataset.filter || 'all';
          setActiveButton(button);
          applyFilter(filter);
        });
      });

      await Promise.all([loadAIScenarios(), loadMyVideos()]);
      applyFilter('all');

      // Load league status
      loadLeaguePreview();
    });

    // League Preview Functions
    async function loadLeaguePreview() {
      const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken')
        || localStorage.getItem('linglish_token') || sessionStorage.getItem('linglish_token');
      const isGuest = typeof window.GuestCheck !== 'undefined'
        && typeof window.GuestCheck.isGuest === 'function'
        && window.GuestCheck.isGuest();
      if (!token || isGuest) {
        // Hide league section for guests
        const leagueSection = document.getElementById('league-preview');
        if (leagueSection) leagueSection.style.display = 'none';
        return;
      }

      try {
        const response = await fetch('/api/league/status', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          console.warn('Failed to load league status:', response.status);
          return;
        }

        const status = await response.json();
        if (!status) return;

        updateLeaguePreview(status);
      } catch (error) {
        console.warn('Error loading league preview:', error);
      }
    }

    function updateLeaguePreview(status) {
      const tierIcons = {
        'bronze': '🥉',
        'silver': '🥈',
        'gold': '🥇',
        'diamond': '💎',
        'master': '👑'
      };

      // Update tier info
      const tierIcon = document.getElementById('tier-icon');
      const tierName = document.getElementById('tier-name');
      const tierRank = document.getElementById('tier-rank');
      const weeklyXp = document.getElementById('weekly-xp');

      if (tierIcon && status.tier) {
        tierIcon.textContent = tierIcons[status.tier.key] || '🏆';
      }
      if (tierName && status.tier) {
        tierName.textContent = status.tier.name || '联赛';
        tierName.style.color = status.tier.colorCode || '#1e293b';
      }
      if (tierRank) {
        tierRank.textContent = status.currentRank ? `排名: #${status.currentRank}` : '排名: --';
      }
      if (weeklyXp) {
        weeklyXp.textContent = formatXP(status.weeklyXp || 0);
      }

      // Update progress marker position
      const marker = document.getElementById('rank-marker');
      if (marker && status.currentRank && status.groupSize) {
        const position = ((status.currentRank - 1) / (status.groupSize - 1)) * 100;
        marker.style.left = `${Math.min(95, Math.max(5, position))}%`;
      }

      // Update season timer
      const timerEl = document.getElementById('season-timer');
      if (timerEl && status.seasonEndsAt) {
        updateSeasonTimer(timerEl, status.seasonEndsAt);
        // Update every minute
        setInterval(() => updateSeasonTimer(timerEl, status.seasonEndsAt), 60000);
      }
    }

    function formatXP(xp) {
      if (xp >= 1000) {
        return (xp / 1000).toFixed(1) + 'K';
      }
      return xp.toString();
    }

    function updateSeasonTimer(element, endDate) {
      const now = new Date().getTime();
      const end = new Date(endDate).getTime();
      const distance = end - now;

      if (distance < 0) {
        element.textContent = '赛季已结束';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      if (days > 0) {
        element.textContent = `赛季剩余: ${days}天 ${hours}小时`;
      } else {
        element.textContent = `赛季剩余: ${hours}小时`;
      }
    }
  </script>

  <script>
    // Haptic Feedback Helper
    const triggerHaptic = () => {
      if (navigator.vibrate) navigator.vibrate(10);
    };

    // Ripple Effect Helper
    const createRipple = (event) => {
      const button = event.currentTarget;
      const circle = document.createElement('span');
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
      circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
      circle.classList.add('ripple-effect');

      const ripple = button.getElementsByClassName('ripple-effect')[0];
      if (ripple) {
        ripple.remove();
      }

      button.appendChild(circle);
    };

    // Bind interactions
    document.addEventListener('click', (e) => {
      const target = e.target.closest('button, a, .scenario-card, .pill-btn, .nav-item');
      if (target) {
        triggerHaptic();
        createRipple({ currentTarget: target, clientX: e.clientX, clientY: e.clientY });
      }
    });

    // Initialize i18n
    if (typeof i18n !== 'undefined') {
      try {
        i18n.init();
      } catch (e) {
        console.error('[i18n] Failed to initialize:', e);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof i18n !== 'undefined') {
        i18n.init();
      }
    });
  </script>
  <script src="./js/page-tracker.js"></script>
