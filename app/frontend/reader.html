    <script>
      // Filter noisy extension JSON.parse('undefined') errors (does not affect app logic)
      // IMPORTANT: This must be the first script to catch extension errors
      (function(){
        try {
          const patterns = [
            /\"undefined\" is not valid JSON/i,
            /\"null\" is not valid JSON/i,
            /Unexpected token 'u'.*JSON/i,
            /Unexpected token 'n'.*JSON/i,
            /SyntaxError.*undefined.*JSON/i,
            /SyntaxError.*null.*JSON/i,
            /JSON\.parse/i,
            /updateConfig/i,
            /initConfig/i,
            /metadata\.js/i,
            /content\.js/i,
          ];
          const matchMsg = (msg) => {
            try { return patterns.some((re) => re.test(String(msg || ''))); } catch { return false; }
          };

          // Check if error is from extension (check stack trace)
          const isExtensionError = (error) => {
            try {
              if (!error) return false;
              const stack = error.stack || error.toString();
              // Check for common extension patterns
              if (/chrome-extension:\/\//i.test(stack)) return true;
              if (/moz-extension:\/\//i.test(stack)) return true;
              if (/safari-extension:\/\//i.test(stack)) return true;
              if (/webkit-masked-url:\/\//i.test(stack)) return true;
              if (/metadata\.js/i.test(stack)) return true;
              if (/content\.js/i.test(stack)) return true;
              if (/updateConfig|initConfig/i.test(stack)) return true;
              return false;
            } catch (_) {
              return false;
            }
          };

          // Override console methods
          const ce = console.error ? console.error.bind(console) : null;
          const cw = console.warn ? console.warn.bind(console) : null;
          if (ce) {
            console.error = function(...args){
              const head = args && args.length ? String(args[0]) : '';
              if (matchMsg(head)) return;
              // Check if it's an error object
              if (args[0] instanceof Error && isExtensionError(args[0])) return;
              return ce(...args);
            };
          }
          if (cw) {
            console.warn = function(...args){
              const head = args && args.length ? String(args[0]) : '';
              if (matchMsg(head)) return;
              if (args[0] instanceof Error && isExtensionError(args[0])) return;
              return cw(...args);
            };
          }

          // Catch unhandled promise rejections
          window.addEventListener('unhandledrejection', (ev) => {
            try {
              const reason = ev?.reason;
              // Check message
              const msg = reason?.message || reason?.toString?.() || reason;
              if (matchMsg(String(msg||''))) {
                ev.preventDefault();
                return;
              }
              // Check if from extension
              if (isExtensionError(reason)) {
                ev.preventDefault();
                return;
              }
            } catch(_) {}
          });

          // Catch error events
          window.addEventListener('error', (ev) => {
            try {
              const msg = ev?.message || '';
              if (matchMsg(String(msg))) {
                ev.preventDefault();
                return;
              }
              // Check if error is from extension
              if (ev?.error && isExtensionError(ev.error)) {
                ev.preventDefault();
                return;
              }
              // Check filename for extension patterns
              const filename = ev?.filename || '';
              if (/chrome-extension|moz-extension|safari-extension|webkit-masked-url|metadata\.js|content\.js/i.test(filename)) {
                ev.preventDefault();
                return;
              }
            } catch(_) {}
          }, true);
        } catch (_) {}
      })();
    </script>

    <script>
      const API_BASE = '';
      let token = localStorage.getItem('linglish_token') || sessionStorage.getItem('linglish_token')
        || localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
      let currentArticles = [];
      let currentArticleIndex = -1;
      let currentSentences = [];
      let currentSubtitleLines = [];
      let isReading = false;

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
      }

      function subtitleLines(text) {
        const raw = String(text || '').trim();
        if (!raw) return [];
        const explicit = raw.split(/\n+/).map(line => line.trim()).filter(Boolean);
        const source = explicit.length > 1 ? explicit : (raw.match(/[^.!?]+[.!?]+(?:["']+)?|[^.!?]+$/g) || [raw]);
        const cues = source
          .map(line => line.replace(/\s+/g, ' ').trim())
          .filter(line => ((line.match(/[A-Za-z]/g) || []).length >= 6));
        return cues.length ? cues : [raw];
      }

      // Check authentication
      console.log('[Auth] Token available:', Boolean(token));
      console.log('[Auth] localStorage available:', typeof(Storage) !== 'undefined');

      if (!token || token === 'null' || token === 'undefined') {
        console.error('[Auth] No valid token found, redirecting to login');
        alert('Please login first');
        window.location.href = './index.html';
        throw new Error('Authentication required'); // Prevent further execution
      }

      // Load user info
      async function loadUserInfo() {
        try {
          const response = await fetch(`${API_BASE}/users/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const user = await response.json();
          document.getElementById('user-email').textContent = user.email;
        } catch (err) {
          console.error('Failed to load user:', err);
        }
      }

      // Load books/articles
      async function loadBooks() {
        try {
          const response = await fetch(`${API_BASE}/articles`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await response.json();

          currentArticles = data.items || [];

          const bookList = document.getElementById('book-list');

          if (currentArticles.length === 0) {
            bookList.innerHTML = '<p>No articles available. Please import some content first.</p>';
            return;
          }

          const requestedId = new URLSearchParams(window.location.search).get('id');
          bookList.innerHTML = currentArticles
            .map((article, index) => `
              <div class="book-card" onclick="event.target.classList.contains('delete-book-btn') ? null : loadArticle(${index})">
                <div class="book-card-header">
                  <h3 class="book-card-title">${article.title}</h3>
                  <button class="delete-book-btn" onclick="event.stopPropagation(); deleteArticle(${article.id}, '${article.title.replace(/'/g, "\\'")}');" title="删除">🗑️</button>
                </div>
                <div class="meta">
                  Level: ${article.level || 'N/A'}<br>
                  ${article.tags ? article.tags.slice(0, 2).join(', ') : ''}
                </div>
              </div>
            `)
            .join('');

          if (requestedId) {
            const requestedIndex = currentArticles.findIndex(article => String(article.id) === String(requestedId));
            if (requestedIndex >= 0) loadArticle(requestedIndex);
          }

        } catch (err) {
          console.error('Failed to load books:', err);
          document.getElementById('book-list').innerHTML = '<p class="error-message">Failed to load books</p>';
        }
      }

      // Delete article
      async function deleteArticle(articleId, articleTitle) {
        const confirmMsg = `确定要删除文章"${articleTitle}"吗？\n\n此操作无法撤销，将会删除：\n- 文章内容\n- PDF 文件（如果有）\n- 相关的音频和学习记录`;
        if (!confirm(confirmMsg)) {
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/articles/${articleId}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`,
            },
          });

          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.message || 'Failed to delete article');
          }

          const result = await response.json();
          console.log('[DELETE] Article deleted successfully:', result);

          // 检查是否删除的是当前正在阅读的文章
          const wasCurrentArticle = currentArticleIndex >= 0 &&
                                    currentArticles[currentArticleIndex]?.id === articleId;

          // 如果删除的是当前正在阅读的文章，隐藏阅读区域
          if (wasCurrentArticle) {
            document.getElementById('reading-area').style.display = 'none';
            currentArticleIndex = -1;
          }

          // 重新加载书籍列表
          await loadBooks();

          alert('文章已成功删除');
        } catch (err) {
          console.error('[DELETE] Failed to delete article:', err);
          alert(`删除失败：${err.message}`);
        }
      }

      // Load article content
      function loadArticle(index) {
        if (index < 0 || index >= currentArticles.length) return;

        currentArticleIndex = index;
        const article = currentArticles[index];

        // Update UI
        document.getElementById('article-title').textContent = article.title;

        const meta = document.getElementById('article-meta');
        const pdfPath = String(article.pdf_path || '');
        const pageLink = pdfPath.startsWith('/pdfs/') && !pdfPath.includes('..')
          ? `<a href="./pdf-reader.html?path=${encodeURIComponent(pdfPath)}">查看原页</a>`
          : '';
        meta.innerHTML = `
          <span>📊 Level: ${article.level || 'N/A'}</span>
          <span>📝 ${article.word_count || 0} words</span>
          ${article.tags ? `<span>🏷️ ${escapeHtml((Array.isArray(article.tags) ? article.tags : String(article.tags).split(',')).join(', '))}</span>` : ''}
          ${pageLink}
        `;

        currentSubtitleLines = subtitleLines(article.content || '');
        const content = document.getElementById('article-content');
        content.innerHTML = currentSubtitleLines.map((line, index) => (
          `<p class="sentence" data-index="${index}">${escapeHtml(line)}</p>`
        )).join('');
        const label = document.getElementById('subtitle-label');
        if (label) label.textContent = `朗读字幕 · ${currentSubtitleLines.length} 句`;

        // Show reading area
        document.getElementById('reading-area').style.display = 'block';

        // Update navigation buttons
        document.getElementById('prev-btn').disabled = index === 0;
        document.getElementById('next-btn').disabled = index === currentArticles.length - 1;

        // Highlight selected book card
        document.querySelectorAll('.book-card').forEach((card, i) => {
          card.classList.toggle('active', i === index);
        });

        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Read aloud functionality
      async function readAloud() {
        const lang = document.getElementById('tts-lang').value;
        const slow = document.getElementById('slow-speech').checked;
        const lines = currentSubtitleLines.length
          ? currentSubtitleLines
          : [document.getElementById('article-content').textContent];

        if (!lines.length || !String(lines[0] || '').trim()) {
          alert('No content to read');
          return;
        }

        const chunks = lines.flatMap(line => splitTextIntoChunks(line, 200));
        const chunkLines = [];
        lines.forEach((line, lineIndex) => {
          splitTextIntoChunks(line, 200).forEach(() => chunkLines.push(lineIndex));
        });

        document.getElementById('read-btn').disabled = true;
        document.getElementById('stop-btn').disabled = false;
        document.getElementById('tts-status').textContent = `准备朗读 ${lines.length} 句字幕`;

        isReading = true;

        for (let i = 0; i < chunks.length && isReading; i++) {
          const chunk = chunks[i];
          const lineIndex = chunkLines[i];
          document.querySelectorAll('.article-content .sentence').forEach((node, index) => {
            node.classList.toggle('playing', index === lineIndex);
            if (index === lineIndex) node.scrollIntoView({ block: 'center', behavior: 'smooth' });
          });

          try {
            document.getElementById('tts-status').textContent = `正在朗读第 ${lineIndex + 1}/${lines.length} 句`;

            // Respect global voice selection
            const selectedVoice = window.LinglishTtsVoice ? LinglishTtsVoice.current() : 'en-US-AvaMultilingualNeural';
            const voiceLang = selectedVoice.startsWith('en-') ? 'en' : (selectedVoice.startsWith('zh-') ? 'zh-CN' : lang);
            const response = await fetch(`${API_BASE}/tts/generate`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify({ text: chunk, lang: voiceLang, slow, provider: 'edge', voice: selectedVoice })
            });

            const { audioUrl } = await response.json();

            const audio = document.getElementById('audio-player');
            audio.src = audioUrl;

            // Wait for audio to finish
            await new Promise((resolve, reject) => {
              audio.onended = resolve;
              audio.onerror = reject;
              audio.play();
            });

          } catch (err) {
            console.error('TTS error:', err);
            document.getElementById('tts-status').textContent = `Error: ${err.message}`;
            break;
          }
        }

        document.getElementById('read-btn').disabled = false;
        document.getElementById('stop-btn').disabled = true;
        document.getElementById('tts-status').textContent = '朗读结束';
        isReading = false;
      }

      // Stop reading
      function stopReading() {
        isReading = false;
        const audio = document.getElementById('audio-player');
        audio.pause();
        audio.currentTime = 0;

        document.getElementById('read-btn').disabled = false;
        document.getElementById('stop-btn').disabled = true;
        document.querySelectorAll('.article-content .sentence').forEach(node => node.classList.remove('playing'));
        document.getElementById('tts-status').textContent = '已停止';
      }

      // Split text into chunks
      function splitTextIntoChunks(text, maxLength) {
        const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
        const chunks = [];
        let currentChunk = '';

        for (const sentence of sentences) {
          if ((currentChunk + sentence).length > maxLength) {
            if (currentChunk) chunks.push(currentChunk.trim());
            currentChunk = sentence;
          } else {
            currentChunk += ' ' + sentence;
          }
        }

        if (currentChunk) chunks.push(currentChunk.trim());

        return chunks;
      }

      // Navigation
      function loadPreviousArticle() {
        if (currentArticleIndex > 0) {
          loadArticle(currentArticleIndex - 1);
        }
      }

      function loadNextArticle() {
        if (currentArticleIndex < currentArticles.length - 1) {
          loadArticle(currentArticleIndex + 1);
        }
      }

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') loadPreviousArticle();
        if (e.key === 'ArrowRight') loadNextArticle();
        if (e.key === ' ' && e.target.tagName !== 'INPUT') {
          e.preventDefault();
          if (isReading) stopReading();
          else readAloud();
        }
      });

      // Initialize
      loadUserInfo();
      loadBooks();
    </script>
  <link rel="stylesheet" href="./styles/speak-ui.css?v=3">
</body>
