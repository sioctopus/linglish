<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="./js/auth-manager.js?v=2"></script>
<script src="./js/nav-back.js?v=1"></script>
  <script>
    // Filter noisy extension JSON.parse('undefined') errors (does not affect app logic)
    // IMPORTANT: This must be the first script to catch extension errors
    (function(){
      try {
        const patterns = [
          /\"undefined\" is not valid JSON/i,
          /\"null\" is not valid JSON/i,
          /Unexpected token 'u'.*JSON/i,
          /Unexpected token 'n'.*JSON/i,
          /SyntaxError.*undefined.*JSON/i,
          /SyntaxError.*null.*JSON/i,
          /JSON\.parse/i,
          /updateConfig/i,
          /initConfig/i,
          /metadata\.js/i,
          /content\.js/i,
          /iosMetadata\.js/i,
          /Wu\.updateConfig/i,
          /ul\.updateConfig/i,
          /cloudflareinsights/i,
          /beacon\.min\.js/i,
        ];
        const matchMsg = (msg) => {
          try { return patterns.some((re) => re.test(String(msg || ''))); } catch { return false; }
        };

        // Check if error is from extension (check stack trace)
        const isExtensionError = (error) => {
          try {
            if (!error) return false;
            const stack = error.stack || error.toString();
            const name = error.name || '';
            const message = error.message || '';

            // Check error message and name
            if (matchMsg(message) || matchMsg(name)) return true;

            // Check for common extension patterns
            if (/chrome-extension:\/\//i.test(stack)) return true;
            if (/moz-extension:\/\//i.test(stack)) return true;
            if (/safari-extension:\/\//i.test(stack)) return true;
            if (/webkit-masked-url:\/\//i.test(stack)) return true;
            if (/metadata\.js/i.test(stack)) return true;
            if (/content\.js/i.test(stack)) return true;
            if (/iosMetadata\.js/i.test(stack)) return true;
            if (/updateConfig|initConfig/i.test(stack)) return true;
            if (/Wu\.|ul\./i.test(stack)) return true;
            if (/cloudflare|beacon/i.test(stack)) return true;
            return false;
          } catch (_) {
            return false;
          }
        };

        // Override console methods
        const ce = console.error ? console.error.bind(console) : null;
        const cw = console.warn ? console.warn.bind(console) : null;
        if (ce) {
          console.error = function(...args){
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return ce(...args);
          };
        }
        if (cw) {
          console.warn = function(...args){
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return cw(...args);
          };
        }

        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', (ev) => {
          try {
            const reason = ev && ev.reason;
            if (reason && reason.name === 'SyntaxError') {
              const msg = reason.message || '';
              if (matchMsg(msg)) {
                ev.preventDefault();
                ev.stopPropagation();
                ev.stopImmediatePropagation();
                return;
              }
            }
            const msg = (reason && reason.message) || (reason && reason.toString && reason.toString()) || reason;
            if (matchMsg(String(msg||''))) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
            if (isExtensionError(reason)) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
          } catch(_) {}
        }, true);

        // Catch error events
        window.addEventListener('error', (ev) => {
          try {
            const msg = (ev && ev.message) || '';
            if (matchMsg(String(msg))) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
            if (ev && ev.error && isExtensionError(ev.error)) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
            const filename = (ev && ev.filename) || '';
            if (/chrome-extension|moz-extension|safari-extension|webkit-masked-url|metadata\.js|content\.js|iosMetadata\.js|^VM\d+:/i.test(filename)) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
          } catch(_) {}
        }, true);
      } catch (_) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>上传新视频 - linglish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/tokens.css?v=3">
  <link rel="stylesheet" href="./membership.css" />
  <script src="./i18n.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--lx-font-body);
      background: var(--lx-grad-hero);
      color: var(--lx-ink-900);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    .upload-container {
      background: #fff;
      border: 1px solid var(--lx-line);
      border-radius: 24px;
      box-shadow: 0 4px 90px rgba(0, 0, 0, 0.04);
      width: min(980px, 100%);
      margin: auto;
      overflow: visible;
    }

    .upload-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .header-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .upload-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--lx-teal-50);
      color: var(--lx-primary);
      display: grid;
      place-items: center;
      flex: none;
    }

    .header-copy {
      min-width: 0;
    }

    .upload-header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--lx-ink-900);
    }

    .upload-header p {
      margin-top: 2px;
      font-size: 0.82rem;
      line-height: 1.35;
      color: var(--lx-ink-500);
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    .back-btn,
    .lang-btn {
      background: #fff;
      color: var(--lx-ink-900);
      border: 1px solid var(--lx-line);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .back-btn:hover,
    .lang-btn:hover {
      border-color: var(--lx-teal-300);
      background: var(--lx-teal-50);
    }

    .lang-selector {
      position: relative;
    }

    .lang-dropdown {
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0;
      background: #fff;
      border: 1px solid var(--lx-line);
      border-radius: 12px;
      padding: 0.35rem;
      min-width: 132px;
      z-index: 20;
      box-shadow: var(--lx-shadow-lg);
    }

    .lang-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--lx-ink-900);
    }

    .lang-option:hover {
      background: var(--lx-teal-50);
    }

    .upload-form {
      padding: 12px 18px 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: 4px 22px;
      align-items: stretch;
    }

    .form-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .file-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label,
    .tag-selector-title {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--lx-ink-900);
      margin-bottom: 4px;
    }

    .form-group input[type="text"],
    .form-group select {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--lx-line);
      border-radius: 10px;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--lx-ink-900);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      background: var(--lx-paper);
    }

    .form-group input[type="text"]:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--lx-teal-600);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    .file-input-wrapper {
      position: relative;
      display: block;
      width: 100%;
      flex: 1;
      min-height: 92px;
      border: 1.5px dashed #99f6e4;
      border-radius: 14px;
      background: var(--lx-teal-50);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      overflow: hidden;
    }

    .file-input-wrapper:hover {
      border-color: var(--lx-teal-600);
      background: #ecfdf5;
    }

    .file-input-wrapper.drag-over {
      border-color: var(--lx-success);
      background: #e8f5e9;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-input-label {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 92px;
      height: 100%;
      text-align: left;
      padding: 8px 14px;
    }

    .file-input-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #fff;
      color: var(--lx-primary);
      display: grid;
      place-items: center;
      flex: none;
    }

    .file-input-icon svg {
      display: block;
    }

    .file-input-copy {
      min-width: 0;
    }

    .file-input-text {
      font-size: 0.92rem;
      color: var(--lx-primary);
      font-weight: 600;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 360px;
    }

    .file-input-hint {
      font-size: 0.75rem;
      color: var(--lx-ink-500);
      margin-top: 1px;
    }

    .file-selected {
      background: #e8f5e9;
      border-color: #4caf50;
    }

    .file-selected .file-input-icon {
      color: #4caf50;
    }

    .file-selected .file-input-text {
      color: #2e7d32;
    }

    .form-actions {
      display: flex;
      justify-content: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    .submit-btn {
      width: auto;
      min-width: 168px;
      margin: 0;
      padding: 0.68rem 1.6rem;
      border: none;
      border-radius: 999px;
      background: var(--lx-grad-fresh);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--lx-shadow-brand);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .submit-btn:disabled:hover {
      transform: none;
      box-shadow: none;
    }

    .status-message {
      margin-top: 8px;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .status-message.show {
      display: block;
      animation: fadeIn 0.3s;
    }

    .status-message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #4caf50;
    }

    .status-message.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #f44336;
    }

    .status-message.info {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #2196f3;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 标签选择器样式 */
    .tag-selector {
      margin-bottom: 10px;
    }

    .tag-selector-hint {
      font-size: 0.75rem;
      line-height: 1.4;
      color: var(--lx-ink-500);
      margin-bottom: 6px;
    }

    .tag-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-option {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 10px 0 8px;
      border: 1px solid var(--lx-line);
      border-radius: 999px;
      background: #fff;
      color: var(--lx-ink-700);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      font-size: 0.78rem;
      line-height: 1;
      user-select: none;
    }

    .tag-option:hover {
      border-color: var(--lx-teal-300);
      background: var(--lx-teal-50);
      color: var(--lx-primary);
    }

    .tag-option.selected {
      border-color: var(--lx-primary);
      background: var(--lx-primary);
      color: #fff;
    }

    .tag-option.default {
      border-color: #99f6e4;
      background: var(--lx-teal-50);
      color: var(--lx-primary);
    }

    .tag-option.default.selected,
    .tag-option.selected {
      background: var(--lx-primary);
      border-color: var(--lx-primary);
      color: #fff;
    }

    .tag-option .tag-icon {
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      flex: none;
    }

    .tag-option .tag-icon svg {
      display: block;
    }

    .tag-option .tag-name {
      font-weight: 600;
      white-space: nowrap;
    }

    .tag-scope {
      font-size: 0.72em;
      font-weight: 600;
      color: var(--lx-teal-600);
    }

    .tag-option.selected .tag-scope {
      color: rgba(255, 255, 255, 0.86);
    }

    .upload-limits {
      display: grid;
      gap: 6px;
      background: var(--lx-teal-50);
      border: 1px solid var(--lx-teal-100);
      border-left: 1px solid var(--lx-teal-100);
      border-radius: 14px;
      padding: 8px 10px 8px;
      margin-bottom: 10px;
    }

    .limit-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--lx-primary);
      margin: 0;
    }

    .limit-items {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .limit-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      padding: 6px 8px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid var(--lx-teal-100);
    }

    .limit-label {
      color: var(--lx-ink-500);
      font-size: 0.7rem;
      line-height: 1.3;
      white-space: nowrap;
    }

    .limit-value {
      font-weight: 700;
      color: var(--lx-ink-900);
      font-size: 0.84rem;
    }

    .limit-progress {
      margin-top: 0;
    }

    .limit-bar {
      height: 4px;
      background: var(--lx-teal-100);
    }

    @media (max-width: 860px) {
      .upload-container {
        border-radius: 18px;
      }

      .upload-header {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "icon title tools"
          "desc desc desc";
        align-items: center;
        column-gap: 8px;
        row-gap: 4px;
        padding: 10px 12px;
      }

      .header-main,
      .header-copy {
        display: contents;
      }

      .upload-icon {
        grid-area: icon;
        width: 36px;
        height: 36px;
      }

      .upload-header h1 {
        grid-area: title;
        font-size: 1.12rem;
      }

      .upload-header p {
        grid-area: desc;
        font-size: 0.75rem;
      }

      .header-tools {
        grid-area: tools;
        margin-left: 0;
      }

      .upload-form {
        padding: 8px 12px 10px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .form-group,
      .tag-selector {
        margin-bottom: 8px;
      }

      .file-input-wrapper,
      .file-input-label {
        min-height: 60px;
        height: 60px;
      }

      .file-input-text {
        max-width: 220px;
      }

      .limit-item {
        padding: 4px 6px;
      }
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <div class="upload-header">
      <div class="header-main">
        <div class="upload-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V6"></path>
            <path d="M8.5 9.5L12 6l3.5 3.5"></path>
            <path d="M5 19h14"></path>
          </svg>
        </div>
        <div class="header-copy">
          <h1 data-i18n="upload.title">上传新视频</h1>
          <p data-i18n="upload.description">上传视频文件，系统将自动生成字幕和转录文本</p>
        </div>
      </div>
      <div class="header-tools">
        <div class="lang-selector">
          <button type="button" id="lang-btn-upload" class="lang-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18"></path>
              <path d="M12 3c2.6 2.8 2.6 15.2 0 18"></path>
              <path d="M12 3c-2.6 2.8-2.6 15.2 0 18"></path>
            </svg>
            <span id="current-lang-upload">中文</span>
          </button>
          <div id="lang-dropdown-upload" class="lang-dropdown" style="display: none;">
            <div class="lang-option active" data-lang="zh">
              <span>🇨🇳</span>
              <span>中文</span>
            </div>
            <div class="lang-option" data-lang="en">
              <span>🇺🇸</span>
              <span>English</span>
            </div>
          </div>
        </div>
        <a href="#" class="back-btn" id="back-btn" title="返回">
          <span>← 返回</span>
        </a>
      </div>
    </div>

    <div class="upload-form">
      <form id="upload-form">
        <div class="form-grid">
          <div class="form-col">
            <div class="form-group">
              <label for="video-title" data-i18n="upload.title_label">视频标题</label>
              <input
                id="video-title"
                name="title"
                type="text"
                placeholder="例如：My listening video"
                data-i18n="upload.title_placeholder"
              />
            </div>

            <div class="form-group file-group">
              <label data-i18n="upload.file_label">选择视频文件</label>
              <div class="file-input-wrapper" id="file-input-wrapper">
                <input
                  id="video-file"
                  name="video"
                  type="file"
                  accept="video/*"
                  multiple
                  required
                />
                <div class="file-input-label" id="file-input-label">
                  <div class="file-input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                      <path d="M10 9.2v5.6l4.8-2.8L10 9.2z" fill="currentColor" stroke="none"></path>
                    </svg>
                  </div>
                  <div class="file-input-copy">
                    <div class="file-input-text" data-i18n="upload.select_file">点击或拖拽文件到这里</div>
                    <div class="file-input-hint" data-i18n="upload.file_help">支持 MP4, MOV, AVI 等格式</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="video-language">音频语言</label>
              <select id="video-language" name="language">
                <option value="en" selected>English (英语)</option>
                <option value="auto">Auto detect (自动检测)</option>
              </select>
            </div>
          </div>

          <div class="form-col">
            <div class="tag-selector">
              <label class="tag-selector-title">选择视频标签 <span style="color: #ef4444;">*</span></label>
              <div class="tag-selector-hint">请至少选择一个标签，方便分类和查找</div>
              <div class="tag-options" id="tag-options">
                <!-- 标签选项将由JavaScript动态生成 -->
              </div>
            </div>

            <div class="form-group">
              <label for="collection-name">合集（可选）</label>
              <input
                id="collection-name"
                name="collection_name"
                type="text"
                maxlength="120"
                placeholder="例如：小猪佩奇 / Friends S01"
              />
              <div class="tag-selector-hint" style="margin-top: 4px; margin-bottom: 0;">同一系列的多集视频可以归到同一个合集里</div>
            </div>

            <div class="form-group">
              <label>难度级别</label>
              <div class="tag-selector-hint" style="margin-bottom: 0;">不用自己选。字幕识别完成后，系统按用词和句子自动标成 A1、A2、B1、B2、C1 或 C2。</div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-btn" id="submit-btn">
            <span id="btn-text" data-i18n="upload.submit">上传并转录</span>
          </button>
        </div>

        <div class="status-message" id="status-message"></div>
      </form>
    </div>
  </div>

  <script src="./membership.js"></script>
  <script src="./guest-check.js"></script>
  <script src="./auth-helpers.js"></script>
  <script src="./video-tag-system.js?v=20251223"></script>
  <script>
    // 智能返回导航
    function setupBackButton() {
      const backBtn = document.getElementById('back-btn');
      if (!backBtn) return;

      backBtn.addEventListener('click', (e) => {
        e.preventDefault();

        // 检测来源页面
        const referrer = document.referrer || '';
        const isDesktopReferrer = referrer.includes('index-desktop.html') || referrer.includes('video-reader-desktop.html');
        const isMobileReferrer = referrer.includes('mobile-') || (referrer.includes('index.html') && !isDesktopReferrer);

        // 如果有历史记录且来自本站，使用 history.back()
        if (window.history.length > 1 && referrer.includes(window.location.host)) {
          window.history.back();
        } else {
          // 否则根据referrer或设备类型智能跳转
          if (isMobileReferrer) {
            window.location.href = './mobile-explore.html';
          } else if (isDesktopReferrer) {
            window.location.href = './index-desktop.html';
          } else {
            // 默认根据视口宽度判断
            const isMobileViewport = window.innerWidth <= 768;
            window.location.href = isMobileViewport ? './mobile-explore.html' : './index-desktop.html';
          }
        }
      });
    }

    let serverMembershipSynced = false;

    function getFreeMembershipInfo() {
      const freeFeatures = membershipSystem.getFeaturesByTier('free');
      return { tier: 'free', name: freeFeatures.name, icon: freeFeatures.icon, ...freeFeatures };
    }

    function getTrustedMembershipInfo() {
      const membershipInfo = membershipSystem.getMembershipInfo();
      if (!serverMembershipSynced && membershipInfo.tier !== 'free') {
        return getFreeMembershipInfo();
      }
      return membershipInfo;
    }

    async function syncMembershipFromServer() {
      try {
        const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || localStorage.getItem('linglish_token') || sessionStorage.getItem('linglish_token');
        if (!token) return;
        const res = await fetch(`${API_BASE}/users/me`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) return;
        const me = await res.json();
        const raw = (me.entitlement?.effective_tier || me.membership_type || '').toLowerCase();
        const tier = raw === 'pro'
          ? 'vip'
          : (raw === 'family'
            ? 'family'
            : (raw === 'svip'
              ? 'svip'
              : (raw === 'vip' ? 'vip' : 'free')));
        const features = membershipSystem.getFeaturesByTier(tier);
        membershipSystem.data.tier = tier;
        membershipSystem.data.features = features;
        membershipSystem.data.expiryDate = me.membership_expires_at || null;
        membershipSystem.saveData();
        serverMembershipSynced = true;
      } catch (_) {}
    }

    // ===== 标签选择功能 =====
    const selectedTags = new Set();
    let serverTagLoadOk = false;

    const FILE_MARK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9.2v5.6l4.8-2.8L10 9.2z" fill="currentColor" stroke="none"></path></svg>';
    const CHECK_MARK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';

    function tagMark(tag) {
      const name = String(tag.name || tag.displayName || '').trim();
      const icons = {
        '我的': '<path d="M12 4.2l1.7 3.5 3.8.5-2.8 2.7.7 3.8L12 13.1 8.6 14.7l.7-3.8L6.5 8.2l3.8-.5L12 4.2z"/>',
        '亲子': '<circle cx="9" cy="8" r="2.1"/><circle cx="15.5" cy="9.2" r="1.6"/><path d="M4.5 18.4c.6-2.6 2.4-4 4.5-4s3.9 1.4 4.5 4"/><path d="M13.4 15c.7-.5 1.6-.8 2.5-.8 1.7 0 3 1.1 3.6 3"/>',
        '故事': '<path d="M5 6h6a2 2 0 0 1 2 2v10H7.2A2.2 2.2 0 0 0 5 15.8V6z"/><path d="M13 8h6v10h-6"/><path d="M8 9.5h3"/>',
        '影视': '<rect x="3.5" y="7" width="17" height="11" rx="2"/><path d="M8 7V5M12 7V5M16 7V5M8 18v1.5M16 18v1.5"/>',
        '校园': '<path d="M4 10.5L12 6l8 4.5-8 4.5-8-4.5z"/><path d="M8 12.8V17c1.2 1 2.6 1.5 4 1.5s2.8-.5 4-1.5v-4.2"/><path d="M20 10.5V16"/>',
        '课程': '<path d="M4 8h16v9.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><path d="M4 8l8 4 8-4"/><path d="M12 12v7.5"/>',
        '购物': '<path d="M6 7h15l-1.6 8.2H8.2L6 7z"/><path d="M6 7L5 4H3"/><circle cx="9" cy="18.5" r="1.3"/><circle cx="17" cy="18.5" r="1.3"/>',
        '职场': '<rect x="3.5" y="8" width="17" height="11" rx="2"/><path d="M9 8V6.2A1.2 1.2 0 0 1 10.2 5h3.6A1.2 1.2 0 0 1 15 6.2V8"/><path d="M3.5 13h17"/>',
        '动画': '<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M10.5 9.2v5.6l5-2.8-5-2.8z" fill="currentColor" stroke="none"/>',
        '演讲': '<rect x="9" y="3.5" width="6" height="9.5" rx="3"/><path d="M6.5 11a5.5 5.5 0 0 0 11 0"/><path d="M12 16.5V20M9 20h6"/>',
        '生活': '<path d="M4 11.2L12 4.5l8 6.7"/><path d="M7 10.5V19h10v-8.5"/><path d="M11 19v-4h2v4"/>',
        '动物': '<circle cx="8" cy="7.5" r="2"/><circle cx="16" cy="7.5" r="2"/><circle cx="5.2" cy="12" r="1.7"/><circle cx="18.8" cy="12" r="1.7"/><ellipse cx="12" cy="14.5" rx="3.2" ry="2.6"/>',
        '儿童': '<circle cx="12" cy="8" r="2.6"/><path d="M6.8 18.8c.7-3 2.6-4.6 5.2-4.6s4.5 1.6 5.2 4.6"/>'
      };
      const body = icons[name] || '<circle cx="12" cy="12" r="3"/><path d="M12 5v2M12 17v2M5 12h2M17 12h2"/>';
      return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
    }

    // 渲染标签选项
    function renderTagOptions() {
      const tagOptionsContainer = document.getElementById('tag-options');
      if (!tagOptionsContainer || typeof VideoTagSystem === 'undefined') return;

      const tagSystem = window.VideoTagSystem;

      // 优先使用服务器返回的标签（与网络上传一致），失败则回退到预设标签
      const allTags = (() => {
        try {
          const globals = Array.isArray(tagSystem?.serverCache?.globalTags) ? tagSystem.serverCache.globalTags.map(t => ({ ...t, scope: 'global' })) : [];
          const personals = (typeof tagSystem.getCustomTags === 'function') ? tagSystem.getCustomTags() : [];
          const merged = [...globals, ...personals];
          if (merged.length) return merged;
        } catch (_) {}
        return tagSystem.getVisibleTags ? tagSystem.getVisibleTags() : tagSystem.getAllTags();
      })();

      tagOptionsContainer.innerHTML = '';
      selectedTags.clear();

      allTags.forEach(tag => {
        const tagOption = document.createElement('div');
        tagOption.className = 'tag-option';
        tagOption.dataset.tagId = tag.id;

        // "我的"标签默认选中（兼容 name='我的'）
        const isMyTag = tag.name === '我的';
        if (isMyTag) {
          tagOption.classList.add('default', 'selected');
          selectedTags.add(String(tag.id));
        }

        // 个人标签添加特殊样式
        const isPersonal = (tag.scope || '').startsWith('user');
        const scopeLabel = isPersonal ? ' <span class="tag-scope">(我的)</span>' : '';

        tagOption.innerHTML = `
          <span class="tag-icon">${tagMark(tag)}</span>
          <span class="tag-name">${tag.displayName || tag.name}${scopeLabel}</span>
        `;

        // 点击切换选中状态
        tagOption.addEventListener('click', () => {
          const tagId = String(tag.id);
          if (selectedTags.has(tagId)) {
            selectedTags.delete(tagId);
            tagOption.classList.remove('selected');
          } else {
            selectedTags.add(tagId);
            tagOption.classList.add('selected');
          }
        });

        tagOptionsContainer.appendChild(tagOption);
      });
    }

    // 获取选中的标签ID数组
    function getSelectedTagIds() {
      return Array.from(selectedTags);
    }

    // 保存视频标签
    async function saveVideoTags(videoId) {
      if (!videoId || typeof VideoTagSystem === 'undefined') return;

      const tagSystem = window.VideoTagSystem;
      const tagIds = getSelectedTagIds();

      // 设置视频的所有标签
      tagSystem.setVideoTags(videoId, tagIds);
      console.log(`[视频上传] 已为视频 ${videoId} 添加标签:`, tagIds);

      // 同步到服务器（用于其它页面/设备展示与筛选）
      try {
        if (!token) return;
        const globalTagIds = [];
        const userTagIds = [];
        tagIds.forEach((tid) => {
          const sid = String(tid);
          if (sid.startsWith('u:')) {
            const num = Number(sid.slice(2));
            if (Number.isInteger(num) && num > 0) userTagIds.push(num);
            return;
          }
          if (/^\d+$/.test(sid)) {
            globalTagIds.push(Number(sid));
            return;
          }
          const resolved = (typeof tagSystem.getNumericId === 'function') ? tagSystem.getNumericId(sid) : null;
          if (Number.isInteger(resolved) && resolved > 0) globalTagIds.push(resolved);
        });

        const uniq = (arr) => Array.from(new Set(arr));
        const payload = {
          global_tag_ids: uniq(globalTagIds),
          user_tag_ids: uniq(userTagIds),
        };

        const base = API_BASE || '';
        const url = base ? `${base}/videos/${encodeURIComponent(String(videoId))}/tags` : `/videos/${encodeURIComponent(String(videoId))}/tags`;
        const resp = await fetch(url, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) {
          const text = await resp.text().catch(() => '');
          console.warn('[视频上传] 同步标签到服务器失败:', resp.status, text);
        } else {
          console.log('[视频上传] 标签已同步到服务器', payload);
        }
      } catch (e) {
        console.warn('[视频上传] 同步标签到服务器异常:', e);
      }
    }

    // 初始化返回按钮
    setupBackButton();

    // 初始化标签选择器（从服务器加载全局标签 + 个人标签）
    async function initTagSystem() {
      if (typeof VideoTagSystem === 'undefined') {
        console.warn('[视频上传] VideoTagSystem 未加载');
        return;
      }

      const tagSystem = window.VideoTagSystem;
      const token = localStorage.getItem('linglish_token');

      // 从服务器加载标签
      if (token) {
        try {
          serverTagLoadOk = await tagSystem.loadFromServer('', token);
          console.log('[视频上传] 标签已从服务器同步');
        } catch (e) {
          console.warn('[视频上传] 从服务器加载标签失败:', e);
          serverTagLoadOk = false;
        }
      }

      renderTagOptions();
    }

    initTagSystem();

    // 初始化多语言
    if (typeof i18n !== 'undefined') {
      i18n.init();

      // 设置语言选择器
      const currentLangEl = document.getElementById('current-lang-upload');
      const langBtn = document.getElementById('lang-btn-upload');
      const langDropdown = document.getElementById('lang-dropdown-upload');
      const langNames = { zh: '中文', en: 'English' };

      if (currentLangEl) {
        currentLangEl.textContent = langNames[i18n.currentLang] || '中文';
      }

      langBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        if (langDropdown) {
          langDropdown.style.display = langDropdown.style.display === 'none' ? 'block' : 'none';
        }
      });

      document.addEventListener('click', () => {
        if (langDropdown) langDropdown.style.display = 'none';
      });

      langDropdown?.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      document.querySelectorAll('#lang-dropdown-upload .lang-option').forEach(option => {
        option.addEventListener('click', () => {
          const lang = option.dataset.lang;
          if (lang) {
            i18n.setLang(lang);
            if (currentLangEl) {
              currentLangEl.textContent = langNames[lang] || lang;
            }
            document.querySelectorAll('#lang-dropdown-upload .lang-option').forEach(opt => {
              const isActive = opt.dataset.lang === lang;
              opt.classList.toggle('active', isActive);
              opt.style.background = isActive ? '#0f766e' : '';
              opt.style.color = isActive ? 'white' : '';
            });
            if (langDropdown) langDropdown.style.display = 'none';
          }
        });
      });

      document.querySelectorAll('#lang-dropdown-upload .lang-option').forEach(opt => {
        const isActive = opt.dataset.lang === i18n.currentLang;
        opt.classList.toggle('active', isActive);
        opt.style.background = isActive ? '#0f766e' : '';
        opt.style.color = isActive ? 'white' : '';
      });
    }

    const API_BASE = (() => {
      const { protocol, hostname, port } = window.location;
      if (protocol === 'file:') {
        return 'http://localhost:8000';
      }
      if (hostname === 'localhost' || hostname === '127.0.0.1') {
        const resolvedPort = port || '8000';
        return `${protocol}//${hostname}:${resolvedPort}`;
      }
      return '';
    })();
    // Allow overriding upload origin to bypass CDN/proxy caps (set localStorage 'linglish_upload_base' or window.UPLOAD_API_BASE)
    const UPLOAD_API_BASE = (() => {
      try {
        const override = window.UPLOAD_API_BASE || localStorage.getItem('linglish_upload_base');
        if (override && /^https?:\/\//i.test(override)) return override.replace(/\/$/, '');
      } catch (_) {}
      return API_BASE;
    })();

    // 获取token（桌面版使用 linglish_token，移动版使用 authToken）
    const token = localStorage.getItem('linglish_token') ||
                  sessionStorage.getItem('linglish_token') ||
                  localStorage.getItem('authToken') ||
                  sessionStorage.getItem('authToken');

    // 检查是否为游客
    const isGuest = localStorage.getItem('is_guest') === 'true' ||
                    sessionStorage.getItem('is_guest') === 'true' ||
                    sessionStorage.getItem('isGuest') === 'true';

    // 游客不能上传视频
    if (isGuest) {
      const message = (typeof i18n !== 'undefined' && i18n.currentLang === 'en')
        ? 'Guest users cannot upload videos. Please register for a full account.'
        : '游客模式下无法上传视频\n\n请注册正式账号以使用上传功能';
      alert(message);
      // 根据视口宽度或来源页面判断应该跳转到移动端还是桌面端
      const referrer = document.referrer || '';
      const isMobileReferrer = referrer.includes('mobile-');
      const isMobileViewport = window.innerWidth <= 768;
      const redirectUrl = (isMobileReferrer || isMobileViewport) ? './mobile-auth.html' : './index-desktop.html';
      window.location.href = redirectUrl;
    }

    // 检查登录状态
    if (!token) {
      alert('请先登录');
      window.location.href = './index.html';
    }

    const uploadForm = document.getElementById('upload-form');
    const statusMessage = document.getElementById('status-message');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const fileInput = document.getElementById('video-file');
    const fileInputWrapper = document.getElementById('file-input-wrapper');
    const fileInputLabel = document.getElementById('file-input-label');

    // 显示会员限制信息
    async function showMembershipLimits() {
      const membershipInfo = getTrustedMembershipInfo();

      // 获取当前视频数量（按用户）
      currentVideoCount = 0;
      try {
        // 当前用户
        let me = null;
        try {
          const meRes = await fetch(`${API_BASE}/users/me`, { headers: { 'Authorization': `Bearer ${token}` } });
          if (meRes.ok) me = await meRes.json();
        } catch(_) {}
        const myId = me?.id ?? me?.user_id ?? null;
        const myEmail = me?.email || null;

        // 仅本人视频（若接口支持），否则前端过滤
        let response = await fetch(`${API_BASE}/video-resources?lite=1&mine=1`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!response.ok) {
          response = await fetch(`${API_BASE}/video-resources?lite=1`, { headers: { 'Authorization': `Bearer ${token}` } });
        }
        const data = await response.json().catch(()=>({ items: [] }));
        const items = Array.isArray(data?.items) ? data.items : [];
        const ownerKeys = ['user_id','owner_user_id','owner_id','uid','userId','ownerId'];
        const belongsToMe = (item) => {
          try {
            if (myId != null) {
              for (const k of ownerKeys) if (Number(item?.[k]) === Number(myId)) return true;
              if (Number(item?.user?.id) === Number(myId)) return true;
              if (Number(item?.owner?.id) === Number(myId)) return true;
            }
            if (myEmail) {
              const e = String(item?.user?.email || item?.owner?.email || item?.email || '').toLowerCase();
              if (e && e === String(myEmail).toLowerCase()) return true;
            }
          } catch(_) {}
          // 如果使用了 mine=1，默认就是本人
          return String(response.url||'').includes('mine=1');
        };
        currentVideoCount = items.filter(belongsToMe).length;
      } catch (err) {
        console.error('Failed to load video count:', err);
      }

      // 在表单上方插入限制信息
      const t = (key) => typeof i18n !== 'undefined' ? i18n.t(key) : key;
      const limitsDiv = document.createElement('div');
      limitsDiv.className = 'upload-limits';
      const tierName = membershipInfo.name || (membershipInfo.tier || '').toUpperCase() || t('upload.free_member');
      limitsDiv.innerHTML = `
        <div class="limit-title">📊 ${tierName} ${t('upload.free_limit')}</div>
        <div class="limit-items">
          <div class="limit-item">
            <span class="limit-label">${t('upload.uploaded_videos')}</span>
            <span class="limit-value ${currentVideoCount >= membershipInfo.maxVideos ? 'warning' : ''}">
              ${currentVideoCount} / ${membershipInfo.maxVideos === Infinity ? '∞' : membershipInfo.maxVideos}
            </span>
          </div>
          <div class="limit-item">
            <span class="limit-label">${t('upload.video_size')}</span>
            <span class="limit-value">${t('upload.max')} ${membershipInfo.maxVideoSize === Infinity ? '∞' : membershipInfo.maxVideoSize + 'MB'}</span>
          </div>
          <div class="limit-item">
            <span class="limit-label">${t('upload.storage_time')}</span>
            <span class="limit-value">${membershipInfo.videoDuration === Infinity ? t('upload.forever') : membershipInfo.videoDuration + t('upload.days')}</span>
          </div>
        </div>
        <div class="limit-progress">
          <div class="limit-bar">
            <div class="limit-fill ${currentVideoCount >= membershipInfo.maxVideos ? 'danger' : (currentVideoCount >= membershipInfo.maxVideos * 0.8 ? 'warning' : '')}" style="width: ${Math.min(100, (currentVideoCount / membershipInfo.maxVideos) * 100)}%;"></div>
          </div>
        </div>
      `;

      const formContainer = document.querySelector('.upload-form');
      formContainer.insertBefore(limitsDiv, uploadForm);

      // 如果已达上限，显示升级按钮
      if (currentVideoCount >= membershipInfo.maxVideos) {
        const promptMsg = (typeof i18n !== 'undefined' && i18n.currentLang === 'en')
          ? 'Upload limit reached. Upgrade to VIP for more space!'
          : '已达到上传数量上限，升级VIP解锁更多空间！';
        const btnTextI18n = (typeof i18n !== 'undefined') ? i18n.t('upload.upgrade_vip') : '升级 VIP';
        const upgradeDiv = document.createElement('div');
        upgradeDiv.innerHTML = `
          <div style="text-align: center; margin: 1rem 0;">
            <button class="upgrade-btn primary" onclick="window.location.href = (window.i18n && i18n.currentLang && i18n.currentLang.startsWith('en') ? './membership-en.html?from=upload' : './membership.html?from=upload')">
              ⬆️ ${btnTextI18n}
            </button>
          </div>
        `;
        limitsDiv.appendChild(upgradeDiv);
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.5';
      }
    }

    // 同步服务器会员状态后再展示限制
    syncMembershipFromServer().then(() => showMembershipLimits());

    // 全局计数（供提交/校验使用）
    let currentVideoCount = 0;

    // 文件选择处理
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) {
        fileInputWrapper.classList.remove('file-selected');
        fileInputLabel.innerHTML = `
          <div class="file-input-icon">${FILE_MARK}</div>
          <div class="file-input-copy">
            <div class="file-input-text">点击或拖拽文件到这里</div>
            <div class="file-input-hint">支持 MP4, MOV, AVI 等格式</div>
          </div>
        `;
        return;
      }

      // 检查会员限制
      const membershipInfo = getTrustedMembershipInfo();
      const maxSizeMB = membershipInfo.maxVideoSize;
      const oversize = files.find(f => {
        const fileSizeMB = f.size / (1024 * 1024);
        return maxSizeMB !== Infinity && fileSizeMB > maxSizeMB;
      });

      if (oversize) {
        const fileSizeMB = oversize.size / (1024 * 1024);
        showStatus(`文件太大！${membershipInfo.name}单个视频最大${maxSizeMB}MB`, 'error');
        membershipSystem.showUpgradePrompt(`文件大小${fileSizeMB.toFixed(1)}MB超出限制，升级可提升容量！`);
        fileInput.value = '';
        fileInputWrapper.classList.remove('file-selected');
        fileInputLabel.innerHTML = `
          <div class="file-input-icon">${FILE_MARK}</div>
          <div class="file-input-copy">
            <div class="file-input-text">点击或拖拽文件到这里</div>
            <div class="file-input-hint">支持 MP4, MOV, AVI 等格式</div>
          </div>
        `;
        return;
      }

      fileInputWrapper.classList.add('file-selected');
      if (files.length === 1) {
        const file = files[0];
        const fileSizeMB = file.size / (1024 * 1024);
        fileInputLabel.innerHTML = `
          <div class="file-input-icon">${CHECK_MARK}</div>
          <div class="file-input-copy">
            <div class="file-input-text">${file.name}</div>
            <div class="file-input-hint">${fileSizeMB.toFixed(2)} MB</div>
          </div>
        `;
      } else {
        const totalMB = files.reduce((sum, f) => sum + f.size, 0) / (1024 * 1024);
        fileInputLabel.innerHTML = `
          <div class="file-input-icon">${CHECK_MARK}</div>
          <div class="file-input-copy">
            <div class="file-input-text">已选择 ${files.length} 个文件</div>
            <div class="file-input-hint">合计 ${totalMB.toFixed(2)} MB</div>
          </div>
        `;
      }
    });

    // 拖拽上传
    fileInputWrapper.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileInputWrapper.classList.add('drag-over');
    });

    fileInputWrapper.addEventListener('dragleave', () => {
      fileInputWrapper.classList.remove('drag-over');
    });

    fileInputWrapper.addEventListener('drop', (e) => {
      e.preventDefault();
      fileInputWrapper.classList.remove('drag-over');

      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files;
        const event = new Event('change');
        fileInput.dispatchEvent(event);
      }
    });

    // 显示状态消息
    function showStatus(message, type = 'info') {
      statusMessage.textContent = message;
      statusMessage.className = `status-message show ${type}`;
      setTimeout(() => {
        statusMessage.classList.remove('show');
      }, 5000);
    }

    // XHR-based uploader with progress + stall detection.
    // Bare fetch() gives no progress on mobile/tablet (a frozen spinner during a
    // slow upload is indistinguishable from a dead connection), and no way to
    // abort a stalled connection. XHR fixes both. Returns a fetch-Response-like
    // object: { status, ok, contentType, text() } so downstream parsing is unchanged.
    // A stall is "no bytes moved for STALL_MS" — this catches dropped connections
    // without killing legitimately slow-but-progressing large uploads.
    function xhrUpload(url, formData, token, onProgress) {
      const STALL_MS = 60000; // abort if upload makes no progress for 60s
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        let lastMovement = Date.now();
        const stallTimer = setInterval(() => {
          if (Date.now() - lastMovement > STALL_MS) {
            clearInterval(stallTimer);
            try { xhr.abort(); } catch (_) {}
          }
        }, 5000);
        const done = () => clearInterval(stallTimer);

        xhr.open('POST', url, true);
        xhr.setRequestHeader('Authorization', `Bearer ${token}`);

        xhr.upload.onprogress = (e) => {
          lastMovement = Date.now();
          if (e.lengthComputable && typeof onProgress === 'function') {
            onProgress(Math.round((e.loaded / e.total) * 100));
          }
        };
        xhr.onload = () => {
          done();
          const contentType = xhr.getResponseHeader('content-type') || '';
          const text = xhr.responseText || '';
          resolve({
            status: xhr.status,
            ok: xhr.status >= 200 && xhr.status < 300,
            contentType,
            text: () => text,
          });
        };
        xhr.onerror = () => { done(); const err = new Error('NETWORK_ERROR'); err.code = 'NETWORK_ERROR'; reject(err); };
        xhr.onabort = () => { done(); const err = new Error('UPLOAD_STALLED'); err.code = 'UPLOAD_STALLED'; reject(err); };
        xhr.ontimeout = () => { done(); const err = new Error('UPLOAD_STALLED'); err.code = 'UPLOAD_STALLED'; reject(err); };

        xhr.send(formData);
      });
    }

    // 获取选中的标签名称（而不是ID）
    function getSelectedTagNames() {
      if (typeof VideoTagSystem === 'undefined') return [];
      const tagSystem = window.VideoTagSystem;
      const tagIds = getSelectedTagIds();
      return tagIds.map(tagId => {
        const tag = tagSystem.getTagById(tagId);
        return tag ? tag.name : null;
      }).filter(Boolean);
    }

    // 表单提交处理
    uploadForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const t = (key) => typeof i18n !== 'undefined' ? i18n.t(key) : key;
      const files = Array.from(fileInput.files || []);
      if (!files.length) { showStatus(t('upload.select_file_error'), 'error'); return; }

      const tagNames = getSelectedTagNames();

      // 验证：必须至少选择一个标签
      if (!tagNames.length) {
        showStatus('请至少选择一个视频标签', 'error');
        document.getElementById('tag-options')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const membershipInfo = getTrustedMembershipInfo();

      // 数量限制
      // 防御：如果 currentVideoCount 尚未加载，按 0 计算
      let slots = membershipInfo.maxVideos - (typeof currentVideoCount === 'number' ? currentVideoCount : 0);
      if (slots <= 0) {
        showStatus(`已达上限：${membershipInfo.name}最多上传${membershipInfo.maxVideos}个视频`, 'error');
        return;
      }
      if (files.length > slots) {
        showStatus(`只能再上传 ${slots} 个视频，本次仅处理前 ${slots} 个`, 'warn');
        files.splice(slots);
      }

      // 单文件大小预检
      const oversize = files.find(f => {
        const sizeMB = f.size / (1024 * 1024);
        return membershipInfo.maxVideoSize !== Infinity && sizeMB > membershipInfo.maxVideoSize;
      });
      if (oversize) {
        showStatus(`文件太大！${membershipInfo.name}单个视频最大${membershipInfo.maxVideoSize}MB`, 'error');
        return;
      }

      submitBtn.disabled = true;
      btnText.innerHTML = `<span class="loading-spinner"></span>${t('upload.uploading')}`;

      const uploadedIds = [];
      try {
        for (let idx = 0; idx < files.length; idx++) {
          const file = files[idx];
          const formData = new FormData(uploadForm);
          formData.set('video', file);
          // 批量时自动用文件名；单个时为空也允许
          if ((!formData.get('title') || String(formData.get('title')).trim() === '') ) {
            formData.set('title', file.name.replace(/\.[^.]+$/, '') || `视频${idx + 1}`);
          }
          if (tagNames.length > 0) formData.set('tags', JSON.stringify(tagNames));
          formData.delete('difficulty_level');

          // Multi-file batch: show which file. Single file: no prefix.
          const filePrefix = files.length > 1 ? `(${idx + 1}/${files.length}) ` : '';
          const onProgress = (pct) => {
            btnText.innerHTML = `<span class="loading-spinner"></span>${filePrefix}${t('upload.uploading')} ${pct}%`;
          };

          // One automatic retry on transient network failure / stall. A real
          // dropped connection or a brief mobile-radio glitch shouldn't require
          // the user to re-pick the file and start over.
          let response;
          let attempt = 0;
          while (true) {
            try {
              response = await xhrUpload(`${UPLOAD_API_BASE}/video-resources/upload`, formData, token, onProgress);
              break;
            } catch (netErr) {
              attempt++;
              if (attempt >= 2) {
                const lang = (typeof i18n !== 'undefined' ? i18n.currentLang : (navigator.language || 'zh')).toLowerCase();
                const isEn = lang.startsWith('en');
                throw new Error(netErr.code === 'UPLOAD_STALLED'
                  ? (isEn ? 'Upload stalled — please check your connection and retry' : '上传停滞，请检查网络后重试')
                  : (isEn ? 'Network error during upload — please retry' : '网络中断，上传失败，请重试'));
              }
              onProgress(0);
              btnText.innerHTML = `<span class="loading-spinner"></span>${filePrefix}${t('upload.uploading')}…`;
              await new Promise(r => setTimeout(r, 1500 * attempt));
            }
          }

          if (response.status === 401) throw new Error(t('upload.login_expired'));

          let result;
          const ct = response.contentType || '';
          const rawText = response.text();
          if (ct.includes('application/json')) {
            try { result = JSON.parse(rawText); } catch (_) { result = { message: rawText }; }
          } else {
            try { result = JSON.parse(rawText); } catch (_) { result = { message: rawText && rawText.slice ? rawText.slice(0, 200) : 'Unexpected response' }; }
          }

          if (!response.ok) {
            console.warn('[Upload] HTTP error', response.status, 'payload:', result);
            const tx = (key, zh, en) => {
              try { if (typeof i18n !== 'undefined') { const txt = i18n.t(key); if (txt && txt !== key) return txt; } } catch (_) {}
              const lang = (typeof i18n !== 'undefined' ? i18n.currentLang : (navigator.language || 'zh')).toLowerCase();
              return lang.startsWith('en') ? (en || key) : (zh || key);
            };
            let msg = result.message || '';
            const isHtml = (ct).includes('text/html') || /^\s*<!DOCTYPE/i.test(msg);
            if (response.status === 429) {
              const retryAfter = Number(result.retryAfter) || 0;
              const mins = retryAfter > 0 ? Math.ceil(retryAfter / 60) : 0;
              msg = mins > 0
                ? tx('upload.rate_limited', `上传太频繁，请约 ${mins} 分钟后再试`, `Too many uploads. Please try again in about ${mins} min`)
                : tx('upload.rate_limited_generic', '上传太频繁，请稍后再试', 'Too many uploads. Please wait a moment and retry');
            } else if (response.status === 413) {
              if (msg === 'PROXY_UPLOAD_LIMIT') msg = tx('upload.proxy_limit', '上传被中断：可能超过服务器网关限制，请尝试更小的文件或压缩后再试', 'Upload interrupted by gateway size limit. Try a smaller file or compress it');
              else msg = tx('upload.file_too_large', '文件过大，超出服务器限制', 'File too large (server limit)');
            } else if (response.status === 408) {
              msg = tx('upload.aborted', '上传中断，请检查网络后重试', 'Upload aborted. Please retry');
            } else if (response.status === 403) {
              const isBan = /ban/i.test(msg || '');
              msg = isBan
                ? tx('auth.banned', '账户已封禁，请联系管理员', 'Your account has been banned. Please contact support')
                : tx('auth.forbidden', '权限不足或登录状态失效，请重新登录后再试', 'Permission denied or session expired. Please re-login.');
              if (isBan) {
                alert(msg);
                try { localStorage.removeItem('linglish_token'); sessionStorage.removeItem('linglish_token'); } catch (_) {}
                setTimeout(() => { window.location.href = './index.html'; }, 800);
              }
            } else if (response.status >= 500 || isHtml) {
              msg = tx('upload.proxy_limit', '上传被中断：可能超过服务器网关限制，请尝试更小的文件或压缩后再试', 'Upload interrupted by gateway size limit. Try a smaller file or compress it');
            }
            throw new Error(msg || tx('upload.upload_failed', '上传失败', 'Upload failed'));
          }

          const vid = result?.video?.id || result?.id;
          if (vid) {
            const videoMetadata = {
              title: formData.get('title'),
              size: file.size,
              duration: 0,
              language: formData.get('language')
            };
            videoManagementSystem.addVideo(vid, videoMetadata);
            await saveVideoTags(vid);
            uploadedIds.push(vid);
          }
          currentVideoCount += 1;
        }

        uploadForm.reset();
        fileInputWrapper.classList.remove('file-selected');
        fileInputLabel.innerHTML = `
          <div class="file-input-icon">${FILE_MARK}</div>
          <div class="file-input-copy">
            <div class="file-input-text">点击或拖拽文件到这里</div>
            <div class="file-input-hint">支持 MP4, MOV, AVI 等格式</div>
          </div>
        `;

        if (uploadedIds.length === 1) {
          const targetId = String(uploadedIds[0]);
          setTimeout(() => {
            const url = targetId ? `./video-reader.html?videoId=${encodeURIComponent(targetId)}` : './video-reader.html';
            window.location.href = url;
          }, 1200);
        } else if (uploadedIds.length > 1) {
          showStatus('批量上传完成，正在刷新列表', 'success');
          setTimeout(() => { window.location.href = './index-desktop.html'; }, 1000);
        }
      } catch (err) {
        console.error('Upload failed:', err);
        showStatus(err.message || '上传失败，请重试', 'error');
        // 如果是权限/禁用错误，尝试刷新登录状态
        if (/banned|permission denied|forbidden/i.test(String(err && err.message))) {
          try { localStorage.removeItem('linglish_token'); sessionStorage.removeItem('linglish_token'); } catch (_) {}
        }
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = '上传并转录';
      }
    });
  </script>
  <script src="./js/page-tracker.js"></script>
</body>
</html>
