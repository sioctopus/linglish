<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>导入学习文档 — Linglish</title>
  <link rel="icon" href="/linglish-favicon.svg?v=4" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/tokens.css?v=1">
  <link rel="stylesheet" href="./styles/speak-ui.css?v=3">
  <link rel="stylesheet" href="./styles/icons.css?v=1">
  <style>
    body {
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      font-family: Manrope, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .nav {
      max-width: 1180px;
      margin: 16px auto 0;
      padding: 6px 16px;
      height: 68px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-radius: 999px;
      box-shadow: 0 4px 90px rgba(0, 0, 0, 0.04);
    }
    .brand {
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      font-size: 18px;
    }
    .nav a.back {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }
    .page-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 40px;
      font-weight: 600;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 14px 0 8px;
    }
    .title-row label {
      margin: 0;
    }
    .title-row h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }
    .tip {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
    }
    .tip-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #0f766e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: none;
    }
    .tip-btn:hover,
    .tip-btn[aria-expanded="true"] {
      background: transparent;
      color: #0b5f59;
    }
    .tip-btn .lx-icon {
      width: 16px;
      height: 16px;
    }
    .tip-panel {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(320px, calc(100vw - 40px));
      padding: 12px 14px;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.55;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
      text-align: center;
    }
    .tip-panel[hidden] {
      display: none !important;
    }
    .page-head .tip-panel {
      left: auto;
      right: 0;
      transform: none;
      text-align: center;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
      gap: 16px;
      align-items: stretch;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
    }
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-size: 16px;
      color: #0f172a;
      background: #fff;
    }
    textarea { min-height: 100px; resize: vertical; }
    .hint { margin: 0; color: #64748b; font-size: 14px; line-height: 20px; }
    .actions { margin-top: 16px; }
    button.btn-primary {
      border: 0;
      cursor: pointer;
      min-height: 48px;
      padding: 0 22px;
      color: #fff;
      font: inherit;
      font-weight: 700;
      border-radius: 999px;
      background: linear-gradient(135deg, #0d9488, #2dd4bf);
    }
    button.btn-primary:disabled { opacity: 0.6; cursor: wait; }
    .status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f0fdfa;
      color: #0f172a;
    }
    .status.error { background: #fef2f2; color: #991b1b; }
    .docs {
      margin: 0;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .workspace > .card,
    .workspace > .docs { height: 100%; box-sizing: border-box; }
    #doc-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
      max-height: calc(100vh - 240px);
      margin-top: 12px;
    }
    .doc {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      color: #0f172a;
      text-decoration: none;
      background: #fff;
    }
    .doc:hover { background: #f0fdfa; border-color: #99f6e4; }
    .doc strong { display: block; color: #0f172a; font-size: 15px; line-height: 22px; }
    .doc span { color: #64748b; font-size: 14px; }
    .doc .enter {
      flex: none;
      color: #0f766e;
      font-weight: 700;
      font-size: 14px;
    }
    @media (max-width: 860px) {
      .nav {
        width: 100%;
        max-width: none;
        height: auto;
        min-height: 56px;
        margin: 0;
        padding: 10px 16px;
        padding-top: max(10px, env(safe-area-inset-top));
        border-radius: 0;
        box-shadow: none;
        border-bottom: 1px solid #e2e8f0;
      }
      main {
        padding: 16px 16px max(28px, env(safe-area-inset-bottom));
      }
      .page-head {
        margin-bottom: 12px;
      }
      h1 {
        font-size: 22px;
        line-height: 1.3;
      }
      .workspace {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .card,
      .docs {
        border-radius: 16px;
        padding: 16px;
      }
      .title-row {
        margin: 12px 0 6px;
      }
      .title-row:first-child {
        margin-top: 0;
      }
      textarea {
        min-height: 88px;
      }
      #doc-list {
        max-height: none;
      }
      .tip-panel {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: min(280px, calc(100vw - 48px));
        text-align: center;
      }
      .page-head .tip-panel {
        left: auto;
        right: 0;
        transform: none;
      }
    }
  </style>
  <script src="./js/nav-back.js?v=1"></script>
  <script src="./js/icons.js?v=1"></script>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="./index-desktop.html">Linglish</a>
    <a class="back" data-nav="back" href="./index-desktop.html">返回</a>
  </nav>
  <main>
    <div class="page-head">
      <h1>导入学习文档</h1>
      <div class="tip">
        <button class="tip-btn" type="button" aria-expanded="false" aria-controls="tip-page" aria-label="查看说明">
          <span data-lx-icon="help" data-lx-size="16"></span>
        </button>
        <div class="tip-panel" id="tip-page" hidden>
          上传课文会做成朗读字幕。上传英语试卷，或 Grok 生成的试卷网页，会做成网页版试卷，每一段和参考答案都可以点喇叭朗读。
        </div>
      </div>
    </div>
    <div class="workspace">
    <form class="card" id="import-form">
      <div class="title-row">
        <label for="doc-title">文档名称</label>
      </div>
      <input id="doc-title" name="title" type="text" placeholder="例如：三年级 Unit 2 课文">
      <div class="title-row">
        <label for="doc-file">上传文件</label>
        <div class="tip">
          <button class="tip-btn" type="button" aria-expanded="false" aria-controls="tip-file" aria-label="查看支持的文件格式">
            <span data-lx-icon="help" data-lx-size="16"></span>
          </button>
          <div class="tip-panel" id="tip-file" hidden>
            支持英语图片、PDF、Word（docx）、电子书（epub）、TXT、Markdown（.md），以及试卷网页（html）。也可以把 AI 生成的课文直接粘贴到下方。PPT 或旧版 doc 请先另存成 PDF 或 docx。试卷会生成可朗读的网页版。
          </div>
        </div>
      </div>
      <input id="doc-file" name="file" type="file" accept=".pdf,.txt,.md,.markdown,.docx,.epub,.html,.htm,.png,.jpg,.jpeg,.webp">
      <div class="title-row">
        <label for="doc-text">或粘贴课文 / AI 内容</label>
      </div>
      <textarea id="doc-text" name="text" placeholder="把课文或 AI 生成的内容粘贴在这里（支持 Markdown）。如果已经选择了文件，会以文件为准。"></textarea>
      <div class="actions">
        <button class="btn btn-primary" id="import-btn" type="submit">导入并开始上课</button>
      </div>
      <div id="status" class="status" hidden></div>
    </form>
    <section class="docs">
      <div class="title-row">
        <h2>我已导入的</h2>
        <div class="tip">
          <button class="tip-btn" type="button" aria-expanded="false" aria-controls="tip-docs" aria-label="查看列表说明">
            <span data-lx-icon="help" data-lx-size="16"></span>
          </button>
          <div class="tip-panel" id="tip-docs" hidden>
            点一份文档进入学习。试卷会打开网页版试卷。
          </div>
        </div>
      </div>
      <div id="doc-list"><p class="hint">正在读取…</p></div>
    </section>
    </div>
  </main>
  <script>
    const statusEl = document.getElementById('status');

    function closeTips(except) {
      document.querySelectorAll('.tip').forEach((tip) => {
        if (tip === except) return;
        const btn = tip.querySelector('.tip-btn');
        const panel = tip.querySelector('.tip-panel');
        if (btn) btn.setAttribute('aria-expanded', 'false');
        if (panel) panel.hidden = true;
      });
    }

    document.querySelectorAll('.tip').forEach((tip) => {
      const btn = tip.querySelector('.tip-btn');
      const panel = tip.querySelector('.tip-panel');
      if (!btn || !panel) return;
      btn.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        const open = panel.hidden;
        closeTips(tip);
        panel.hidden = !open;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });

    document.addEventListener('click', () => closeTips());
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeTips();
    });

    function readToken() {
      const keys = ['linglish_token', 'authToken'];
      for (const key of keys) {
        try {
          const value = localStorage.getItem(key) || sessionStorage.getItem(key);
          if (value && value !== 'null' && value !== 'undefined') return value;
        } catch (_) {}
      }
      return '';
    }

    function showStatus(message, isError) {
      statusEl.hidden = false;
      statusEl.textContent = message;
      statusEl.className = isError ? 'status error' : 'status';
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function openUrl(article) {
      const pdfPath = String(article.pdf_path || '');
      const tags = Array.isArray(article.tags) ? article.tags : String(article.tags || '').split(/[,{}]/);
      const names = tags.map(tag => String(tag).trim());
      const scanned = names.includes('scan') && !names.includes('exam') && !names.includes('subtitles');
      if (scanned && pdfPath.startsWith('/pdfs/') && !pdfPath.includes('..')) {
        return './pdf-reader.html?path=' + encodeURIComponent(pdfPath);
      }
      return './daily-speaking.html?material=' + encodeURIComponent(article.id);
    }

    async function loadDocuments() {
      const list = document.getElementById('doc-list');
      const token = readToken();
      if (!token) {
        list.innerHTML = '<p class="hint">登录后可以查看已经导入的文档。</p>';
        return;
      }
      try {
        const response = await fetch('/articles', { headers: { Authorization: 'Bearer ' + token } });
        const data = await response.json();
        const kinds = new Set(['pdf', 'text', 'txt', 'md', 'docx', 'epub', 'image']);
        const items = (data.items || []).filter(article =>
          kinds.has(article.source_type) || article.pdf_path
        );
        if (!items.length) {
          list.innerHTML = '<p class="hint">还没有导入的文档。</p>';
          return;
        }
        list.innerHTML = items.map(article => `
          <a class="doc" href="${openUrl(article)}">
            <span>
              <strong>${escapeHtml(article.title || '未命名文档')}</strong>
              <span>${article.word_count || 0} 词 · ${article.level || ''}</span>
            </span>
            <span class="enter">在跟读页打开</span>
          </a>
        `).join('');
      } catch (_) {
        list.innerHTML = '<p class="hint">暂时读不到文档列表。</p>';
      }
    }

    document.getElementById('import-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const token = readToken();
      if (!token) {
        showStatus('请先登录，再导入学习文档。', true);
        window.location.href = './index-desktop.html';
        return;
      }
      const file = document.getElementById('doc-file').files[0];
      const text = document.getElementById('doc-text').value.trim();
      if (!file && !text) {
        showStatus('请上传 PDF、TXT、Markdown，或粘贴课文 / AI 内容。', true);
        return;
      }
      const button = document.getElementById('import-btn');
      button.disabled = true;
      showStatus(file ? '正在导入文档…' : '正在保存课文…', false);
      try {
        const body = new FormData();
        body.append('title', document.getElementById('doc-title').value.trim());
        if (file) body.append('file', file);
        if (text) body.append('text', text);
        const response = await fetch('/documents/import', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token },
          body,
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.message || '导入失败');
        window.location.href = result.document.openUrl;
      } catch (err) {
        showStatus(err.message || '导入失败', true);
        button.disabled = false;
      }
    });

    loadDocuments();
  </script>
</body>
</html>
