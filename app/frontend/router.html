  <script>
    // Filter noisy extension JSON.parse('undefined') errors (does not affect app logic)
    // IMPORTANT: This must be the first script to catch extension errors
    (function(){
      try {
        const patterns = [
          /\"undefined\" is not valid JSON/i,
          /\"null\" is not valid JSON/i,
          /Unexpected token 'u'.*JSON/i,
          /Unexpected token 'n'.*JSON/i,
          /SyntaxError.*undefined.*JSON/i,
          /SyntaxError.*null.*JSON/i,
          /JSON\.parse/i,
          /updateConfig/i,
          /initConfig/i,
          /metadata\.js/i,
          /content\.js/i,
        ];
        const matchMsg = (msg) => {
          try { return patterns.some((re) => re.test(String(msg || ''))); } catch { return false; }
        };

        // Check if error is from extension (check stack trace)
        const isExtensionError = (error) => {
          try {
            if (!error) return false;
            const stack = error.stack || error.toString();
            // Check for common extension patterns
            if (/chrome-extension:\/\//i.test(stack)) return true;
            if (/moz-extension:\/\//i.test(stack)) return true;
            if (/safari-extension:\/\//i.test(stack)) return true;
            if (/webkit-masked-url:\/\//i.test(stack)) return true;
            if (/metadata\.js/i.test(stack)) return true;
            if (/content\.js/i.test(stack)) return true;
            if (/updateConfig|initConfig/i.test(stack)) return true;
            return false;
          } catch (_) {
            return false;
          }
        };

        // Override console methods
        const ce = console.error ? console.error.bind(console) : null;
        const cw = console.warn ? console.warn.bind(console) : null;
        if (ce) {
          console.error = function(...args){
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            // Check if it's an error object
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return ce(...args);
          };
        }
        if (cw) {
          console.warn = function(...args){
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return cw(...args);
          };
        }

        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', (ev) => {
          try {
            const reason = ev?.reason;
            // Check message
            const msg = reason?.message || reason?.toString?.() || reason;
            if (matchMsg(String(msg||''))) {
              ev.preventDefault();
              return;
            }
            // Check if from extension
            if (isExtensionError(reason)) {
              ev.preventDefault();
              return;
            }
          } catch(_) {}
        });

        // Catch error events
        window.addEventListener('error', (ev) => {
          try {
            const msg = ev?.message || '';
            if (matchMsg(String(msg))) {
              ev.preventDefault();
              return;
            }
            // Check if error is from extension
            if (ev?.error && isExtensionError(ev.error)) {
              ev.preventDefault();
              return;
            }
            // Check filename for extension patterns
            const filename = ev?.filename || '';
            if (/chrome-extension|moz-extension|safari-extension|webkit-masked-url|metadata\.js|content\.js/i.test(filename)) {
              ev.preventDefault();
              return;
            }
          } catch(_) {}
        }, true);
      } catch (_) {}
    })();
  </script>

  <script>
    /**
     * linglish 智能设备检测与跳转
     */

    // 检测设备类型
    function detectDevice() {
      const userAgent = navigator.userAgent.toLowerCase();
      const screenWidth = window.innerWidth || document.documentElement.clientWidth;

      // 移动设备检测
      const isMobile = /mobile|android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent);

      // 平板检测
      const isTablet = /ipad|android(?!.*mobile)|tablet/i.test(userAgent);

      // 屏幕宽度检测（小于768px视为移动设备）
      const isSmallScreen = screenWidth < 768;

      // 触摸设备检测
      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

      return {
        isMobile: (isMobile && !isTablet) || isSmallScreen,
        isTablet: isTablet,
        isDesktop: !isMobile && !isTablet && screenWidth >= 768,
        isTouchDevice: isTouchDevice,
        screenWidth: screenWidth,
        userAgent: userAgent
      };
    }

    // 更新设备信息显示
    function updateDeviceInfo(device) {
      const deviceIcon = document.getElementById('device-icon');
      const deviceText = document.getElementById('device-text');

      if (device.isMobile) {
        deviceIcon.textContent = '📱';
        deviceText.textContent = '移动设备 - 加载中...';
      } else if (device.isTablet) {
        deviceIcon.textContent = '💻';
        deviceText.textContent = '平板设备 - 加载中...';
      } else {
        deviceIcon.textContent = '🖥️';
        deviceText.textContent = '桌面设备 - 加载中...';
      }
    }

    function readAuthToken() {
      const keys = ['authToken', 'linglish_token'];
      for (const key of keys) {
        try {
          const value = localStorage.getItem(key);
          if (value && value !== 'null' && value !== 'undefined') return value;
        } catch (_) {}
      }
      for (const key of keys) {
        try {
          const value = sessionStorage.getItem(key);
          if (value && value !== 'null' && value !== 'undefined') return value;
        } catch (_) {}
      }
      return null;
    }

    function currentParams() {
      try {
        return new URLSearchParams(window.location.search || '');
      } catch (_) {
        return new URLSearchParams();
      }
    }

    function routeOverride() {
      const params = currentParams();
      const target = String(params.get('target') || params.get('view') || '').trim().toLowerCase();
      if (target === 'desktop' || target === 'classic' || target === 'home' || params.get('legacy') === '1') {
        return 'desktop';
      }
      if (target === 'today' || target === 'daily') {
        return 'today';
      }
      if (target === 'mobile') {
        return 'mobile';
      }
      return null;
    }

    function localHref(path, extra = {}) {
      const url = new URL(path, window.location.href);
      Object.entries(extra).forEach(([key, value]) => {
        if (value != null && value !== '' && !url.searchParams.has(key)) {
          url.searchParams.set(key, value);
        }
      });
      return `${url.pathname.split('/').pop()}${url.search}${window.location.hash || ''}`;
    }

    function marketingHref(path) {
      const source = currentParams();
      const url = new URL(path, window.location.href);
      ['from', 'intent', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'ref'].forEach((key) => {
        const value = source.get(key);
        if (value && !url.searchParams.has(key)) url.searchParams.set(key, value);
      });
      return `${url.pathname.split('/').pop()}${url.search}${window.location.hash || ''}`;
    }

    function getVisitorId() {
      try {
        const key = 'linglish_visitor_id';
        const existing = localStorage.getItem(key);
        if (/^llv_[a-zA-Z0-9_-]{12,64}$/.test(existing || '')) return existing;
        const random = window.crypto?.getRandomValues
          ? Array.from(window.crypto.getRandomValues(new Uint8Array(16)), (byte) => byte.toString(16).padStart(2, '0')).join('')
          : `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 14)}`;
        const visitorId = `llv_${random}`.slice(0, 68);
        localStorage.setItem(key, visitorId);
        return visitorId;
      } catch (_) {
        return null;
      }
    }

    function trackRouterRedirect(destination, reason, device) {
      try {
        const token = readAuthToken();
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers.Authorization = `Bearer ${token}`;
        const visitorId = getVisitorId();
        fetch('/track/event', {
          method: 'POST',
          headers,
          keepalive: true,
          body: JSON.stringify({
            event_name: 'router_redirect',
            visitor_id: visitorId,
            properties: {
              visitor_id: visitorId,
              to: destination,
              reason,
              override: routeOverride(),
              device: device?.isMobile ? 'mobile' : device?.isTablet ? 'tablet' : 'desktop',
              screen_width: device?.screenWidth || window.innerWidth || null,
            },
          }),
        }).catch(() => {});
      } catch (_) {}
    }

    function redirectTo(destination, reason, device) {
      trackRouterRedirect(destination, reason, device);
      window.location.href = destination;
    }

    // 跳转到对应页面
    function redirectToPage(device) {
      // 检测是否已登录
      const authToken = readAuthToken();
      const override = routeOverride();

      if (override === 'desktop') {
        console.log('🖥️ 手动选择桌面主页');
        redirectTo(localHref('index-desktop.html', { from: 'router_override' }), 'override_desktop', device);
        return;
      }

      if (override === 'today') {
        console.log('📅 手动选择今日训练');
        redirectTo(localHref('today.html', { from: 'router_override' }), 'override_today', device);
        return;
      }

      if (override === 'mobile') {
        console.log('📱 手动选择移动体验');
        redirectTo(authToken ? localHref('mobile-today.html', { from: 'router_override' }) : 'mobile-auth.html', 'override_mobile', device);
        return;
      }

      if (!authToken) {
        // 未登录用户 → 显示着陆页
        console.log('🌿 未登录，跳转到着陆页');
        redirectTo(marketingHref('landing.html'), 'guest_landing', device);
        return;
      }

      if (device.isMobile || device.isTablet) {
        // 移动端/平板 + 已登录 -> 今日学习
        console.log('📅 跳转到今日学习页面');
        redirectTo(localHref('mobile-today.html', { from: 'router' }), 'mobile_today', device);
      } else {
        // 桌面端 + 已登录 -> 今日训练闭环
        console.log('📅 跳转到桌面今日训练');
        redirectTo(localHref('today.html', { from: 'router' }), 'desktop_today', device);
      }
    }

    // 主执行流程
    function init() {
      // 检测设备
      const device = detectDevice();

      // 打印检测信息（调试用）
      console.log('📊 设备检测结果:', {
        类型: device.isMobile ? '移动设备' : device.isTablet ? '平板' : '桌面',
        屏幕宽度: device.screenWidth + 'px',
        触摸设备: device.isTouchDevice ? '是' : '否',
        UserAgent: device.userAgent.substring(0, 50) + '...'
      });

      // 更新UI显示
      updateDeviceInfo(device);

      // 延迟跳转，让用户看到加载动画
      setTimeout(() => {
        redirectToPage(device);
      }, 1200);
    }

    // 页面加载完成后执行
    window.addEventListener('DOMContentLoaded', init);

    // 支持手动选择（调试用）
    // 在控制台输入: forceDesktop() 或 forceMobile()
    window.forceDesktop = function() {
      console.log('🖥️ 强制跳转桌面版');
      window.location.href = 'index-desktop.html?from=router_force';
    };

    window.forceMobile = function() {
      console.log('📱 强制跳转移动版');
      const authToken = readAuthToken();
      window.location.href = authToken ? 'mobile-today.html?from=router_force' : 'mobile-auth.html';
    };
  </script>
