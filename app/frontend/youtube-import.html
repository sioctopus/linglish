  <script>
    // Filter noisy extension JSON.parse('undefined') errors (does not affect app logic)
    // IMPORTANT: This must be the first script to catch extension errors
    (function(){
      try {
        const patterns = [
          /\"undefined\" is not valid JSON/i,
          /\"null\" is not valid JSON/i,
          /Unexpected token 'u'/i,
          /Unexpected token 'n'/i,
          /Unexpected token u in JSON/i,
          /Unexpected token n in JSON/i,
          /SyntaxError.*undefined/i,
          /SyntaxError.*null/i,
          /JSON\.parse/i,
          /updateConfig/i,
          /initConfig/i,
          /metadata\.js/i,
          /content\.js/i,
          /iosMetadata\.js/i,
          /background\.js/i,
          /Wu\.updateConfig/i,
          /ll\.updateConfig/i,
          /ul\.updateConfig/i,
          /Access to storage is not allowed/i,
          /storage is not allowed from this context/i,
          /ios-webRequest/i,
          /content script detected/i,
          /cloudflareinsights/i,
          /beacon\.min\.js/i,
        ];
        const matchMsg = (msg) => {
          try { return patterns.some((re) => re.test(String(msg || ''))); } catch { return false; }
        };

        // Check if error is from extension (check stack trace)
        const isExtensionError = (error) => {
          try {
            if (!error) return false;
            const stack = error.stack || error.toString();
            const name = error.name || '';
            const message = error.message || '';

            // Check error message and name
            if (matchMsg(message) || matchMsg(name)) return true;

            // Check for common extension patterns
            if (/chrome-extension:\/\//i.test(stack)) return true;
            if (/moz-extension:\/\//i.test(stack)) return true;
            if (/safari-extension:\/\//i.test(stack)) return true;
            if (/webkit-masked-url:\/\//i.test(stack)) return true;
            if (/metadata\.js/i.test(stack)) return true;
            if (/content\.js/i.test(stack)) return true;
            if (/iosMetadata\.js/i.test(stack)) return true;
            if (/updateConfig|initConfig/i.test(stack)) return true;
            if (/Wu\.|ul\./i.test(stack)) return true;
            if (/cloudflare|beacon/i.test(stack)) return true;
            return false;
          } catch (_) {
            return false;
          }
        };

        // Override console methods
        const ce = console.error ? console.error.bind(console) : null;
        const cw = console.warn ? console.warn.bind(console) : null;
        if (ce) {
          console.error = function(...args){
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return ce(...args);
          };
        }
        if (cw) {
          console.warn = function(...args){
            const head = args && args.length ? String(args[0]) : '';
            if (matchMsg(head)) return;
            if (args[0] instanceof Error && isExtensionError(args[0])) return;
            return cw(...args);
          };
        }

        // Catch unhandled promise rejections
        window.addEventListener('unhandledrejection', (ev) => {
          try {
            const reason = ev && ev.reason;
            if (reason && reason.name === 'SyntaxError') {
              const msg = reason.message || '';
              if (matchMsg(msg)) {
                ev.preventDefault();
                ev.stopPropagation();
                ev.stopImmediatePropagation();
                return;
              }
            }
            const msg = (reason && reason.message) || (reason && reason.toString && reason.toString()) || reason;
            if (matchMsg(String(msg||''))) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
            if (isExtensionError(reason)) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
          } catch(_) {}
        }, true);

        // Catch error events
        window.addEventListener('error', (ev) => {
          try {
            const msg = (ev && ev.message) || '';
            if (matchMsg(String(msg))) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
            if (ev && ev.error && isExtensionError(ev.error)) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
            const filename = (ev && ev.filename) || '';
            if (/chrome-extension|moz-extension|safari-extension|webkit-masked-url|metadata\.js|content\.js|iosMetadata\.js|^VM\d+:/i.test(filename)) {
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
              return;
            }
          } catch(_) {}
        }, true);
      } catch (_) {}
    })();
  </script>

  <div class="container">
    <div class="page-head">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="14" rx="2"></rect>
          <path d="M10 10.5v5l4.5-2.5-4.5-2.5z" fill="currentColor" stroke="none"></path>
        </svg>
      </div>
      <h1>网络视频上传</h1>
      <p class="subtitle">粘贴网络视频链接，开始英语听写练习</p>
    </div>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>

    <div class="video-preview" id="videoPreview">
      <div class="preview-title" id="previewTitle"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>

    <form id="youtubeForm">
      <div class="form-group">
        <label for="youtubeUrl">网络视频链接</label>
        <input
          type="text"
          id="youtubeUrl"
          name="youtubeUrl"
          placeholder="粘贴网络视频链接（支持 YouTube 等）"
          required
        >
      </div>

      <div class="form-group">
        <label>选择模式</label>
        <div class="mode-selection">
          <div class="mode-card selected" data-mode="temporary">
            <div class="mode-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M10 8.8v6.4l5.4-3.2L10 8.8z" fill="currentColor" stroke="none"></path>
              </svg>
            </div>
            <div>
              <div class="mode-title">临时观看</div>

                直接播放网络视频<br>

          <option value="en">English (英语)</option>

          <option value="zh-CN">Chinese Simplified (简体中文)</option>
          <option value="zh-TW">Chinese Traditional (繁体中文)</option>
          <option value="es">Spanish (西班牙语)</option>
          <option value="fr">French (法语)</option>
          <option value="de">German (德语)</option>
          <option value="ja">Japanese (日语)</option>
          <option value="ko">Korean (韩语)</option>
        </select>

      <div class="form-group">
        <label>难度级别</label>
        <div class="field-hint">不用自己选。字幕出来后，系统按用词和句子自动标成 A1、A2、B1、B2、C1 或 C2。</div>
      </div>

      <!-- 下载保存模式时显示的额外选项 -->
      <div id="save-options" style="display: none;">
        <div class="form-group">
          <label>视频标签 <span style="color: #ef4444;">*</span></label>
          <div class="field-hint" style="margin-bottom: 6px;">请至少选择一个标签</div>

            placeholder="例如：小猪佩奇 / Friends S01"

        </div>

      <div class="button-group">

  <script src="/js/video-reader/import-result.js"></script>
  <script src="/js/youtube-temp-session-store.js"></script>
  <script>
    const form = document.getElementById('youtubeForm');
    const urlInput = document.getElementById('youtubeUrl');
    const languageSelect = document.getElementById('language');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');
    const videoPreview = document.getElementById('videoPreview');
    const previewTitle = document.getElementById('previewTitle');
    const previewInfo = document.getElementById('previewInfo');

    let selectedMode = 'temporary';
    let selectedTags = new Set();
    const saveOptionsDiv = document.getElementById('save-options');
    const tagOptionsDiv = document.getElementById('tag-options');
    const collectionNameInput = document.getElementById('collection-name');

    // 初始化标签选项
    async function initTagOptions() {
      if (!tagOptionsDiv) return;

      // 默认标签（备用）
      let tags = [
        { id: '1', name: '我的', icon: '⭐' },
        { id: '2', name: '职场', icon: '💼' },
        { id: '3', name: '购物', icon: '🛒' },
        { id: '4', name: '生活', icon: '🏠' },
        { id: '5', name: '影视', icon: '🎬' },
        { id: '6', name: '儿童', icon: '🧸' }
      ];

      // 尝试从服务器加载标签
      try {
        const token = getToken();
        if (token) {
          const res = await fetch('/tags', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            if (data.global_tags && data.global_tags.length > 0) {
              tags = data.global_tags.map(t => ({
                id: String(t.id),
                name: t.name,
                icon: t.icon || '🏷️'
              }));
            }
          }
        }
      } catch (e) {
        console.warn('[YouTube Import] Failed to load tags from server:', e);
      }

      tagOptionsDiv.innerHTML = tags.map(tag => `
        <button type="button" class="tag-btn" data-tag-id="${tag.id}">
          <span>${tag.icon}</span>
          <span>${tag.name}</span>
        </button>
      `).join('');

      tagOptionsDiv.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const tagId = btn.dataset.tagId;
          if (selectedTags.has(tagId)) {
            selectedTags.delete(tagId);
            btn.classList.remove('selected');
          } else {
            selectedTags.add(tagId);
            btn.classList.add('selected');
          }
        });
      });
    }

    // Mode selection
    document.querySelectorAll('.mode-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedMode = card.dataset.mode;

        // 显示/隐藏保存选项
        if (saveOptionsDiv) {
          saveOptionsDiv.style.display = selectedMode === 'permanent' ? 'block' : 'none';
        }
      });
    });

    // 初始化标签
    initTagOptions();

    // Get token from localStorage
    function getToken() {
      return localStorage.getItem('linglish_token');
    }

    // Show error message
    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('active');
      successDiv.classList.remove('active');
    }

    // Show success message
    function showSuccess(message) {
      successDiv.textContent = message;
      successDiv.classList.add('active');
      errorDiv.classList.remove('active');
    }

    // Hide messages
    function hideMessages() {
      errorDiv.classList.remove('active');
      successDiv.classList.remove('active');
    }

    // Validate YouTube URL
    function isValidYouTubeUrl(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([^&\n?#]+)/,
        /youtube\.com\/shorts\/([^&\n?#/]+)/,        // Support YouTube Shorts
        /youtu\.be\/([^&\n?#/]+)/                   // Short youtu.be links without query
      ];
      return patterns.some(pattern => pattern.test(url));
    }

    // Fetch video info (preview)
    urlInput.addEventListener('blur', async () => {
      const url = urlInput.value.trim();
      if (!url || !isValidYouTubeUrl(url)) {
        videoPreview.classList.remove('active');
        return;
      }

      try {
        const token = getToken();
        if (!token) {
          console.log('[Debug] No token found, redirecting to login');
          window.location.href = '/index.html';
          return;
        }

        console.log('[Debug] Fetching video info for:', url);
        const response = await fetch('/youtube/info', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ url })
        });

        console.log('[Debug] Response status:', response.status);

        // Check for authentication errors
        if (response.status === 401) {
          console.log('[Debug] Unauthorized, clearing token and redirecting');
          localStorage.removeItem('linglish_token');
          window.location.href = '/index.html';
          return;
        }

        const rawInfo = await response.text();
        let data = {};
        try {
          data = rawInfo ? JSON.parse(rawInfo) : {};
        } catch (err) {
          console.warn('[Debug] /youtube/info non-JSON response, length:', rawInfo?.length || 0);
          data = { success: false };
        }
        console.log('[Debug] Response data:', data);

        if (data.success) {
          previewTitle.textContent = data.title;
          const duration = Math.floor(data.duration / 60);
          previewInfo.innerHTML = `
            <p><strong>时长:</strong> ${duration} 分钟</p>
            <p><strong>作者:</strong> ${data.author}</p>
            ${data.description ? `<p><strong>描述:</strong> ${data.description.substring(0, 150)}...</p>` : ''}
          `;
          videoPreview.classList.add('active');
        }
      } catch (error) {
        console.error('Failed to fetch video info:', error);
      }
    });

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const url = urlInput.value.trim();
      const language = languageSelect.value;

      if (!url) {
        showError('请输入网络视频链接');
        return;
      }

      if (!isValidYouTubeUrl(url)) {
        showError('请输入有效的网络视频链接');
        return;
      }

      // 下载保存模式需要验证标签。难度由字幕自动判定。
      if (selectedMode === 'permanent') {
        if (selectedTags.size === 0) {
          showError('请至少选择一个视频标签');
          tagOptionsDiv?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
      }

      const token = getToken();
      if (!token) {
        console.log('[Debug] No token on submit, redirecting to login');
        showError('请先登录');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 2000);
        return;
      }

      try {
        loading.classList.add('active');
        submitBtn.disabled = true;

        const endpoint = selectedMode === 'temporary' ? '/youtube/session' : '/youtube/import';
        console.log('[Debug] Submitting to endpoint:', endpoint);
        console.log('[Debug] Request data:', { url, language, mode: selectedMode });

        // 构建请求数据
        const requestData = { url, language, mode: selectedMode };
        if (selectedMode === 'permanent') {
          requestData.tags = Array.from(selectedTags);
          const collectionName = (collectionNameInput?.value || '').trim();
          if (collectionName) requestData.collection_name = collectionName;
        }

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(requestData)
        });

        console.log('[Debug] Submit response status:', response.status);

        // Check for authentication errors
        if (response.status === 401) {
          console.log('[Debug] Unauthorized on submit, clearing token and redirecting');
          localStorage.removeItem('linglish_token');
          showError('登录已过期，请重新登录');
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 2000);
          return;
        }

        const raw = await response.text();
        let data = {};
        try {
          data = raw ? JSON.parse(raw) : {};
        } catch (err) {
          console.warn('[Debug] Response is not JSON, raw length:', raw?.length || 0);
          data = { success: false, error: `服务器返回异常 (${response.status})` };
        }
        console.log('[Debug] Submit response data:', data);

        // If edge/CDN timeout (524) but backend likely still processing, tell user they can leave
        if (response.status === 524) {
          showSuccess('上传已完成，后台正在转录，稍后到视频页查看结果');
          loading.classList.remove('active');
          submitBtn.disabled = false;
          return;
        }

        if (data.success) {
          if (selectedMode === 'temporary') {
            // Redirect to YouTube reader with session data
            console.log('[Debug] Temporary mode, saving session and redirecting to youtube-reader.html');
            if (!window.YouTubeTempSessionStore) {
              const storeError = new Error('Temporary session store did not load');
              storeError.code = 'TEMP_SESSION_STORAGE_UNAVAILABLE';
              throw storeError;
            }
            await window.YouTubeTempSessionStore.saveAndNavigate(data.session, '/youtube-reader.html');
          } else {
            // Redirect to video detail page (will show in regular video reader)
            console.log('[Debug] Permanent mode, redirecting to video-reader-desktop.html');
            // 文案按 alreadyExists 区分：新建成功 vs 视频已存在（两种都返回统一的 video.id）
            const importResult = window.ImportResult.parseImportResult(data);
            if (importResult.videoId != null) {
              showSuccess(importResult.message);
              setTimeout(() => {
                window.location.href = `/video-reader-desktop.html?id=${importResult.videoId}`;
              }, 1500);
            } else {
              console.error('[Debug] Missing video id in response:', data);
              showError(importResult.message);
            }
          }
        } else {
          console.error('[Debug] Request failed:', data.error);

          // Improve error message for "No transcript available"
          let errorMessage = data.error || '导入失败，请重试';
          if (errorMessage.includes('No transcript available') ||
              errorMessage.includes('Transcript is disabled') ||
              errorMessage.includes('请在 YouTube 上启用字幕')) {
            errorMessage = `❌ 视频转录失败

⚠️ 系统已尝试：
   1. YouTube 官方字幕 API ❌ 失败
   2. Innertube 字幕抓取 ❌ 失败
   3. 下载视频 + Whisper AI 转录 ❌ 失败

📝 可能原因：
   • 视频确实没有字幕且无法生成
   • 视频音频质量太差
   • OpenAI API 配额不足
   • 网络连接问题

💡 建议：
   • 选择有官方字幕的视频（CC 标记）
   • 检查 OpenAI API 密钥配置
   • 尝试较短的视频（<5分钟）

推荐渠道（都有官方字幕）：
   • TED Talks
   • BBC Learning English
   • VOA Learning English`;
          }

          showError(errorMessage);
          loading.classList.remove('active');
          submitBtn.disabled = false;
        }
      } catch (error) {
        console.error('Import error:', error);
        if (error && (error.code === 'TEMP_SESSION_STORAGE_UNAVAILABLE' || error.code === 'TEMP_SESSION_INVALID')) {
          const message = window.YouTubeTempSessionStore?.getSaveErrorMessage
            ? window.YouTubeTempSessionStore.getSaveErrorMessage(error)
            : '浏览器无法保存临时视频数据，请清理本站缓存，或切换“下载保存”模式。';
          showError(message);
        } else if (String(error).includes('524')) {
          showError('请求超时，请稍后重试或更换视频（524）');
        } else {
          showError('网络错误，请检查连接后重试');
        }
        loading.classList.remove('active');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
