        this.clozeInputEl = document.getElementById('cloze-input');
        this.clozeFeedbackEl = document.getElementById('cloze-feedback');
        this.clozeCheckBtn = document.getElementById('cloze-check-btn');
        this.contextEl = document.getElementById('review-context');
        this.pronouncePlayBtn = document.getElementById('pronounce-play-btn');
        this.pronounceRecordBtn = document.getElementById('pronounce-record-btn');
        this.pronouncePlaybackBtn = document.getElementById('pronounce-playback-btn');
        this.pronounceFeedbackEl = document.getElementById('pronounce-feedback');

        // Load language preference (default to 'zh' like mobile)
        try {
          this.dictLang = localStorage.getItem('dict_lang_mode') || 'zh';
        } catch (_) {
          this.dictLang = 'zh';
        }

        try {
          const savedMode = localStorage.getItem('vocab_review_mode');
          if (savedMode) this.mode = savedMode;
        } catch (_) { }
        this.bindEvents();
        this.updateLangButtons();
        this.setMode(this.mode);
        this.updateTranslationToggle();
        this.loadDueCount();
        this.submitReviewDebounced = debounce((quality) => this.submitReview(quality), 150);
      },

      bindEvents() {
        // Start review button
        const startBtn = document.getElementById('start-review-btn');
        if (startBtn) {
          startBtn.addEventListener('click', () => this.start());
        }

        // Close button
        if (this.closeBtn) {
          this.closeBtn.addEventListener('click', () => this.close());
        }

        // Backdrop click to close
        const backdrop = this.overlay?.querySelector('.review-backdrop');
        if (backdrop) {
          backdrop.addEventListener('click', () => this.close());
        }

        // Flashcard click to flip
        if (this.flashcard) {
          this.flashcard.addEventListener('click', () => {
            if (!this.isFlipped && this.currentReview) {
              this.flipCard();
            }
          });
        }

        // Speak button
        if (this.speakBackBtn) {
          this.speakBackBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (this.currentReview) {
              speakWord(this.currentReview.lemma);
            }
          });
        }

        if (this.translateToggleBtn) {
          this.translateToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.setTranslationReveal(!this.translationRevealed);
          });
        }

        // Quality buttons
        document.querySelectorAll('.quality-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const quality = btn.getAttribute('data-quality');
            this.submitReviewDebounced(quality);
          });
        });

        // Language toggle buttons (header)
        const langZh = document.getElementById('review-lang-zh');
        const langEn = document.getElementById('review-lang-en');
        if (langZh) {
          langZh.addEventListener('click', (e) => {
            e.stopPropagation();
            this.setDictLang('zh');
          });
        }
        if (langEn) {
          langEn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.setDictLang('en');
          });
        }

        this.modeButtons.forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const mode = btn.dataset.mode;
            this.setMode(mode);
          });
        });

        if (this.listenPlayBtn) {
          this.listenPlayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (this.currentReview) speakWord(this.currentReview.lemma);
          });
        }
        if (this.listenOptionsEl) {
          this.listenOptionsEl.addEventListener('click', (e) => {
            const option = e.target.closest('.mode-option');
            if (!option || option.dataset.disabled === 'true') return;
            this.handleListenAnswer(option.dataset.value || '');
          });
        }
        if (this.spellingPlayBtn) {
          this.spellingPlayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (this.currentReview) speakWord(this.currentReview.lemma);
          });
        }
        if (this.spellingCheckBtn) {
          this.spellingCheckBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.handleSpellingAnswer();
          });
        }
        if (this.clozeCheckBtn) {
          this.clozeCheckBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.handleClozeAnswer();
          });
        }
        if (this.pronouncePlayBtn) {
          this.pronouncePlayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (this.currentReview) speakWord(this.currentReview.lemma);
          });
        }
        if (this.pronounceRecordBtn) {
          this.pronounceRecordBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.togglePronounceRecording();
          });
        }
        if (this.pronouncePlaybackBtn) {
          this.pronouncePlaybackBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.playPronounceRecording();
          });
        }

      },

      formatTime(seconds) {
        const sec = Number(seconds);
        if (!Number.isFinite(sec)) return '';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      },

      async loadContextsForReview() {
        if (!this.currentReview?.lemma) return;
        const lemma = this.currentReview.lemma;
        if (Array.isArray(this.currentReview.contexts) && this.currentReview.contexts.length) {
          this.updateContextPanel();
          if (this.currentReview.entry) this.renderExamples(this.currentReview.entry);
          return;
        }
        if (this.contextCache.has(lemma)) {
          this.currentReview.contexts = this.contextCache.get(lemma) || [];
          this.updateContextPanel();
          if (this.currentReview.entry) this.renderExamples(this.currentReview.entry);
          return;
        }
        try {
          const res = await fetch(`${API_BASE}/vocab/item?lemma=${encodeURIComponent(lemma)}`, { headers: headers() });
          if (!res.ok) throw new Error('failed');
          const data = await res.json();
          const contexts = Array.isArray(data?.contexts) ? data.contexts : [];
          this.contextCache.set(lemma, contexts);
          this.currentReview.contexts = contexts;
          this.updateContextPanel();
          if (this.currentReview.entry) this.renderExamples(this.currentReview.entry);
        } catch (_) {
          this.contextCache.set(lemma, []);
        }
      },

      setDictLang(lang) {
        this.dictLang = lang;
        try {
          localStorage.setItem('dict_lang_mode', lang);
        } catch (_) {}
        this.updateLangButtons();

        if (lang === 'zh') {
          this.translationRevealed = true;
          this.updateTranslationToggle();
        } else {
          this.translationRevealed = false;
          this.updateTranslationToggle();
        }

        // Refresh current card definitions
        if (this.currentReview) {
          this.loadDefinitions(this.currentReview.lemma);
        }
      },

      setTranslationReveal(show) {
        this.translationRevealed = !!show;
        if (this.translationRevealed) {
          this.dictLang = 'zh';
        }
        this.updateTranslationToggle();
        if (this.currentReview) {
          this.renderTranslationVisibility();
        }
      },

      updateTranslationToggle() {
        if (!this.translateToggleBtn) return;
        this.translateToggleBtn.textContent = this.translationRevealed ? '隐藏翻译' : '查看翻译';
        this.translateToggleBtn.dataset.state = this.translationRevealed ? 'shown' : 'hidden';
      },

      renderTranslationVisibility() {
        if (!this.currentReview) return;
        const showZh = this.translationRevealed;
        const zh = this.currentReview.wordTranslation || this.currentReview.definitions?.zh || '';
        if (this.headerTranslationEl) {
          this.headerTranslationEl.textContent = showZh ? zh : '';
          this.headerTranslationEl.style.display = (showZh && zh) ? 'block' : 'none';
        }
        if (this.translationBackEl) {
          this.translationBackEl.textContent = showZh ? zh : '';
          this.translationBackEl.style.display = (showZh && zh) ? 'block' : 'none';
        }
        if (this.translationFrontEl) {
          this.translationFrontEl.textContent = (showZh && zh) ? zh : '';
          this.translationFrontEl.style.display = (showZh && zh) ? 'block' : 'none';
        }
        if (this.currentReview.entry) {
          this.renderDefinitions(this.currentReview.entry);
          this.renderExamples(this.currentReview.entry);
        }
        this.updateContextPanel();
      },

      escapeHtml(value) {
        return String(value || '').replace(/[&<>\"']/g, (m) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[m]);
      },

      updateLangButtons() {
        // Header buttons (legacy, now hidden)
        const langZh = document.getElementById('review-lang-zh');
        const langEn = document.getElementById('review-lang-en');
        if (langZh && langEn) {
          langZh.classList.toggle('active', this.dictLang === 'zh');
          langEn.classList.toggle('active', this.dictLang === 'en');
        }
      },

      setMode(mode) {
        const next = mode || 'flashcard';
        this.mode = next;
        try { localStorage.setItem('vocab_review_mode', next); } catch (_) { }
        this.modeButtons.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === next);
        });
        this.renderMode();
      },

      renderMode() {
        const mode = this.mode;
        if (this.flashcardWrapEl) {
          this.flashcardWrapEl.style.display = mode === 'flashcard' ? '' : 'none';
        }
        Object.entries(this.modePanels).forEach(([key, panel]) => {
          if (!panel) return;
          panel.classList.toggle('active', key === mode);
        });
        if (mode !== 'flashcard') {
          this.hideQualityButtons();
        }
        if (mode === 'listening') {
          this.renderListeningOptions();
        }
        if (mode === 'spelling') {
          if (this.spellingInputEl) this.spellingInputEl.value = '';
          if (this.spellingFeedbackEl) this.spellingFeedbackEl.textContent = '';
        }
        if (mode === 'cloze') {
          if (this.clozeInputEl) this.clozeInputEl.value = '';
          if (this.clozeFeedbackEl) this.clozeFeedbackEl.textContent = '';
          this.renderClozeSentence();
        }
        this.updateContextPanel();
      },

      hideQualityButtons() {
        if (this.qualityButtonsEl) {
          this.qualityButtonsEl.style.display = 'none';
        }
      },

      showQualityButtons() {
        if (this.qualityButtonsEl) {
          this.qualityButtonsEl.style.display = 'block';
        }
      },

      renderListeningOptions() {
        if (!this.listenOptionsEl || !this.currentReview) return;
        const correct = this.currentReview.lemma;
        const pool = this.reviewQueue.map(item => item.lemma).filter(Boolean);
        const choices = new Set([correct]);
        while (choices.size < 4 && pool.length) {
          const pick = pool[Math.floor(Math.random() * pool.length)];
          if (pick) choices.add(pick);
        }
        const optionList = Array.from(choices).sort(() => Math.random() - 0.5);
        this.listenOptionsEl.innerHTML = optionList.map(word => `
          <button class="mode-option" data-value="${word}">${word}</button>
        `).join('');
        if (this.listenFeedbackEl) this.listenFeedbackEl.textContent = '听完后选择正确单词。';
        setTimeout(() => {
          if (this.currentReview) speakWord(this.currentReview.lemma);
        }, 150);
      },

      handleListenAnswer(value) {
        if (!this.currentReview || !this.listenOptionsEl) return;
        const correct = this.currentReview.lemma;
        const options = this.listenOptionsEl.querySelectorAll('.mode-option');
        options.forEach(opt => {
          opt.dataset.disabled = 'true';
          const word = opt.dataset.value;
          if (word === correct) opt.classList.add('correct');
          if (word === value && word !== correct) opt.classList.add('wrong');
        });
        if (this.listenFeedbackEl) {
          this.listenFeedbackEl.textContent = value === correct ? '答对了！' : `正确答案：${correct}`;
        }
        this.showQualityButtons();
      },

      handleSpellingAnswer() {
        if (!this.currentReview || !this.spellingInputEl) return;
        const input = this.spellingInputEl.value.trim().toLowerCase();
        const correct = String(this.currentReview.lemma || '').toLowerCase();
        if (this.spellingFeedbackEl) {
          this.spellingFeedbackEl.textContent = input === correct ? '拼写正确！' : `正确拼写：${this.currentReview.lemma}`;
        }
        this.showQualityButtons();
      },

      handleClozeAnswer() {
        if (!this.currentReview || !this.clozeInputEl) return;
        const input = this.clozeInputEl.value.trim().toLowerCase();
        const correct = String(this.currentReview.lemma || '').toLowerCase();
        if (this.clozeFeedbackEl) {
          this.clozeFeedbackEl.textContent = input === correct ? '填空正确！' : `正确答案：${this.currentReview.lemma}`;
        }
        this.showQualityButtons();
      },

      updateContextPanel() {
        if (!this.contextEl || !this.currentReview) return;
        if (this.mode === 'flashcard') {
          this.contextEl.hidden = true;
          return;
        }
        const word = this.currentReview.lemma || '';
        const contexts = Array.isArray(this.currentReview.contexts) ? this.currentReview.contexts : [];
        const ctx = contexts[0];
        const ctxSentence = ctx?.sentence || ctx?.text || '';
        const ctxZh = ctx?.sentence_zh || ctx?.sentenceZh || '';
        const ctxStart = ctx?.start_sec ?? ctx?.start ?? ctx?.startTime ?? null;
        const ctxVideoId = ctx?.video_resource_id ?? ctx?.videoId ?? ctx?.video_id ?? ctx?.video_resource ?? null;
        const example = ctxSentence || this.currentReview.example || '';
        const exampleZh = ctxZh || this.currentReview.exampleZh || '';

        if (!example) {
          this.contextEl.hidden = true;
          return;
        }

        const safe = example.replace(new RegExp(word, 'ig'), (m) => `<mark>${m}</mark>`);
        const timeLabel = Number.isFinite(Number(ctxStart)) ? this.formatTime(Number(ctxStart)) : '';
        const jumpLink = (ctxVideoId && Number.isFinite(Number(ctxStart)))
          ? `<a href="./video-reader-desktop.html?videoId=${encodeURIComponent(ctxVideoId)}&startSec=${encodeURIComponent(Number(ctxStart))}" style="margin-left:0.5rem;color:#0f766e;text-decoration:none;">跳回视频</a>`
          : '';
        const showZh = this.translationRevealed;
        this.contextEl.innerHTML = `
          <div style="font-weight:600; margin-bottom:0.3rem;">📌 语境例句 ${timeLabel ? `<span style="color:#2dd4bf;">${timeLabel}</span>` : ''} ${jumpLink}</div>
          <div>${safe}</div>
          ${(showZh && exampleZh) ? `<div style="color:#64748b; margin-top:0.35rem;">${exampleZh}</div>` : ''}
        `;
        this.contextEl.hidden = false;
      },

      renderClozeSentence() {
        if (!this.clozeSentenceEl || !this.currentReview) return;
        const word = this.currentReview.lemma || '';
        const contexts = Array.isArray(this.currentReview.contexts) ? this.currentReview.contexts : [];
        const ctx = contexts[0];
        const example = (ctx?.sentence || ctx?.text || '') || this.currentReview.example || '';
        let sentence = '';
        if (example) {
          sentence = example.replace(new RegExp(word, 'ig'), '____');
        } else {
          const def = this.currentReview.definitions?.zh || this.currentReview.definitions?.en || '';
          sentence = def ? `根据释义填写：${def.replace(word, '____')}` : '请填入正确单词：____';
        }
        this.clozeSentenceEl.textContent = sentence;
      },

      async togglePronounceRecording() {
        if (this.practiceRecorder && this.practiceRecorder.state === 'recording') {
          this.practiceRecorder.stop();
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          const chunks = [];
          recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
          recorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            this.practiceRecording = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
            if (this.pronouncePlaybackBtn) this.pronouncePlaybackBtn.disabled = false;
            if (this.pronounceFeedbackEl) this.pronounceFeedbackEl.textContent = '录音完成，点击回放检查。';
            this.practiceRecorder = null;
          };
          this.practiceRecorder = recorder;
          recorder.start();
          if (this.pronounceFeedbackEl) this.pronounceFeedbackEl.textContent = '录音中...再点一次结束。';
        } catch (err) {
          if (this.pronounceFeedbackEl) this.pronounceFeedbackEl.textContent = '无法录音，请检查麦克风权限。';
        }
      },

      playPronounceRecording() {
        if (!this.practiceRecording) return;
        const audio = new Audio(URL.createObjectURL(this.practiceRecording));
        audio.onended = () => URL.revokeObjectURL(audio.src);
        audio.play().catch(() => { });
      },

      async loadDueCount() {
        try {
          const res = await fetch(`${API_BASE}/vocab/stats-summary`, { headers: headers() });
          if (res.ok) {
            const data = await res.json();
            const dueCount = data.due || 0;
            const badge = document.getElementById('review-due-count');
            if (badge) {
              badge.textContent = dueCount;
              badge.style.display = dueCount > 0 ? 'inline-block' : 'none';
            }
          }
        } catch (e) {
          console.error('[ReviewManager] loadDueCount error:', e);
        }
      },

      async start() {
        try {
          showToast('加载复习队列...', 'info');

          const res = await fetch(`${API_BASE}/vocab/review-queue?limit=10`, {
            headers: headers()
          });

          if (!res.ok) throw new Error('Failed to fetch review queue');

          const data = await res.json();
          const rawItems = Array.isArray(data.items) ? data.items : [];

          this.reviewQueue = rawItems
            .map(item => ({
              ...item,
              lemma: item.lemma || item.word,
              definitions: item.definitions || {},
              phonetic: item.phonetic || item.ipa || '',
              state: item.state || 'learning',
              contexts: Array.isArray(item.contexts) ? item.contexts : (item.context_sentence || item.source_sentence || item.best_sentence_text ? [{
                sentence: item.context_sentence || item.source_sentence || item.best_sentence_text || '',
                start_sec: item.context_start_sec ?? item.start_sec ?? item.best_sentence_start_sec ?? null,
                end_sec: item.context_end_sec ?? item.end_sec ?? item.best_sentence_end_sec ?? null,
                video_resource_id: item.video_resource_id ?? item.video_id ?? item.best_sentence_video_id ?? null
              }] : [])
            }))
            .filter(item => item.lemma && item.lemma.trim().length > 0);

          if (this.reviewQueue.length === 0) {
            showToast('暂无待复习词汇', 'info');
            return;
          }

          this.currentIndex = 0;
          this.showOverlay();
          await this.showNext();

        } catch (err) {
          console.error('[ReviewManager] Start failed:', err);
          showToast('加载复习队列失败', 'warn');
        }
      },

      showOverlay() {
        if (this.overlay) {
          this.overlay.hidden = false;
          this.overlay.style.display = 'flex';
          document.body.style.overflow = 'hidden';
        }
      },

      hideOverlay() {
        if (this.overlay) {
          this.overlay.hidden = true;
          this.overlay.style.display = 'none';
          document.body.style.overflow = '';
        }
      },

      async showNext() {
        if (this.currentIndex >= this.reviewQueue.length) {
          this.finish();
          return;
        }

        this.currentReview = this.reviewQueue[this.currentIndex];
        this.isFlipped = false;
        this.currentReview.example = '';
        this.currentReview.exampleZh = '';
        this.currentReview.contexts = [];
        this.currentReview.entry = null;
        this.currentReview.wordTranslation = '';
        this.translationRevealed = false;
        this.updateTranslationToggle();
        this.updateContextPanel();

        // Reset card state
        if (this.flashcard) {
          this.flashcard.classList.remove('flipped');
        }
        if (this.qualityButtonsEl) {
          this.qualityButtonsEl.style.display = 'none';
        }

        // Update progress
        this.updateProgress();

        // Render front
        this.renderFront();

        // Pre-load back side data
        await this.loadDefinitions(this.currentReview.lemma);
        await this.loadContextsForReview();
        this.renderMode();
      },

      renderFront() {
        const word = this.currentReview.lemma || '';

        // Card front - only show word (no translation, let user think first)
        if (this.wordFrontEl) {
          this.wordFrontEl.textContent = word;
        }
        if (this.headerWordEl) {
          this.headerWordEl.textContent = word;
        }
        if (this.headerTranslationEl) {
          this.headerTranslationEl.textContent = '';
          this.headerTranslationEl.style.display = 'none';
        }
        if (this.translationFrontEl) {
          this.translationFrontEl.textContent = '';
          this.translationFrontEl.style.display = 'none';
        }
        if (this.translationBackEl) {
          this.translationBackEl.textContent = '';
          this.translationBackEl.style.display = 'none';
        }
      },

      async loadDefinitions(word) {
        try {
          // Update back side word
          if (this.wordBackEl) {
            this.wordBackEl.textContent = word;
          }

          // Update translation (both front and back sides)
          const zh = this.currentReview?.wordTranslation || this.currentReview?.definitions?.zh || '';
          const showZh = this.translationRevealed;
          if (this.headerTranslationEl) {
            if (showZh && zh) {
              this.headerTranslationEl.textContent = zh;
              this.headerTranslationEl.style.display = 'block';
            } else {
              this.headerTranslationEl.textContent = '';
              this.headerTranslationEl.style.display = 'none';
            }
          }
          if (this.translationBackEl) {
            if (showZh && zh) {
              this.translationBackEl.textContent = zh;
              this.translationBackEl.style.display = 'block';
            } else {
              this.translationBackEl.style.display = 'none';
            }
          }
          // Update front side translation (show in Chinese mode)
          if (this.translationFrontEl) {
            if (showZh && zh) {
              this.translationFrontEl.textContent = zh;
              this.translationFrontEl.style.display = 'block';
            } else {
              this.translationFrontEl.style.display = 'none';
            }
          }

          // Fetch dictionary data
          const res = await fetch(`${API_BASE}/dictionary/${encodeURIComponent(word)}`, {
            headers: headers()
          });

          if (!res.ok) {
            if (this.definitionsEl) {
              this.definitionsEl.innerHTML = '<div style="color:#94a3b8;">暂无详细释义</div>';
            }
            return;
          }

          const data = await res.json();
          const entry = data.entry;
          this.currentReview.wordTranslation = data?.zh || this.currentReview.wordTranslation || '';
          this.currentReview.entry = entry;

          // Extract context example for review mode
          let example = '';
          let exampleZh = '';
          if (entry?.meanings) {
            for (const meaning of entry.meanings) {
              const defs = Array.isArray(meaning.definitions) ? meaning.definitions : [];
              for (const def of defs) {
                if (def.example) {
                  example = def.example;
                  exampleZh = def.exampleZh || '';
                  break;
                }
              }
              if (example) break;
            }
          }
          if (!this.currentReview.example) {
            this.currentReview.example = example;
            this.currentReview.exampleZh = exampleZh;
          }

          // Update phonetic
          let phonetic = entry?.phonetic || this.currentReview.phonetic || '';
          if (!phonetic && Array.isArray(entry?.phonetics)) {
            const p = entry.phonetics.find(p => p?.text || p?.phonetic);
            phonetic = p?.text || p?.phonetic || '';
          }
          const phoneticText = phonetic ? `/${phonetic}/` : '';

          if (this.phoneticEl) {
            this.phoneticEl.textContent = phoneticText;
          }
          if (this.phoneticFrontEl) {
            this.phoneticFrontEl.textContent = phoneticText;
          }

          if (this.translationRevealed) {
            this.renderTranslationVisibility();
          } else {
            this.renderDefinitions(entry);
            this.renderExamples(entry);
            this.updateContextPanel();
          }

        } catch (err) {
          console.error('[ReviewManager] loadDefinitions error:', err);
          if (this.definitionsEl) {
            this.definitionsEl.innerHTML = '<div style="color:#94a3b8;">加载释义失败</div>';
          }
        }
      },

      renderDefinitions(entry) {
        if (!this.definitionsEl) return;
        const defs = this.collectDefinitions(entry);
        const html = this.buildDefinitionsHtml(defs, this.translationRevealed);
        this.definitionsEl.innerHTML = html || '<div style="color:#94a3b8;">暂无详细释义</div>';
      },

      renderExamples(entry) {
        if (!this.examplesEl) return;
        const showZh = this.translationRevealed;
        const defs = this.collectDefinitions(entry);
        const examples = [];
        const ctx = Array.isArray(this.currentReview?.contexts) ? this.currentReview.contexts[0] : null;
        const ctxSentence = ctx?.sentence || ctx?.text || '';
        const ctxZh = ctx?.sentence_zh || ctx?.sentenceZh || '';
        const ctxStart = ctx?.start_sec ?? ctx?.start ?? ctx?.startTime ?? null;
        const ctxVideoId = ctx?.video_resource_id ?? ctx?.videoId ?? ctx?.video_id ?? ctx?.video_resource ?? null;
        if (ctxSentence) {
          const timeLabel = Number.isFinite(Number(ctxStart)) ? this.formatTime(Number(ctxStart)) : '';
          const jumpLink = (ctxVideoId && Number.isFinite(Number(ctxStart)))
            ? `<a href="./video-reader-desktop.html?videoId=${encodeURIComponent(ctxVideoId)}&startSec=${encodeURIComponent(Number(ctxStart))}" style="margin-left:6px;color:#0f766e;text-decoration:none;">跳回</a>`
            : '';
          examples.push({
            meta: `${this.escapeHtml(timeLabel || '语境')}${jumpLink}`,
            en: ctxSentence,
            zh: ctxZh
          });
        }

        defs.filter(d => d.example).slice(0, 3).forEach(d => {
          examples.push({
            meta: '例句',
            en: d.example,
            zh: d.exampleZh || ''
          });
        });

        const trimmed = examples.slice(0, 3);
        if (!trimmed.length) {
          this.examplesEl.innerHTML = '<div style="color:#94a3b8;">暂无例句</div>';
          return;
        }

        this.examplesEl.innerHTML = trimmed.map(item => `
          <div class="example-item">
            <div class="example-meta">${item.meta}</div>
            <div class="example-en">${this.escapeHtml(item.en || '')}</div>
            ${showZh && item.zh ? `<div class="example-zh">${this.escapeHtml(item.zh || '')}</div>` : ''}
          </div>
        `).join('');
      },

      collectDefinitions(entry) {
        const defs = [];
        if (!entry || !Array.isArray(entry.meanings)) return defs;
        entry.meanings.forEach(m => {
          const pos = m.partOfSpeech || '';
          (m.definitions || []).forEach(d => {
            defs.push({
              pos,
              def: d.definition || '',
              zh: d.zh || '',
              example: d.example || '',
              exampleZh: d.exampleZh || ''
            });
          });
        });
        return defs;
      },

      buildDefinitionsHtml(defs, showZh) {
        if (!defs || !defs.length) return '';

        const useZh = !!showZh;
        let html = '';

        defs.slice(0, 4).forEach(d => {
          const pos = d.pos || '';
          const enDef = d.def || '';
          const zhDef = d.zh || '';

          if (pos) {
            html += `<span style="display:inline-block;background:#e0e7ff;color:#0f5e52;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;margin:0 0 6px;">${pos}</span>`;
          }

          if (useZh && zhDef && !zhDef.startsWith('[待翻译]') && !zhDef.includes('翻译中')) {
            html += `<div style="margin:4px 0;color:#334155;">${this.escapeHtml(zhDef)}</div>`;
            html += `<div style="margin:2px 0 10px;color:#94a3b8;font-size:13px;">${this.escapeHtml(enDef)}</div>`;
          } else {
            html += `<div style="margin:4px 0 10px;color:#334155;">${this.escapeHtml(enDef)}</div>`;
          }
        });

        return html;
      },

      flipCard() {
        this.isFlipped = true;
        if (this.flashcard) {
          this.flashcard.classList.add('flipped');
        }
        this.showQualityButtons();

        // Auto-play pronunciation
        setTimeout(() => {
          if (this.currentReview) {
            speakWord(this.currentReview.lemma);
          }
        }, 400);
      },

      updateProgress() {
        const total = this.reviewQueue.length;
        const current = this.currentIndex + 1;
        if (this.progressTextEl) {
          this.progressTextEl.textContent = `${current} / ${total}`;
        }
      },

      scheduleListRender() {
        if (this.listRenderPending) return;
        this.listRenderPending = true;
        requestAnimationFrame(() => {
          this.listRenderPending = false;
          renderList();
        });
      },

      async submitReview(quality) {
        if (!this.currentReview || this.reviewSubmitting) return;
        this.reviewSubmitting = true;

        try {
          const outcome = this.mapQualityToOutcome(quality);

          const res = await fetch(`${API_BASE}/vocab/review`, {
            method: 'POST',
            headers: headers(),
            body: JSON.stringify({
              lemma: this.currentReview.lemma,
              outcome: outcome
            })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data?.message || '提交失败');

          // Sync local list state so "已掌握" / "学习中" badge stays accurate.
          const updatedItem = data?.item;
          const updatedLemma = (updatedItem?.lemma || updatedItem?.word || updatedItem?.word_lowercase || '').toString();
          if (updatedLemma && Array.isArray(state.items) && state.currentTab === 'my') {
            const backendState = String(updatedItem.state || updatedItem.status || '').toLowerCase();
            const uiState =
              (backendState === 'mastered' || backendState === 'known') ? 'known'
                : (backendState === 'learning' || backendState === 'reviewing') ? 'learning'
                  : (backendState === 'encountered') ? 'new'
                    : 'new';
            const idx = state.items.findIndex(it => String(it?.lemma || '').toLowerCase() === updatedLemma.toLowerCase());
          if (idx >= 0) {
            state.items[idx] = { ...state.items[idx], state: uiState };
          }
        }

          // Ensure stats (including "已掌握") update immediately after each review click.
          // This fixes cases where a word crosses into "mastered" but the dashboard stays stale until finishing the session.
          await loadStats();
          this.scheduleListRender();
          recordReviewHistory(1);
          const done = loadDailyDone() + 1;
          saveDailyDone(done);
          renderStats();

          // Move to next
          this.currentIndex++;
          setTimeout(() => this.showNext(), 300);

        } catch (err) {
          console.error('[ReviewManager] submitReview error:', err);
          showToast(err?.message || '提交失败', 'warn');
        } finally {
          this.reviewSubmitting = false;
        }
      },

      mapQualityToOutcome(quality) {
        switch (quality) {
          case 'again': return 'fail';
          case 'hard': return 'pass';
          case 'good': return 'pass';
          // "完全掌握" should promote to mastered immediately (and update stats).
          case 'easy': return 'mastered';
          default: return 'pass';
        }
      },

      finish() {
        this.close();
        showToast('本轮复习完成! 🎉', 'success');
        // Refresh stats (also updates due badge)
        Promise.resolve(loadStats()).then(() => this.scheduleListRender());
      },

      close() {
        this.hideOverlay();
        try {
          if (this.practiceRecorder && this.practiceRecorder.state === 'recording') {
            this.practiceRecorder.stop();
          }
        } catch (_) { }
        this.reviewQueue = [];
        this.currentIndex = 0;
        this.currentReview = null;
        this.isFlipped = false;
      }
    };

    // Initialize ReviewManager
    ReviewManager.init();
  </script>
  <script src="./js/onboarding-tour.js?v=1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const steps = [
        { target: '#q', title: '搜索词汇', text: '输入关键词，快速定位你要复习的词。' },
        { target: '#start-review-btn', title: '开始复习', text: '点击开始进入智能复习流程。' },
        { target: '#list', title: '词汇列表', text: '浏览词汇卡片，随时调整难度。' }
      ];
      if (window.startLinglishTour) {
        window.startLinglishTour(steps, 'linglish_tour_vocab');
      }
    });
  </script>
